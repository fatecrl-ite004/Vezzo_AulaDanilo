// --- LINHA DE FLUXO — assinatura discreta do login (canvas próprio, recriado a cada render) ---
function iniciarAnimacaoHero(){
  const canvas = document.getElementById('fluxo-hero');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const W = canvas.width, H = canvas.height;
  const reduzMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function desenhar(t){
    if (!document.body.contains(canvas)) return; // tela trocou, encerra este loop
    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle = '#0B7A6C';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x=0; x<=W; x+=2){
      const fase = reduzMovimento ? 0 : t/900;
      const env = Math.min(1, x/40) * Math.min(1, (W-x)/40 + .3);
      const y = H/2 + Math.sin(x/22 + fase) * 8 * env;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();

    if (!reduzMovimento){
      const px = (t/20) % W;
      const env = Math.min(1, px/40) * Math.min(1, (W-px)/40 + .3);
      const py = H/2 + Math.sin(px/22 + t/900) * 8 * env;
      ctx.fillStyle = '#0B7A6C';
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
      requestAnimationFrame(desenhar);
    }
  }
  requestAnimationFrame(desenhar);
}

function agendaPadraoId(profId){

  return ag ? ag.id : null;
}

function dataParaDate(iso){ return new Date(iso + 'T00:00:00'); }
function dateParaISO(d){ return d.toISOString().slice(0,10); }
function adicionarDiasISO(iso, dias){ const d=dataParaDate(iso); d.setDate(d.getDate()+dias); return dateParaISO(d); }
function horarioBloqueado(profId, data, agendaId){ return state.bloqueios.some(b => b.profissionalId === profId && b.data === data && (agendaId==null || b.agendaId===agendaId)); }

/* --- Horários compartilhados entre agendas (convênios) ---
   O mesmo dia/hora pode existir em várias agendas do profissional. Quando um paciente
   pega o horário em uma agenda, o mesmo dia/hora das outras agendas deixa de aparecer.
   Se a consulta for cancelada, o horário volta a ficar disponível em todas as agendas. */
function horariosEspelho(h){
  if (!h) return [];
  return state.horarios.filter(x => x.id !== h.id
    && x.profissionalId === h.profissionalId
    && x.data === h.data
    && x.hora === h.hora);
}
function espelhoReservado(h){
  return horariosEspelho(h).find(x => x.pacienteId != null || x.status === 'concluido') || null;
}
function horarioDisponivelParaPaciente(h){
  return !espelhoReservado(h);
}

/* --- Prioridade entre agendas e janela de exclusividade ---
   Cada agenda do profissional tem uma "prioridade" (1 = mais prioritária). Quando o mesmo
   dia/hora existe em mais de uma agenda, a agenda de maior prioridade fica visível para
   agendamento imediatamente; as demais só aparecem para o paciente depois que a janela de
   exclusividade (em horas, configurável) expira, ou assim que a vaga é ocupada em algum lugar
   (a partir daí a fila de espera vale para qualquer convênio, como já acontecia antes). */
function agendaPrioritariaParaHorario(h){
  if (!h) return null;
  const idsAgendas = [h.agendaId, ...horariosEspelho(h).map(x => x.agendaId)];
  const agendas = state.agendas.filter(a => idsAgendas.includes(a.id));
  if (!agendas.length) return null;
  return agendas.slice().sort((a,b) => (a.prioridade ?? 9999) - (b.prioridade ?? 9999))[0];
}
function dentroJanelaExclusividade(h){
  if (!h || h.pacienteId != null || espelhoReservado(h)) return false; // já ocupado em algum lugar: não esconde mais
  const janela = Number(state.configuracoes.janelaExclusividadeHoras) || 0;
  if (janela <= 0) return false;
  const prioritaria = agendaPrioritariaParaHorario(h);
  if (!prioritaria || prioritaria.id === h.agendaId) return false; // esta é a agenda prioritária
  return horasAteConsulta(h) > janela;
}
function limiteExclusividade(h){
  const d = new Date(h.data + 'T' + h.hora + ':00');
  d.setHours(d.getHours() - (Number(state.configuracoes.janelaExclusividadeHoras) || 0));
  return d;
}
function formatarLimiteExclusividade(h){
  return limiteExclusividade(h).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function adicionarHorarioPorData(profId, data, hora, modalidade, agendaId){
  const ag = agendaId ?? agendaPadraoId(profId);
  if (horarioBloqueado(profId, data, ag)) return { ok:false, motivo:'bloqueado' };
  const conflito = state.horarios.find(h => h.profissionalId===profId && h.data===data && h.hora===hora && h.agendaId===ag);
  if (conflito) return { ok:false, motivo:'conflito', agendaId: conflito.agendaId };
  const novoId = state.proximoIdHorario++;
  state.horarios.push({ id: novoId, profissionalId:profId, agendaId: ag, data, hora, modalidade, status:'livre', pacienteId:null, fila:[], filaOrigem:[] });
  setTimeout(() => tentarEncaixe(novoId), 0);
  return { ok:true };
}

async function bloquearPeriodo() {
  const inicio = document.getElementById('bloq-inicio')?.value;
  const fim = document.getElementById('bloq-fim')?.value;
  const motivo = document.getElementById('bloq-motivo')?.value?.trim() || 'Indisponibilidade';

  if (!inicio || !fim) return mensagemErro('Informe o início e o fim do período.');
  if (inicio < hojeISO() || fim < inicio) return mensagemErro('Confira o período de bloqueio.');
  if (!agendaSelecionadaId) return mensagemErro('Selecione uma agenda antes de bloquear um período.');

  const agenda = state.agendas.find(a => a.id === agendaSelecionadaId);

  if (!agenda?.supabaseId) {
    return mensagemErro('Agenda não encontrada no Supabase. Atualize a página e tente novamente.');
  }

  const registros = [];
  let ocupadas = 0;
  let data = inicio;

  while (data <= fim) {
    if (!horarioBloqueado(state.usuario.id, data, agendaSelecionadaId)) {
      const ocupados = state.horarios.filter(h =>
        h.profissionalId === state.usuario.id &&
        h.agendaId === agendaSelecionadaId &&
        h.data === data &&
        (h.pacienteId || h.fila.length)
      );

      if (ocupados.length) {
        ocupadas++;
      } else {
        registros.push({
          profissional_id: state.usuario.id,
          agenda_id: agenda.supabaseId,
          data,
          motivo
        });
      }
    }

    data = adicionarDiasISO(data, 1);
  }

  if (!registros.length) {
    return mensagemErro(
      ocupadas
        ? `Nenhuma data foi bloqueada porque ${ocupadas} dia(s) possuem atendimento ou fila.`
        : 'Todas as datas selecionadas já estão bloqueadas.'
    );
  }

  try {
    const { data: bloqueiosSalvos, error } = await supabaseClient
      .from('bloqueios')
      .insert(registros)
      .select('*');

    if (error) throw error;

    for (const b of bloqueiosSalvos) {
      const { error: erroExcluirHorarios } = await supabaseClient
        .from('horarios')
        .delete()
        .eq('profissional_id', state.usuario.id)
        .eq('agenda_id', b.agenda_id)
        .eq('data', b.data)
.eq('status', 'livre');

      if (erroExcluirHorarios) throw erroExcluirHorarios;

      state.bloqueios.push({
        id: state.proximoIdBloqueio++,
        supabaseId: b.id,
        profissionalId: b.profissional_id,
        agendaId: agendaSelecionadaId,
        data: b.data,
        motivo: b.motivo || 'Indisponibilidade'
      });

   state.horarios = state.horarios.filter(h =>
  !(h.profissionalId === state.usuario.id &&
    h.agendaId === agendaSelecionadaId &&
    h.data === b.data &&
    h.status === 'livre')
);
    }

    salvarDados();

    mostrarToast(
      `${bloqueiosSalvos.length} ${bloqueiosSalvos.length === 1 ? 'data bloqueada' : 'datas bloqueadas'}${ocupadas ? ` · ${ocupadas} não bloqueada(s) por terem atendimento/fila` : ''}.`,
      ocupadas ? 'info' : 'success'
    );

    render();

  } catch (erro) {
    console.error('Erro ao salvar bloqueios:', erro);
    mensagemErro('Não foi possível salvar os bloqueios no Supabase.');
  }
}

}

if (r.ok) {

      else if (r.motivo === 'bloqueado') bloqueados++;

async function removerRecorrencia(id) {
  const r = state.recorrencias.find(x => x.id === id);
  if (!r) return;

  try {
    const agenda = state.agendas.find(a => a.id === r.agendaId);

    // Exclui do Supabase somente os horários livres
    // correspondentes aos dias da recorrência.
    let data = r.inicio;

    while (data <= r.fim) {
      const diaSemana = dataParaDate(data).getDay();

      if (r.dias.includes(diaSemana)) {
        const { error } = await supabaseClient
          .from('horarios')
          .delete()
          .eq('profissional_id', r.profissionalId)
          .eq('agenda_id', agenda.supabaseId)
          .eq('data', data)
          .eq('hora', r.hora)
          .eq('status', 'livre');

        if (error) throw error;
      }

      data = adicionarDiasISO(data, 1);
    }

    // Exclui o registro da recorrência no Supabase.
    if (r.supabaseId) {
      const { error } = await supabaseClient
        .from('recorrencias')
        .delete()
        .eq('id', r.supabaseId)
        .eq('profissional_id', r.profissionalId);

      if (error) throw error;
    }

    // Atualiza os dados locais.
    state.horarios = state.horarios.filter(h =>
      !(h.profissionalId === r.profissionalId &&
        h.agendaId === r.agendaId &&
        h.hora === r.hora &&
        h.data >= r.inicio &&
        h.data <= r.fim &&
        r.dias.includes(dataParaDate(h.data).getDay()) &&
        !h.pacienteId &&
        !h.fila.length)
    );

    state.recorrencias = state.recorrencias.filter(x => x.id !== id);

    salvarDados();
    mostrarToast('Recorrência removida com sucesso.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao remover recorrência:', erro);
    mensagemErro('Não foi possível remover a recorrência no Supabase.');
  }
}

async function excluirAgenda(id) {
  const minhas = agendasDoProfissional(state.usuario.id);

  if (minhas.length <= 1) {
    confirmandoExclusaoAgendaId = null;
    return mensagemErro('Você precisa manter ao menos uma agenda.');
  }

  const ocupados = state.horarios.filter(
    h => h.agendaId === id && (h.status !== 'livre' || h.pacienteId || h.fila.length)
  );

  if (ocupados.length) {
    confirmandoExclusaoAgendaId = null;
    return mensagemErro('Não é possível excluir: há consultas confirmadas ou fila nesta agenda.');
  }

  const agenda = state.agendas.find(a => a.id === id);
  if (!agenda) return;

  try {
    const { error: erroHorarios } = await supabaseClient
      .from('horarios')
      .delete()
      .eq('agenda_id', agenda.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (erroHorarios) throw erroHorarios;

    const { error: erroAgenda } = await supabaseClient
      .from('agendas')
      .delete()
      .eq('id', agenda.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (erroAgenda) throw erroAgenda;

    const nomeAgenda = agenda.nome;

    state.horarios = state.horarios.filter(h => h.agendaId !== id);
    state.recorrencias = state.recorrencias.filter(r => r.agendaId !== id);
    state.bloqueios = state.bloqueios.filter(b => b.agendaId !== id);
    state.agendas = state.agendas.filter(a => a.id !== id);

    confirmandoExclusaoAgendaId = null;

    if (agendaSelecionadaId === id) {
      agendaSelecionadaId = agendasDoProfissional(state.usuario.id)[0]?.id ?? null;
    }

    salvarDados();
    mostrarToast(`Agenda "${nomeAgenda}" excluída.`, 'info');
    render();

  } catch (erro) {
    console.error('Erro ao excluir agenda:', erro);
    mensagemErro('Não foi possível excluir a agenda.');
  }
}



async function moverPrioridadeAgenda(id, direcao) {
  const minhas = agendasDoProfissional(state.usuario.id)
    .slice()
    .sort((a, b) => (a.prioridade ?? 0) - (b.prioridade ?? 0));

  const idx = minhas.findIndex(a => a.id === id);
  const alvoIdx = idx + direcao;

  if (idx === -1 || alvoIdx < 0 || alvoIdx >= minhas.length) return;

  const a = minhas[idx];
  const b = minhas[alvoIdx];

  const prioridadeA = a.prioridade;
  const prioridadeB = b.prioridade;

  try {
    const atualizacoes = await Promise.all([
      supabaseClient
        .from('agendas')
        .update({ prioridade: prioridadeB })
        .eq('id', a.supabaseId)
        .eq('profissional_id', state.usuario.id),

      supabaseClient
        .from('agendas')
        .update({ prioridade: prioridadeA })
        .eq('id', b.supabaseId)
        .eq('profissional_id', state.usuario.id)
    ]);

    const erro = atualizacoes.find(resultado => resultado.error)?.error;
    if (erro) throw erro;

    a.prioridade = prioridadeB;
    b.prioridade = prioridadeA;

    salvarDados();
    mostrarToast('Ordem de prioridade atualizada.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao alterar prioridade:', erro);
    mensagemErro('Não foi possível atualizar a prioridade.');
  }
}

function carregarDados() {
  const salvo = localStorage.getItem('fluxoConsultaState');
  if (salvo) {
    state = JSON.parse(salvo);
    // Migração robusta: versões anteriores podem ter estruturas incompletas no LocalStorage.
    state.profissionais = Array.isArray(state.profissionais) ? state.profissionais : [];
    state.pacientes = Array.isArray(state.pacientes) ? state.pacientes : [];
    state.horarios = Array.isArray(state.horarios) ? state.horarios : [];
    state.consultas = Array.isArray(state.consultas) ? state.consultas : [];
    state.notificacoes = Array.isArray(state.notificacoes) ? state.notificacoes : [];
    state.bloqueios = Array.isArray(state.bloqueios) ? state.bloqueios : [];
    if (!Number.isInteger(state.proximoIdBloqueio)) {
  state.proximoIdBloqueio = 1;
}
    state.recorrencias = Array.isArray(state.recorrencias) ? state.recorrencias : [];
    state.confirmacoes = state.confirmacoes && typeof state.confirmacoes === 'object' ? state.confirmacoes : {};
    state.anotacoesPrivadas = state.anotacoesPrivadas && typeof state.anotacoesPrivadas === 'object' ? state.anotacoesPrivadas : {};
    state.reagendamentos = state.reagendamentos && typeof state.reagendamentos === 'object' ? state.reagendamentos : {};
    state.avaliacoes = state.avaliacoes && typeof state.avaliacoes === 'object' ? state.avaliacoes : {};
    state.preferenciasEncaixe = Array.isArray(state.preferenciasEncaixe) ? state.preferenciasEncaixe : [];
    state.ofertasEncaixe = Array.isArray(state.ofertasEncaixe) ? state.ofertasEncaixe : [];
    state.lembretesEnviados = state.lembretesEnviados && typeof state.lembretesEnviados === 'object' ? state.lembretesEnviados : {};
    state.configuracoes = state.configuracoes && typeof state.configuracoes === 'object' ? state.configuracoes : {};
    state.horarios.forEach(h => { h.id=Number(h.id); h.profissionalId=Number(h.profissionalId); h.pacienteId=h.pacienteId==null?null:Number(h.pacienteId); h.fila=Array.isArray(h.fila)?h.fila.map(Number):[]; h.status=h.status|| (h.pacienteId?'ocupado':'livre'); if(!Array.isArray(h.filaOrigem) || h.filaOrigem.length!==h.fila.length) h.filaOrigem = h.fila.map(()=>h.agendaId); });
    state.consultas.forEach(c => { c.id=Number(c.id); c.pacienteId=Number(c.pacienteId); c.horarioId=Number(c.horarioId); c.status=c.status||'confirmada'; });
    // Migração do encaixe: faixas múltiplas, ids inteiros de oferta, validade e paciente em estados antigos
    state.preferenciasEncaixe.forEach(p => {
      p.consultaId = Number(p.consultaId);
      if (!Array.isArray(p.diasDisponiveis)) {
        p.diasDisponiveis = (p.dias || []).map(d => ({ diaSemana: Number(d), faixas: [{ inicio: p.horaInicio || '08:00', fim: p.horaFim || '18:00' }] }));
        delete p.dias; delete p.horaInicio; delete p.horaFim;
      }
      if (p.pacienteId == null) { const cc = state.consultas.find(x => x.id === p.consultaId); if (cc) p.pacienteId = cc.pacienteId; }
      if (p.horaLimite == null) p.horaLimite = '';
    });
    if (!Number.isInteger(state.proximoIdOfertaEncaixe)) state.proximoIdOfertaEncaixe = 1 + Math.max(0, ...state.ofertasEncaixe.map(o => Number.isInteger(o.id) ? o.id : 0));
    state.ofertasEncaixe.forEach(o => {
      if (!Number.isInteger(o.id)) { const ant = o.id; o.id = state.proximoIdOfertaEncaixe++; state.notificacoes.forEach(n => { if (n.ofertaEncaixeId === ant) n.ofertaEncaixeId = o.id; }); }
      o.consultaId = Number(o.consultaId); o.horarioLivreId = Number(o.horarioLivreId);
      if (o.pacienteId == null) { const cc = state.consultas.find(x => x.id === o.consultaId); if (cc) o.pacienteId = cc.pacienteId; }
      if (!o.expiraEm) o.expiraEm = new Date(new Date(o.criadaEm || Date.now()).getTime() + 120 * 60000).toISOString();
    });
    // Migração leve: garante que dados salvos antes destas melhorias não quebrem a tela.
    // Compatibilidade com estados salvos de versões anteriores: IDs devem ter o mesmo tipo.
    state.profissionais = (state.profissionais || []).map(p => ({...p, id:Number(p.id)}));
    state.pacientes = (state.pacientes || []).map(p => ({...p, id:Number(p.id)}));
    state.horarios = (state.horarios || []).map(h => ({...h, id:Number(h.id), profissionalId:Number(h.profissionalId), pacienteId:h.pacienteId == null ? null : Number(h.pacienteId)}));
    state.consultas = (state.consultas || []).map(c => ({...c, id:Number(c.id), pacienteId:Number(c.pacienteId), horarioId:Number(c.horarioId), alertaFaltas:!!c.alertaFaltas}));
    if (state.agendaAberta === undefined) state.agendaAberta = false;
    if (!Array.isArray(state.bloqueios)) state.bloqueios = [];
    if (!Array.isArray(state.recorrencias)) state.recorrencias = [];
    if (state.proximoIdRecorrencia === undefined) state.proximoIdRecorrencia = 1;
    if (!state.lembretesEnviados) state.lembretesEnviados = {};
    if (!state.confirmacoes) state.confirmacoes = {};
    if (!state.configuracoes) state.configuracoes = { cancelamentoHoras: 4, confirmacaoHoras: 3, lembrete24h: true, lembrete2h: true };
    if (state.configuracoes.cancelamentoHoras == null) state.configuracoes.cancelamentoHoras = 4;
    if (state.configuracoes.confirmacaoHoras == null) state.configuracoes.confirmacaoHoras = 3;
    if (state.configuracoes.janelaExclusividadeHoras == null) state.configuracoes.janelaExclusividadeHoras = 48;
    if (state.configuracoes.aceiteFilaMin == null) state.configuracoes.aceiteFilaMin = 120;
    if (!state.configuracoes.confirmacaoV2) { state.configuracoes.confirmacaoHoras = 24; state.configuracoes.confirmacaoV2 = true; }
    state.consultas.forEach(c => { if (c.status==='confirmada' && !state.confirmacoes[c.id]) { const h=getHorario(c.horarioId); if (h) iniciarConfirmacao(c,h); } });
    // Migração: adiciona clínicas para estados salvos de versões anteriores (sem esse conceito)
    if (!Array.isArray(state.clinicas) || !state.clinicas.length) {
      state.clinicas = clinicasPadrao();
      state.proximoIdClinica = 3;
    }
    if (state.clinicaSelecionadaId === undefined) state.clinicaSelecionadaId = null;
    if (state.proximoIdClinica === undefined) state.proximoIdClinica = (Math.max(0, ...state.clinicas.map(c=>c.id)) + 1);
    state.clinicas.forEach(c => {
      if (!c.codigoConvite) c.codigoConvite = gerarCodigoConvite();
      if (!c.email) c.email = `clinica${c.id}@email.com`;
      if (!c.senha) c.senha = '123';
    });
    // Migração: cria o conceito de agendas (grades independentes por convênio/particular) para estados salvos anteriores
    if (!Array.isArray(state.agendas)) state.agendas = [];
    if (state.proximoIdAgenda === undefined) state.proximoIdAgenda = 1;
    state.profissionais.forEach(p => {
      if (!state.agendas.some(a => a.profissionalId === p.id)) {
        state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: p.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
      }
    });
    const primeiraAgendaDoProf = {};
    state.agendas.forEach(a => { if (!(a.profissionalId in primeiraAgendaDoProf)) primeiraAgendaDoProf[a.profissionalId] = a.id; });
    state.horarios.forEach(h => { if (h.agendaId == null) h.agendaId = primeiraAgendaDoProf[h.profissionalId] ?? null; });
    state.recorrencias.forEach(r => { if (r.agendaId == null) r.agendaId = primeiraAgendaDoProf[r.profissionalId] ?? null; });
    state.bloqueios.forEach(b => { if (b.agendaId == null) b.agendaId = primeiraAgendaDoProf[b.profissionalId] ?? null; });
    // Migração: define a prioridade de cada agenda (1 = mais prioritária) preservando a ordem existente,
    // para estados salvos antes do recurso de janela de exclusividade.
    (() => {
      const contador = {};
      state.agendas.forEach(a => {
        if (a.prioridade == null) {
          contador[a.profissionalId] = (contador[a.profissionalId] || 0) + 1;
          a.prioridade = contador[a.profissionalId];
        }
      });
    })();
    state.profissionais.forEach(p => {
      if (!p.especialidade) p.especialidade = p.profissao;
      if (!p.avatar) p.avatar = '🧑⚕️';
      if (!p.descricao) p.descricao = 'Profissional cadastrado no Vezzo.';
      if (!p.modalidadeAtendimento) p.modalidadeAtendimento = 'presencial';
      if (p.localAtendimento === undefined) p.localAtendimento = '';
      if (p.clinicaId === undefined || p.clinicaId === null) p.clinicaId = state.clinicas[state.clinicas.length - 1].id;
    });
    state.notificacoes.forEach(n => { if (n.lida === undefined) n.lida = false; if (n.profissionalId === undefined) n.profissionalId = null; });
  } else {
    semearDados();
  }
}

function getPaciente(id){ return state.pacientes.find(p => p.id === id); }
function getProfissional(id){ return state.profissionais.find(p => p.id === id); }
function getHorario(id){ return state.horarios.find(h => h.id === id); }
function getClinica(id){ return state.clinicas.find(c => c.id === id); }
function gerarCodigoConvite(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let codigo='';
  do {
    codigo = 'FLUXO-' + Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  } while (state.clinicas.some(c=>c.codigoConvite===codigo));
  return codigo;
}

function formatarDataCurta(iso){
  const d = new Date(iso + 'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
  return s.charAt(0).toUpperCase() + s.slice(1).replace('.', '');
}
function formatarDataCompleta(iso){
  const d = new Date(iso + 'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

let toasts = [];
let toastTimer = null;

function escaparHtml(v){
  return String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
}

function mostrarToast(mensagem, tipo='success'){
  const id = Date.now() + Math.random();
  toasts.push({id, mensagem, tipo});
  renderToasts();
  setTimeout(() => { toasts = toasts.filter(t => t.id !== id); renderToasts(); }, 3200);
}

function renderToasts(){
  let wrap = document.getElementById('toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div'); wrap.id = 'toast-wrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap);
  }
  wrap.innerHTML = toasts.map(t => `<div class="toast ${t.tipo}"><span>${t.tipo==='success'?'✓':t.tipo==='error'?'!':'i'}</span><span class="text-sm">${escaparHtml(t.mensagem)}</span></div>`).join('');
}

function mensagemErro(mensagem){ mostrarToast(mensagem, 'error'); }

function notificar(pacienteId, tipo, mensagem, profissionalId = null){
  state.notificacoes.unshift({
    id: state.proximoIdNotificacao++,
    pacienteId, profissionalId, tipo, mensagem,
    lida: false,
    criadaEm: new Date().toISOString(),
  });
}

function pacienteTemConflito(pacienteId, data, hora){
  return state.consultas.some(c => {
    if (c.pacienteId !== pacienteId) return false;
    if (!['confirmada', 'fila'].includes(c.status)) return false;
    const h = getHorario(c.horarioId);
    return h && h.data === data && h.hora === hora;
  });
}

function horarioJaEncerrado(data, hora){
  const agora = new Date();
  const hojeStr = hojeISO();
  if (data > hojeStr) return false;
  if (data < hojeStr) return true;
  const horaAtual = agora.toTimeString().slice(0,5);
  return hora <= horaAtual;
}

function horasAteConsulta(h){
  if(!h) return Infinity;
  const d = new Date(h.data + 'T' + h.hora + ':00');
  return (d.getTime() - Date.now()) / 3600000;
}
function consultaJaPassou(h){
  if(!h || !h.data || !h.hora) return false;
  return horasAteConsulta(h) <= 0;
}
function lembreteChave(c, tipo){ return `${c.id}:${tipo}`; }
function processarLembretes(){
  encProcessar();
  if(!state.usuario) return;
  const agora = Date.now();
  const limite = Number(state.configuracoes.confirmacaoHoras) || 24;
  state.consultas.filter(c=>c.status==='confirmada').forEach(c=>{
    const h=getHorario(c.horarioId); if(!h) return;
    const horas=horasAteConsulta(h);
    if(horas < 0) return;
    const prof=getProfissional(h.profissionalId); if(!prof) return;
    const conf=state.confirmacoes[c.id];
    const nomePac=getPaciente(c.pacienteId)?.nome||'Cliente';

    if(conf && conf.status==='pendente' && conf.aceiteAte){
      if(agora >= conf.aceiteAte){
        if(h.fila.length){
          conf.status='expirada';
          notificar(c.pacienteId,'cancelamento',`Você não confirmou a tempo e a vaga com ${prof.nome} (${formatarDataCurta(h.data)} às ${h.hora}) passou para o próximo da fila.`);
          notificar(null,'cancelamento_paciente',`${nomePac} não confirmou a vaga a tempo (${formatarDataCurta(h.data)} às ${h.hora}); a vaga passou para o próximo da fila.`,prof.id);
          liberarHorarioEPromover(h.id,c.id);
        } else { conf.status='confirmada'; conf.auto=true; }
      }
    } else if(conf && conf.status==='pendente'){
      if(horas <= limite && h.fila.length){
        conf.status='expirada';
        notificar(c.pacienteId,'cancelamento',`Sua reserva com ${prof.nome} (${formatarDataCurta(h.data)} às ${h.hora}) foi liberada porque não foi confirmada dentro do prazo.`);
        notificar(null,'cancelamento_paciente',`${nomePac} não confirmou a consulta de ${formatarDataCurta(h.data)} às ${h.hora}; a vaga foi repassada para a fila.`,prof.id);
        liberarHorarioEPromover(h.id,c.id);
        return;
      }
      if(horas <= limite && !conf.avisoPrazo){
        conf.avisoPrazo=true;
        notificar(c.pacienteId,'confirmacao_pendente',`O prazo para confirmar sua consulta com ${prof.nome} terminou. Confirme agora: se alguém entrar na fila, a vaga será repassada.`);
        state.notificacoes[0].consultaId=c.id;
      } else if(horas > limite && horas <= limite+6 && !conf.lembretePrazo){
        conf.lembretePrazo=true;
        notificar(c.pacienteId,'confirmacao_pendente',`Falta pouco: confirme sua consulta com ${prof.nome} até ${formatarPrazoConfirmacao(h)} para garantir a vaga.`);
        state.notificacoes[0].consultaId=c.id;
      }
    }

    if(state.configuracoes.lembrete24h && horas <= 24 && horas > 2 && !state.lembretesEnviados[lembreteChave(c,'24h')]){
      notificar(c.pacienteId,'lembrete24',`Lembrete: sua consulta com ${prof.nome} é ${formatarDataCurta(h.data)} às ${h.hora}.`);
      state.lembretesEnviados[lembreteChave(c,'24h')] = agora;
    }
    if(state.configuracoes.lembrete2h && horas <= 2 && horas > 0 && !state.lembretesEnviados[lembreteChave(c,'2h')]){
      notificar(c.pacienteId,'lembrete2h',`Sua consulta com ${prof.nome} começa em até 2 horas, às ${h.hora}.`);
      state.lembretesEnviados[lembreteChave(c,'2h')] = agora;
    }
  });
}
function prazoConfirmacao(h){
  const tit = state.consultas.find(x => x.horarioId===h.id && x.status==='confirmada');
  const ac = tit && state.confirmacoes[tit.id]?.aceiteAte;
  if (ac) return new Date(ac);
  const d = new Date(h.data + 'T' + h.hora + ':00');
  d.setHours(d.getHours() - (Number(state.configuracoes.confirmacaoHoras) || 24));
  return d;
}
function formatarPrazoConfirmacao(h){
  return prazoConfirmacao(h).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
// true = ficou pendente; false = confirmada automaticamente (agendou dentro do prazo)
function iniciarConfirmacao(c, h){
  if (horasAteConsulta(h) <= (Number(state.configuracoes.confirmacaoHoras) || 24)) {
    state.confirmacoes[c.id] = { status:'confirmada', auto:true, confirmadoEm:new Date().toISOString() };
    return false;
  }
  state.confirmacoes[c.id] = { status:'pendente', criadoEm:new Date().toISOString() };
  return true;
}
function textoFila(h){
  const tit = state.consultas.find(x => x.horarioId===h.id && x.status==='confirmada');
  return state.confirmacoes[tit?.id]?.status === 'pendente'
    ? `Quem reservou ainda não confirmou. Se não confirmar até ${formatarPrazoConfirmacao(h)}, a vaga passa para você automaticamente.`
    : 'Você é avisado(a) automaticamente se essa vaga abrir.';
}

function consultaPodeSerCancelada(c){
  const h=getHorario(c.horarioId); if(!h) return {ok:false,motivo:'Consulta não encontrada.'};
  const limite=Number(state.configuracoes.cancelamentoHoras)||4;
  if(horasAteConsulta(h) < limite) return {ok:false,motivo:`O prazo mínimo para cancelamento é de ${limite} horas antes da consulta.`};
  return {ok:true};
}
function contarFaltasPaciente(pacienteId){ return state.consultas.filter(c=>c.pacienteId===pacienteId && c.status==='faltou').length; }
function clienteComMuitasFaltas(pacienteId){ return contarFaltasPaciente(pacienteId)>=3; }

function salvarAnotacaoPrivada(consultaId){
  const c=state.consultas.find(x=>x.id===consultaId); if(!c||state.usuario.tipo!=='profissional') return;
  const el=document.getElementById('nota-'+consultaId); const texto=(el?.value||'').trim();
  if(!texto) return mensagemErro('Escreva uma observação antes de salvar.');
  const arr=Array.isArray(state.anotacoesPrivadas[consultaId])?state.anotacoesPrivadas[consultaId]:[];
  arr.push({id:Date.now(),profissionalId:state.usuario.id,texto,criadoEm:new Date().toISOString()}); state.anotacoesPrivadas[consultaId]=arr;
  mostrarToast('Anotação privada salva.'); render();
}

  const modal=document.createElement('div'); modal.id='modal-reagendamento'; modal.className='fixed inset-0 bg-black/40 z-[80] flex items-center justify-center p-4'; modal.innerHTML=`<div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl"><h3 class="font-display text-xl">Reagendar consulta</h3><p class="text-sm text-[var(--ink-soft)] mt-2">${escaparHtml(prof?.nome||'Profissional')} · escolha um novo horário.</p>${op?`<select id="novo-horario-reag" class="w-full border border-[var(--line)] rounded-lg p-2 mt-4">${op}</select><div class="flex gap-2 mt-5"><button class="btn-ghost flex-1 py-2" onclick="document.getElementById('modal-reagendamento')?.remove()">Cancelar</button><button class="btn-primary flex-1 py-2" onclick="confirmarReagendamento(${consultaId})">Reagendar</button></div>`:`<div class="card p-4 mt-4 text-sm">Não há horários livres disponíveis no momento.</div><button class="btn-ghost w-full py-2 mt-4" onclick="document.getElementById('modal-reagendamento')?.remove()">Fechar</button>`}</div>`; document.body.appendChild(modal); }

  c.horarioId=novo.id; c.status='confirmada'; novo.pacienteId=c.pacienteId; novo.status='ocupado'; c.reagendadoDe=antigo?.id||null; c.reagendadoEm=new Date().toISOString(); state.reagendamentos[c.id]={de:antigo?.id||null,para:novo.id,data:c.reagendadoEm}; notificar(c.pacienteId,'reagendamento',`Sua consulta com ${prof?.nome||'profissional'} foi reagendada para ${formatarDataCurta(novo.data)} às ${novo.hora}.`); notificar(null,'reagendamento_profissional',`Consulta de ${getPaciente(c.pacienteId)?.nome||'cliente'} reagendada para ${formatarDataCurta(novo.data)} às ${novo.hora}.`,prof?.id); document.getElementById('modal-reagendamento')?.remove(); mostrarToast('Consulta reagendada com sucesso.'); render(); }
function salvarAvaliacao(consultaId){ const c=state.consultas.find(x=>x.id===consultaId); if(!c||c.status!=='realizada')return; const nota=Number(document.getElementById('nota-av-'+consultaId)?.value||0); const comentario=(document.getElementById('coment-av-'+consultaId)?.value||'').trim(); if(nota<1||nota>5)return mensagemErro('Escolha uma nota de 1 a 5.'); state.avaliacoes[consultaId]={nota,comentario,criadoEm:new Date().toISOString()}; const h=getHorario(c.horarioId); notificar(null,'avaliacao_recebida',`Você recebeu uma avaliação de ${getPaciente(c.pacienteId)?.nome||'cliente'}.`,h?.profissionalId); mostrarToast('Avaliação enviada. Obrigado!'); render(); }
function agendar(pacienteId, horarioId, opcoes = {}){
  const h = getHorario(horarioId);
  if (!h || h.status === 'concluido') {
    if (!opcoes.silencioso) mensagemErro('Este horário não está mais disponível.');
    return;
  }

  if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
    if (!opcoes.silencioso) mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
    return;
  }

  if (!opcoes.silencioso && horarioJaEncerrado(h.data, h.hora)) {
    mensagemErro('Este horário já foi encerrado e não pode mais ser agendado.');
    return;
  }

  if (!opcoes.silencioso && dentroJanelaExclusividade(h)) {
    mensagemErro('Este horário ainda está reservado com exclusividade para outra agenda.');
    return;
  }

  // O mesmo dia/hora pode existir em outras agendas (convênios). Se este horário está livre
  // mas o mesmo dia/hora já foi ocupado em outra agenda, a vaga real é aquela — a pessoa
  // entra na fila de espera dela (assim, todo convênio tem a mesma chance de fila).
  const alvo = (h.status === 'livre' && espelhoReservado(h)) ? espelhoReservado(h) : h;

  if (alvo.fila.includes(pacienteId)) {
    if (!opcoes.silencioso) mensagemErro('Você já está na fila de espera para este horário.');
    return;
  }

  const prof = getProfissional(alvo.profissionalId);
  const muitasFaltas = clienteComMuitasFaltas(pacienteId);
  if (alvo.status === 'livre') {
    alvo.status = 'ocupado';
    alvo.pacienteId = pacienteId;
    const nova = { id: state.proximoIdConsulta++, pacienteId, horarioId: alvo.id, status: 'confirmada', alertaFaltas: muitasFaltas };
    state.consultas.push(nova);
    const pendente = iniciarConfirmacao(nova, alvo);
    if (!opcoes.silencioso) {
      if (pendente) {
        notificar(pacienteId, 'confirmacao_pendente', `Consulta reservada com ${prof.nome} para ${formatarDataCurta(alvo.data)} às ${alvo.hora}. Confirme até ${formatarPrazoConfirmacao(alvo)}, senão a vaga poderá passar para a fila de espera.`);
        state.notificacoes[0].consultaId = nova.id;
      } else {
        notificar(pacienteId, 'confirmacao', `Sua consulta com ${prof.nome} foi confirmada para ${formatarDataCurta(alvo.data)} às ${alvo.hora}.`);
      }
      notificar(null, 'novo_agendamento', `${getPaciente(pacienteId)?.nome || 'Cliente'} agendou ${formatarDataCurta(alvo.data)} às ${alvo.hora}.`, prof.id);
      if (muitasFaltas) notificar(null, 'alerta_faltas', `Atenção: ${getPaciente(pacienteId)?.nome || 'Cliente'} possui ${contarFaltasPaciente(pacienteId)} faltas registradas.`, prof.id);
    }
  } else {
    alvo.fila.push(pacienteId);
    if (!Array.isArray(alvo.filaOrigem)) alvo.filaOrigem = [];
    alvo.filaOrigem.push(h.agendaId);
    alvo.status = 'lotado';
    state.consultas.push({ id: state.proximoIdConsulta++, pacienteId, horarioId: alvo.id, status: 'fila' });
    // Avisa o titular (ainda sem confirmação) que alguém entrou na fila
    if (!opcoes.silencioso) {
      const tit = state.consultas.find(x => x.horarioId===alvo.id && x.status==='confirmada');
      const conf = tit && state.confirmacoes[tit.id];
      if (conf && conf.status==='pendente' && !conf.avisoFila && horasAteConsulta(alvo) > (Number(state.configuracoes.confirmacaoHoras)||24)) {
        conf.avisoFila = true;
        notificar(tit.pacienteId, 'confirmacao_pendente', `Alguém entrou na fila de espera para sua consulta com ${prof.nome} (${formatarDataCurta(alvo.data)} às ${alvo.hora}). Confirme até ${formatarPrazoConfirmacao(alvo)} para garantir sua vaga.`);
        state.notificacoes[0].consultaId = tit.id;
      }
    }
    if (!opcoes.silencioso) {
      notificar(pacienteId, 'fila',
        `Você entrou na fila de espera para ${formatarDataCurta(alvo.data)} às ${alvo.hora}. Sua posição é ${alvo.fila.length}.`);
      notificar(null, 'fila', `${getPaciente(pacienteId)?.nome || 'Cliente'} entrou na fila de espera para ${formatarDataCurta(alvo.data)} às ${alvo.hora} (posição ${alvo.fila.length}).`, prof.id);
    }
  }
  if (!opcoes.silencioso) render();
}

/* Libera um horário (sem paciente) e promove automaticamente o próximo da fila, se houver.
   Função central reutilizada tanto pelo cancelamento do profissional quanto pelo cancelamento do paciente. */
async function agendarComFeedback(pacienteId, horarioId, botao) {
  const h = getHorario(horarioId);

  if (!h) {
    mensagemErro('Horário não encontrado.');
    return;
  }

  const alvo = (h.status === 'livre' && espelhoReservado(h))
    ? espelhoReservado(h)
    : h;

  // Reserva de horário real no Supabase.
  if (alvo.status === 'livre' && alvo.supabaseId) {
    if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
      mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
      return;
    }

    if (horarioJaEncerrado(h.data, h.hora)) {
      mensagemErro('Este horário já foi encerrado.');
      return;
    }

    if (dentroJanelaExclusividade(h)) {
      mensagemErro('Este horário ainda está reservado com exclusividade para outra agenda.');
      return;
    }

    if (botao) {
      botao.disabled = true;
      botao.textContent = 'Agendando…';
    }

    try {
      const { data: consultaSupabaseId, error } = await supabaseClient
        .rpc('reservar_horario_vezzo', {
          p_horario_id: alvo.supabaseId
        });

      if (error) throw error;

      // Atualiza também o estado local da aplicação.
      agendar(pacienteId, horarioId);

      const consultaLocal = state.consultas
        .filter(c => c.pacienteId === pacienteId && c.horarioId === alvo.id)
        .pop();

      if (consultaLocal) {
        consultaLocal.supabaseId = consultaSupabaseId;
      }

      salvarDados();
      mostrarToast('Consulta agendada com sucesso.');
      render();

    } catch (erro) {
      console.error('Erro ao agendar no Supabase:', erro);
      mensagemErro(
        erro.message || 'Não foi possível realizar o agendamento.'
      );

      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Agendar';
      }
    }

    return;
  }

  // Mantém o comportamento atual da fila de espera.

  // Registra a entrada na fila no Supabase.
  if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
    mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
    return;
  }

  if (horarioJaEncerrado(h.data, h.hora)) {
    mensagemErro('Este horário já foi encerrado.');
    return;
  }

  if (!alvo.supabaseId) {
    mensagemErro('Não foi possível identificar o horário no Supabase.');
    return;
  }

  const agendaOrigem = state.agendas.find(
    a => a.id === h.agendaId
  )?.supabaseId || null;

  if (botao) {
    botao.disabled = true;
    botao.textContent = 'Entrando na fila…';
  }

  try {
    const { data: consultaSupabaseId, error } = await supabaseClient
      .rpc('entrar_fila_vezzo', {
        p_horario_id: alvo.supabaseId,
        p_agenda_origem_id: agendaOrigem
      });

    if (error) throw error;

    // Atualiza também a fila no estado local.
    agendar(pacienteId, horarioId);

    const consultaLocal = state.consultas
      .filter(c =>
        c.pacienteId === pacienteId &&
        c.horarioId === alvo.id &&
        c.status === 'fila'
      )
      .pop();

    if (consultaLocal) {
      consultaLocal.supabaseId = consultaSupabaseId;
    }

    salvarDados();
    mostrarToast('Você entrou na fila de espera.');
    render();

  } catch (erro) {
    console.error('Erro ao entrar na fila:', erro);
    mensagemErro(
      erro.message || 'Não foi possível entrar na fila de espera.'
    );

    if (botao) {
      botao.disabled = false;
      botao.textContent = 'Agendar';
    }
  }
}


function liberarHorarioEPromover(horarioId, consultaCanceladaId){
  const h = getHorario(horarioId);
  if (!h) return;

  if (consultaCanceladaId) {
    const consultaAtual = state.consultas.find(c => c.id === consultaCanceladaId);
    if (consultaAtual) consultaAtual.status = 'cancelada';
  }

  if (h.fila.length > 0) {
    const proximoId = h.fila.shift();
    if (Array.isArray(h.filaOrigem)) h.filaOrigem.shift();
    h.pacienteId = proximoId;
    h.status = 'ocupado';

    const consultaFila = state.consultas.find(c => c.horarioId === horarioId && c.pacienteId === proximoId && c.status === 'fila');
    let pend = false;
    if (consultaFila) { consultaFila.status = 'confirmada'; pend = iniciarConfirmacao(consultaFila, h); }
    notificar(proximoId, 'promocao',
      `Uma vaga foi liberada. Você foi promovido(a) da fila para a consulta de ${formatarDataCurta(h.data)} às ${h.hora}.` + (pend ? ` Confirme até ${formatarPrazoConfirmacao(h)} para garantir a vaga.` : ''));
    if (pend && consultaFila) state.notificacoes[0].consultaId = consultaFila.id;
    // Janela curta de aceite: só quando há mais gente na fila atrás e ainda dá tempo
    const aceiteMin = Number(state.configuracoes.aceiteFilaMin) || 0;
    if (!pend && consultaFila && h.fila.length > 0 && aceiteMin > 0 && horasAteConsulta(h) * 60 > aceiteMin) {
      const ate = Date.now() + aceiteMin * 60000;
      state.confirmacoes[consultaFila.id] = { status:'pendente', aceiteAte: ate, criadoEm: new Date().toISOString() };
      notificar(proximoId, 'confirmacao_pendente', `Atenção: confirme sua vaga em ${formatarDataCurta(h.data)} às ${h.hora} até ${new Date(ate).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} (${aceiteMin} min). Sem confirmação, a vaga passa para o próximo da fila.`);
      state.notificacoes[0].consultaId = consultaFila.id;
    }
  } else {
    h.pacienteId = null;
    h.status = 'livre';
    // Nova vaga disponível: tenta encaixar pacientes com preferência de horário mais cedo
    setTimeout(() => tentarEncaixe(h.id), 0);
  }
}

/* ===== Antecipação de consulta por disponibilidade do paciente (encaixe) =====
   preferência: { consultaId, pacienteId, diasDisponiveis:[{diaSemana, faixas:[{inicio,fim}]}], dataLimite, horaLimite, ativa, encerradaMotivo }
   oferta: { id, consultaId, pacienteId, horarioLivreId, criadaEm, expiraEm, status }
   status da oferta: pendente | aceita | recusada | expirada | horario_indisponivel | cancelada */
function encDH(data, hora){ return new Date(data + 'T' + (hora || '00:00') + ':00'); }
function encLimite(p){ return encDH(p.dataLimite, p.horaLimite || '23:59'); }
function encQuando(h){
  const d = new Date(h.data + 'T00:00:00');
  return `${d.toLocaleDateString('pt-BR', { weekday: 'long' })} (${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}) às ${h.hora}`;
}
function encPref(consultaId){ return (state.preferenciasEncaixe || []).find(p => p.consultaId === consultaId); }
function encPendente(consultaId){ return (state.ofertasEncaixe || []).find(o => o.consultaId === consultaId && o.status === 'pendente'); }
function encFaixaOk(pref, data, hora){ // início inclusivo, fim exclusivo (a consulta começa dentro da faixa)
  const dia = new Date(data + 'T00:00:00').getDay();
  const d = (pref.diasDisponiveis || []).find(x => x.diaSemana === dia);
  return !!d && d.faixas.some(f => hora >= f.inicio && hora < f.fim);
}
// Regras 2–5: consulta original existe, é do paciente, está confirmada e é futura
function encMotivoConsulta(c, pacienteId){
  if (!c) return 'inexistente';
  if (pacienteId != null && c.pacienteId !== pacienteId) return 'outro_paciente';
  if (c.status !== 'confirmada') return 'nao_confirmada';
  const h = getHorario(c.horarioId);
  if (!h || horarioJaEncerrado(h.data, h.hora)) return 'passada';
  return null;
}
// Regras 6–9 e 12: a vaga é compatível com a consulta original (mesmo profissional, mesma agenda, livre, anterior, sem conflito)
function encMotivoVaga(c, hLivre){
  if (!hLivre) return 'inexistente';
  if (hLivre.status !== 'livre' || hLivre.pacienteId != null || !horarioDisponivelParaPaciente(hLivre)) return 'ocupada';
  const hAtual = getHorario(c.horarioId);
  if (hLivre.profissionalId !== hAtual.profissionalId) return 'outro_profissional';
  if (hLivre.agendaId !== hAtual.agendaId) return 'outra_agenda';
  if (encDH(hLivre.data, hLivre.hora) >= encDH(hAtual.data, hAtual.hora)) return 'nao_anterior';
  if (horarioJaEncerrado(hLivre.data, hLivre.hora)) return 'passada';
  if (dentroJanelaExclusividade(hLivre)) return 'exclusividade';
  if (pacienteTemConflito(c.pacienteId, hLivre.data, hLivre.hora)) return 'conflito';
  return null;
}
function encFechar(o, status, msgPaciente){
  o.status = status; o.respondidaEm = new Date().toISOString();
  if (msgPaciente) { notificar(o.pacienteId, 'encaixe_info', msgPaciente); state.notificacoes[0].ofertaEncaixeId = o.id; }
}
// Encerra preferências vencidas/inválidas e resolve ofertas expiradas, canceladas ou cuja vaga foi ocupada
function encProcessar(){
  const agora = Date.now();
  (state.preferenciasEncaixe || []).forEach(p => {
    if (!p.ativa) return;
    if (p.dataLimite && agora > encLimite(p).getTime()) { p.ativa = false; p.encerradaMotivo = 'limite'; }
    else if (encMotivoConsulta(state.consultas.find(x => x.id === p.consultaId), p.pacienteId)) { p.ativa = false; p.encerradaMotivo = 'consulta'; }
  });
  (state.ofertasEncaixe || []).forEach(o => {
    if (o.status !== 'pendente') return;
    const c = state.consultas.find(x => x.id === o.consultaId);
    if (encMotivoConsulta(c, o.pacienteId)) return encFechar(o, 'cancelada');
    if (o.expiraEm && agora >= new Date(o.expiraEm).getTime()) return encFechar(o, 'expirada', 'Essa vaga de antecipação expirou. Sua consulta original permanece mantida.');
    const m = encMotivoVaga(c, getHorario(o.horarioLivreId));
    if (m === 'ocupada' || m === 'inexistente') return encFechar(o, 'horario_indisponivel', 'Essa vaga já foi preenchida por outro paciente. Sua consulta original continua mantida.');
    if (m) encFechar(o, 'cancelada');
  });
}

// Chamada sempre que uma vaga fica livre ou é criada: gera no máximo 1 oferta pendente por consulta
function tentarEncaixe(horarioLivreId){
  const hLivre = getHorario(horarioLivreId);
  if (!hLivre || hLivre.status !== 'livre') return;
  encProcessar();
  let criou = false;
  (state.preferenciasEncaixe || []).forEach(pref => {
    if (!pref.ativa) return;                                                            // Regra 1
    const c = state.consultas.find(x => x.id === pref.consultaId);
    if (encMotivoConsulta(c, pref.pacienteId)) return;                                  // Regras 2–5
    if (encPendente(c.id)) return;                                                      // 1 oferta pendente por consulta
    if (!encFaixaOk(pref, hLivre.data, hLivre.hora)) return;                            // Regras 10–11
    if (encDH(hLivre.data, hLivre.hora) > encLimite(pref)) return;                      // Regra 13
    if (encMotivoVaga(c, hLivre)) return;                                               // Regras 6–9 e 12
    const agora = Date.now(), min = Number(state.configuracoes.ofertaEncaixeMin) || 120;
    const oferta = { id: state.proximoIdOfertaEncaixe++, consultaId: c.id, pacienteId: c.pacienteId, horarioLivreId: hLivre.id,
      criadaEm: new Date(agora).toISOString(),
      expiraEm: new Date(Math.min(agora + min * 60000, encDH(hLivre.data, hLivre.hora).getTime())).toISOString(), status: 'pendente' };
    state.ofertasEncaixe.push(oferta);
    const prof = getProfissional(hLivre.profissionalId);
    notificar(c.pacienteId, 'oferta_encaixe', `⚡ Surgiu uma vaga mais cedo com ${prof.nome} para ${encQuando(hLivre)}. Você gostaria de antecipar sua consulta? Responda até ${new Date(oferta.expiraEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}.`);
    state.notificacoes[0].ofertaEncaixeId = oferta.id;
    criou = true;
  });
  if (criou) { salvarDados(); render(); }
}

function aceitarEncaixe(ofertaId){
  encProcessar();                                   // Etapa 2: expira/invalida ofertas antes de qualquer mudança
  const o = (state.ofertasEncaixe || []).find(x => x.id === ofertaId);
  const manter = ' Sua consulta original continua mantida.';
  const sair = msg => { salvarDados(); render(); mensagemErro(msg); };
  if (!o) return mensagemErro('Oferta não encontrada.');
  if (state.usuario?.tipo !== 'paciente' || state.usuario.id !== o.pacienteId) return mensagemErro('Esta oferta pertence a outro paciente.');
  if (o.status === 'expirada') return sair('Essa vaga de antecipação expirou. Sua consulta original permanece mantida.');
  if (o.status === 'horario_indisponivel') return sair('Essa vaga já foi preenchida por outro paciente.' + manter);
  if (o.status !== 'pendente') return sair('Essa oferta não está mais disponível.' + manter);
  // Etapas 3–4: consulta original
  const c = state.consultas.find(x => x.id === o.consultaId);
  if (encMotivoConsulta(c, o.pacienteId)) { encFechar(o, 'cancelada'); return sair('Sua consulta atual não permite mais antecipação.'); }
  // Etapas 5–6: nova vaga
  const hL = getHorario(o.horarioLivreId), m = encMotivoVaga(c, hL);
  if (m) {
    const indisp = m === 'ocupada' || m === 'inexistente';
    encFechar(o, indisp ? 'horario_indisponivel' : 'cancelada');
    return sair((indisp ? 'Essa vaga já foi preenchida por outro paciente.' : 'Essa vaga não é mais compatível com a sua consulta.') + manter);
  }
  // Etapa 7: tudo validado — só agora altera o estado
  const hAtual = getHorario(c.horarioId), antigoId = hAtual.id, prof = getProfissional(hL.profissionalId), iso = new Date().toISOString();
  const de = encQuando(hAtual), para = encQuando(hL), nome = getPaciente(c.pacienteId)?.nome || 'O paciente';

function confirmarCancelamentoPaciente(){
  const consultaId = modalCancelamentoId;
  modalCancelamentoId = null;

  const consulta = state.consultas.find(c => c.id === consultaId);
  if (!consulta) { render(); return; }
  if (['cancelada', 'realizada', 'fila_encerrada'].includes(consulta.status)) {
    render();
    return;
  }

  const h = getHorario(consulta.horarioId);
  const prof = getProfissional(h.profissionalId);
  if (consulta.status === 'confirmada') {
    const regra = consultaPodeSerCancelada(consulta);
    if (!regra.ok) { mensagemErro(regra.motivo); render(); return; }
  }

  if (consulta.status === 'fila') {
    const idx = h.fila.indexOf(consulta.pacienteId);
    if (idx !== -1) {
      h.fila.splice(idx, 1);
      if (Array.isArray(h.filaOrigem)) h.filaOrigem.splice(idx, 1);
    }
    consulta.status = 'cancelada';
    if (h.fila.length === 0 && h.pacienteId) h.status = 'ocupado';
  } else if (consulta.status === 'confirmada') {
  // Cancela primeiro no Supabase.
  (async () => {
    try {
      if (!consulta.supabaseId) {
        throw new Error('ID da consulta no Supabase não encontrado.');
      }

      const { error } = await supabaseClient.rpc(
        'cancelar_consulta_vezzo',
        { p_consulta_id: consulta.supabaseId }
      );

      if (error) throw error;

      liberarHorarioEPromover(h.id, consulta.id);

      // Atualiza o status local da consulta.
      consulta.status = 'cancelada';

      mostrarToast('Consulta cancelada e profissional notificado.');
      render();

    } catch (erro) {
      console.error('Erro ao cancelar consulta:', erro);
      mensagemErro('Não foi possível cancelar a consulta. Tente novamente.');
      render();
    }
  })();

  return;
}

  // O cancelamento do paciente também precisa chegar ao profissional.
  notificar(consulta.pacienteId, 'cancelamento', `Sua consulta com ${prof.nome} foi cancelada.`);
  notificar(null, 'cancelamento_paciente', `${getPaciente(consulta.pacienteId)?.nome || 'O paciente'} cancelou a consulta de ${formatarDataCurta(h.data)} às ${h.hora}.`, prof.id);

  // Se havia fila, o profissional também é informado da promoção automática.
  if (h.pacienteId && h.pacienteId !== consulta.pacienteId) {
    const promovido = getPaciente(h.pacienteId);
    notificar(null, 'promocao_profissional', `${promovido?.nome || 'Paciente'} foi promovido(a) automaticamente para ${formatarDataCurta(h.data)} às ${h.hora}.`, prof.id);
  }

  mostrarToast('Consulta cancelada e profissional notificado.');
  render();
}

async function carregarAgendaPacienteSupabase(profissionalLocalId) {
  try {
    const profissional = getProfissional(profissionalLocalId);

    if (!profissional?.supabaseId) {
      throw new Error('Profissional sem vínculo com o Supabase.');
    }

    const profissionalSupabaseId = profissional.supabaseId;

    const { data: agendas, error: erroAgendas } = await supabaseClient
      .from('agendas')
      .select('*')
      .eq('profissional_id', profissionalSupabaseId)
      .order('prioridade');

    if (erroAgendas) throw erroAgendas;

    const { data: horarios, error: erroHorarios } = await supabaseClient
      .from('horarios')
      .select('*')
      .eq('profissional_id', profissionalSupabaseId);

    if (erroHorarios) throw erroHorarios;

    // Reutiliza os IDs locais das agendas já carregadas.
    const agendasLocais = agendas.map(a => {
      const existente = state.agendas.find(
        x => x.supabaseId === a.id
      );

      return {
        id: existente?.id ?? state.proximoIdAgenda++,
        supabaseId: a.id,
        profissionalId: profissionalLocalId,
        nome: a.nome,
        prioridade: a.prioridade,
        criadaEm: a.criada_em
      };
    });

    const idsAgendas = new Map(
      agendasLocais.map(a => [a.supabaseId, a.id])
    );

    // Reutiliza os IDs locais dos horários já carregados.
    const horariosLocais = horarios.map(h => {
      const existente = state.horarios.find(
        x => x.supabaseId === h.id
      );

      return {
        id: existente?.id ?? state.proximoIdHorario++,
        supabaseId: h.id,
        profissionalId: profissionalLocalId,
        agendaId: idsAgendas.get(h.agenda_id),
        data: h.data,
        hora: h.hora.slice(0, 5),
        modalidade: h.modalidade,
        status: h.status,
        pacienteId: existente?.pacienteId ?? null,
        fila: existente?.fila ?? [],
        filaOrigem: existente?.filaOrigem ?? []
      };
    });

    state.agendas = [
      ...state.agendas.filter(a => a.profissionalId !== profissionalLocalId),
      ...agendasLocais
    ];

    state.horarios = [
      ...state.horarios.filter(h => h.profissionalId !== profissionalLocalId),
      ...horariosLocais
    ];

    agendaSelecionadaPacienteId = agendasLocais[0]?.id ?? null;

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar agenda do paciente:', erro);
    mensagemErro('Não foi possível carregar a agenda deste profissional.');
    throw erro;
  }
}


async function carregarConsultasPacienteSupabase() {
  try {
    const pacienteId = state.usuario?.id;

    if (!pacienteId) {
      throw new Error('Paciente não identificado.');
    }

    // Busca as consultas deste paciente.
    const { data: consultas, error: erroConsultas } = await supabaseClient
      .from('consultas')
      .select('id, paciente_id, horario_id, status, alerta_faltas')
      .eq('paciente_id', pacienteId);

    if (erroConsultas) throw erroConsultas;

    if (!consultas.length) {
      state.consultas = state.consultas.filter(
        c => c.pacienteId !== pacienteId
      );
      salvarDados();
      return;
    }

    // Busca os horários relacionados às consultas.
    const idsHorarios = [...new Set(consultas.map(c => c.horario_id))];

    const { data: horarios, error: erroHorarios } = await supabaseClient
      .from('horarios')
      .select('*')
      .in('id', idsHorarios);

    if (erroHorarios) throw erroHorarios;

    // Busca as agendas relacionadas aos horários.
    const idsAgendas = [...new Set(horarios.map(h => h.agenda_id))];

    const { data: agendas, error: erroAgendas } = await supabaseClient
      .from('agendas')
      .select('*')
      .in('id', idsAgendas);

    if (erroAgendas) throw erroAgendas;

    const agendasLocais = new Map();

    agendas.forEach(a => {
      let agendaLocal = state.agendas.find(
        x => x.supabaseId === a.id
      );

      if (!agendaLocal) {
        agendaLocal = {
          id: state.proximoIdAgenda++,
          supabaseId: a.id,
          profissionalId: state.profissionais.find(
            p => p.supabaseId === horarios.find(h => h.agenda_id === a.id)?.profissional_id
          )?.id,
          nome: a.nome,
          prioridade: a.prioridade,
          criadaEm: a.criada_em
        };

        state.agendas.push(agendaLocal);
      }

      agendasLocais.set(a.id, agendaLocal);
    });

    const horariosLocais = new Map();

    horarios.forEach(h => {
      let horarioLocal = state.horarios.find(
        x => x.supabaseId === h.id
      );

      const profissionalLocal = state.profissionais.find(
        p => p.supabaseId === h.profissional_id
      );

      if (!profissionalLocal) {
        throw new Error('Profissional relacionado à consulta não encontrado.');
      }

      if (!horarioLocal) {
        horarioLocal = {
          id: state.proximoIdHorario++,
          supabaseId: h.id,
          profissionalId: profissionalLocal.id,
          agendaId: agendasLocais.get(h.agenda_id)?.id,
          data: h.data,
          hora: h.hora.slice(0, 5),
          modalidade: h.modalidade,
          status: h.status,
          pacienteId: null,
          fila: [],
          filaOrigem: []
        };

        state.horarios.push(horarioLocal);
      }

      horariosLocais.set(h.id, horarioLocal);
    });

    // Monta as consultas no formato utilizado pela aplicação.
    const consultasLocais = consultas.map(c => {
      const horarioLocal = horariosLocais.get(c.horario_id);

      if (!horarioLocal) {
        throw new Error('Horário relacionado à consulta não encontrado.');
      }

      return {
        id: state.consultas.find(x => x.supabaseId === c.id)?.id
          ?? state.proximoIdConsulta++,
        supabaseId: c.id,
        pacienteId: pacienteId,
        horarioId: horarioLocal.id,
        status: c.status,
        alertaFaltas: !!c.alerta_faltas
      };
    });

    // Substitui somente as consultas deste paciente.
    state.consultas = [
      ...state.consultas.filter(c => c.pacienteId !== pacienteId),
      ...consultasLocais
    ];

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar consultas do paciente:', erro);
    throw erro;
  }
}

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;

  if (!email || !senha) {
    mensagemErro('Preencha o e-mail e a senha.');
    return;
  }

  if (tipoContaSelecionado === 'clinica') {
    mensagemErro('O login de clínicas ainda não está disponível.');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if (error) {
      mensagemErro('E-mail ou senha inválidos.');
      return;
    }

    const usuarioId = data.user.id;

    const { data: perfil, error: erroPerfil } = await supabaseClient
      .from('profiles')
      .select('id, nome, email, tipo')
      .eq('id', usuarioId)
      .single();

    if (erroPerfil || !perfil) {
      mensagemErro('Não foi possível carregar seu perfil.');
      return;
    }

    if (perfil.tipo !== tipoContaSelecionado) {
      await supabaseClient.auth.signOut();
      mensagemErro('Selecione o tipo de conta correto.');
      return;
    }

    if (perfil.tipo === 'paciente') {
      const { data: paciente, error: erroPaciente } = await supabaseClient
        .from('pacientes')
        .select('id')
        .eq('profile_id', usuarioId)
        .single();

      if (erroPaciente || !paciente) {
        mensagemErro('Não foi possível carregar seu cadastro de paciente.');
        return;
      }

      state.usuario = {
        tipo: 'paciente',
        id: paciente.id,
        nome: perfil.nome
      };

      state.clinicaSelecionadaId = null;
      state.profissionalSelecionadoId = null;
      state.agendaAberta = false;
      abaPaciente = 'profissionais';
      await carregarProfissionaisSupabase();
      await carregarConsultasPacienteSupabase();

    } else if (perfil.tipo === 'profissional') {
      const { data: profissional, error: erroProfissional } = await supabaseClient
        .from('profissionais')
        .select('id, profissao')
        .eq('profile_id', usuarioId)
        .single();

      if (erroProfissional || !profissional) {
        mensagemErro('Não foi possível carregar seu cadastro profissional.');
        return;
      }

      state.usuario = {
        tipo: 'profissional',
        id: profissional.id,
        nome: perfil.nome,
        profissao: profissional.profissao
      };

      abaProfissional = 'painel';
      await carregarAgendasHorariosSupabase(profissional.id);
    }

    render();

  } catch (erro) {
    console.error('Erro no login:', erro);
    mensagemErro('Ocorreu um erro ao tentar entrar.');
  }
}

    if (!session) {

      render();
      return;
    }

    const usuarioId = session.user.id;

    // Recuperar o perfil do usuário autenticado.
    const { data: perfil, error: erroPerfil } = await supabaseClient
      .from('profiles')
      .select('id, nome, email, tipo')
      .eq('id', usuarioId)
      .single();

    if (erroPerfil || !perfil) {
      throw erroPerfil || new Error('Perfil não encontrado.');
    }

    if (perfil.tipo === 'paciente') {
      const { data: paciente, error: erroPaciente } = await supabaseClient
        .from('pacientes')
        .select('id')
        .eq('profile_id', usuarioId)
        .single();

      if (erroPaciente || !paciente) {
        throw erroPaciente || new Error('Paciente não encontrado.');
      }

      state.usuario = {
        tipo: 'paciente',
        id: paciente.id,
        nome: perfil.nome
      };

      abaPaciente = 'profissionais';
      await carregarProfissionaisSupabase();
      await carregarConsultasPacienteSupabase();
      state.clinicaSelecionadaId = null;
      state.profissionalSelecionadoId = null;
      state.agendaAberta = false;

    } else if (perfil.tipo === 'profissional') {
      const { data: profissional, error: erroProfissional } =
        await supabaseClient
          .from('profissionais')
          .select('id, profissao')
          .eq('profile_id', usuarioId)
          .single();

      if (erroProfissional || !profissional) {
        throw erroProfissional || new Error('Profissional não encontrado.');
      }

      state.usuario = {
        tipo: 'profissional',
        id: profissional.id,
        nome: perfil.nome,
        profissao: profissional.profissao
      };

      const profissionalLocal = state.profissionais.find(
  p => p.id === profissional.id
);

if (!profissionalLocal) {
  state.profissionais.push({
    id: profissional.id,
    nome: perfil.nome,
    email: perfil.email,
    profissao: profissional.profissao,
    especialidade: profissional.profissao,
    descricao: 'Profissional cadastrado no Vezzo.',
    avatar: '🧑‍⚕️',
    clinicaId: null,
    clinicaNome: '',
    modalidadeAtendimento: 'presencial',
    localAtendimento: ''
  });
}

      abaProfissional = 'painel';
await carregarAgendasHorariosSupabase(profissional.id);

    } else {
      throw new Error('Tipo de conta não reconhecido.');
    }

    render();

  } catch (erro) {
    console.error('Erro ao restaurar sessão:', erro);
    state.usuario = null;
    render();
    mensagemErro('Não foi possível recuperar sua sessão. Entre novamente.');
  }
}




function fazerCadastro(){
  const nome = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  
  if (!nome || !email || !senha) { mensagemErro('Preencha os campos obrigatórios.'); return; }

  if (tipoContaSelecionado === 'paciente') {
    if (state.pacientes.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const novo = { id: state.proximoIdPaciente++, nome, email, senha };
    state.pacientes.push(novo);
    state.usuario = { tipo: 'paciente', id: novo.id, nome: novo.nome };
    abaPaciente = 'profissionais';
  } else if (tipoContaSelecionado === 'clinica') {
    if (state.clinicas.some(c => c.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const endereco = document.getElementById('cad-clinica-endereco')?.value.trim();
    const especialidade = document.getElementById('cad-clinica-especialidade')?.value.trim();
    if (!endereco) { mensagemErro('Informe o endereço da clínica.'); return; }
    const conveniosTexto = document.getElementById('cad-clinica-convenios')?.value.trim();
    const convenios = conveniosTexto ? conveniosTexto.split(',').map(s=>s.trim()).filter(Boolean) : ['Particular'];
    const nova = {
      id: state.proximoIdClinica++, nome, email, senha,
      especialidade: especialidade || 'Clínica geral',
      descricao: `${nome} — cadastrada no Vezzo.`,
      icone: '🏥',
      endereco,
      convenios,
      codigoConvite: gerarCodigoConvite(),
    };
    state.clinicas.push(nova);
    state.usuario = { tipo: 'clinica', id: nova.id, nome: nova.nome };
    mostrarToast(`Clínica cadastrada! Use o código ${nova.codigoConvite} para vincular seus profissionais.`);
  } else {
    const profissao = document.getElementById('cad-profissao').value.trim();
    if (!profissao) { mensagemErro('Preencha sua profissão.'); return; }
    const codigo = document.getElementById('cad-codigo-clinica')?.value.trim().toUpperCase();
    const clinicaEscolhida = state.clinicas.find(c => c.codigoConvite === codigo);
    if (!codigo || !clinicaEscolhida) { mensagemErro('Código de convite inválido. Confira o código com a clínica.'); return; }
    if (state.profissionais.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const especialidade = document.getElementById('cad-especialidade').value.trim();
    const descricao = document.getElementById('cad-descricao').value.trim();
    const modalidadeAtendimento = document.getElementById('cad-modalidade').value;
    const localAtendimento = document.getElementById('cad-local') ? document.getElementById('cad-local').value.trim() : '';
    const novo = {
      id: state.proximoIdProfissional++, nome, email, senha, profissao,
      especialidade: especialidade || profissao,
      descricao: descricao || 'Profissional cadastrado no Vezzo.',
      avatar: '🧑⚕️',
      clinicaId: clinicaEscolhida.id,
      modalidadeAtendimento: modalidadeAtendimento || 'presencial',
      localAtendimento: localAtendimento || (modalidadeAtendimento !== 'online' ? clinicaEscolhida.endereco : ''),
    };
    state.profissionais.push(novo);
    state.usuario = { tipo: 'profissional', id: novo.id, nome: novo.nome, profissao: novo.profissao };
    state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: novo.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
    agendaSelecionadaId = agendasDoProfissional(novo.id)[0]?.id ?? null;
    mostrarToast(`Cadastro concluído! Você já aparece em ${clinicaEscolhida.nome} para os pacientes.`);
  }
  render();
}

    let acoes = '';
    if (n.consultaId && state.confirmacoes[n.consultaId]?.status==='pendente' && ehPaciente) {
      acoes = '<button onclick="event.stopPropagation();confirmarConsultaPaciente('+n.consultaId+')" class="btn-primary px-2.5 py-1.5 text-xs mt-2">Confirmar consulta</button>';
    }
    if (n.ofertaEncaixeId) {
      const oferta = (state.ofertasEncaixe || []).find(o => o.id === n.ofertaEncaixeId);
      const fim = { aceita: 'Aceito. Consulta antecipada.', recusada: 'Você manteve a consulta atual.', expirada: 'Oferta expirada. Consulta original mantida.', horario_indisponivel: 'Vaga preenchida. Consulta original mantida.', cancelada: 'Oferta cancelada. Consulta original mantida.' };
      if (oferta && oferta.status === 'pendente') {
        acoes = `<div class="flex gap-2 mt-2 flex-wrap"><button onclick="event.stopPropagation();aceitarEncaixe(${oferta.id})" class="btn-primary px-2.5 py-1.5 text-xs">ACEITAR ENCAIXE</button><button onclick="event.stopPropagation();recusarEncaixe(${oferta.id})" class="btn-ghost px-2.5 py-1.5 text-xs">MANTER CONSULTA ATUAL</button></div>`;

      }

  }).join('')}</div>`).join(''):'<div class="p-4 text-sm text-[var(--ink-soft)]">Sem notificações por enquanto.</div>'}</div></div>`;
}


let calendarioAberto = false;
let calVisao = (() => {
  const d = new Date(state.diaSelecionado + 'T00:00:00');

})();

  if (!calendarioAberto) return;

    calendarioAberto = false; render();
  }
});

function mudarMesCalendario(delta){
  calVisao.mes += delta;
  if (calVisao.mes < 0) { calVisao.mes = 11; calVisao.ano--; }
  if (calVisao.mes > 11) { calVisao.mes = 0; calVisao.ano++; }
  render();
}

function selecionarDia(iso){
  state.diaSelecionado = iso;
  calendarioAberto = false;
  render();
}

const PALETA_AGENDAS = ['#0369A1','#047857','#B45309','#BE185D','#6D28D9','#0E7490','#BE123C','#4D7C0F'];
function corAgenda(agendaId){
  return PALETA_AGENDAS[Math.abs(Number(agendaId)) % PALETA_AGENDAS.length];
}

function gerarGradeCalendario(filtroProfissionalId = null, filtroAgendaId = null, mostrarAgendas = false){
  const { ano, mes } = calVisao;
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes + 1, 0).getDate();
  const hoje = hojeISO();
  const nomesMes = new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const todasAgendasDoProf = mostrarAgendas && filtroProfissionalId ? agendasDoProfissional(filtroProfissionalId) : [];

  let celulas = '';
  for (let i = 0; i < primeiroDiaSemana; i++) celulas += `<div class="cal-cell"></div>`;
  for (let dia = 1; dia <= totalDias; dia++) {
    const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const horariosDoDiaCal = filtroProfissionalId ? state.horarios.filter(h => h.data === iso && h.profissionalId === filtroProfissionalId) : [];
    // Para o paciente (mostrarAgendas=false) o ponto só aparece se o horário não estiver na janela de exclusividade de outra agenda.
    const temHorario = filtroProfissionalId
      ? horariosDoDiaCal.some(h => (filtroAgendaId ? h.agendaId === filtroAgendaId : true) && (mostrarAgendas || !dentroJanelaExclusividade(h)))
      : state.horarios.some(h => h.data === iso);
    const bloqueado = filtroProfissionalId ? horarioBloqueado(filtroProfissionalId, iso, filtroAgendaId) : false;
    const agendasNoDia = mostrarAgendas ? [...new Set(horariosDoDiaCal.map(h => h.agendaId))] : [];
    const pontosAgendas = agendasNoDia.map(id => {
      const nome = todasAgendasDoProf.find(a => a.id === id)?.nome || '';
      return `<span class="cal-dot-agenda" title="${escaparHtml(nome)}" style="background:${corAgenda(id)}"></span>`;
    }).join('');
    const classes = ['cal-cell'];
    if (iso === state.diaSelecionado) classes.push('selected');
    if (iso === hoje) classes.push('today');
    if (bloqueado) classes.push('blocked');
    const marcador = bloqueado ? '<span class="cal-block">×</span>' : (mostrarAgendas ? (agendasNoDia.length ? `<span class="cal-dots-wrap">${pontosAgendas}</span>` : '') : (temHorario ? '<span class="cal-dot"></span>' : ''));
    celulas += `<div class="${classes.join(' ')}" onclick="selecionarDia('${iso}')" title="${mostrarAgendas && agendasNoDia.length ? escaparHtml(agendasNoDia.map(id=>todasAgendasDoProf.find(a=>a.id===id)?.nome||'').join(', ')) : ''}">${dia}${marcador}</div>`;
  }

  const diasSemana = ['D','S','T','Q','Q','S','S'].map(d => `<div class="w-9 text-center text-xs text-[var(--ink-soft)] font-medium">${d}</div>`).join('');
  const legendaAgendas = mostrarAgendas && todasAgendasDoProf.length
    ? `<div class="flex flex-wrap gap-x-3 gap-y-1 mt-2">${todasAgendasDoProf.map(a => `<span class="cal-legenda-agenda"><span class="cal-legenda-swatch" style="background:${corAgenda(a.id)}"></span>${escaparHtml(a.nome)}</span>`).join('')}</div>`
    : '';

  return `
    <div data-calendar-popover class="calendar-popover card p-4 absolute z-20 mt-2 shadow-lg bg-[var(--surface)]">
      <div class="flex items-center justify-between mb-3">
        <button onclick="mudarMesCalendario(-1)" class="btn-ghost px-2 py-1 text-sm">‹</button>
        <span class="font-display text-sm capitalize">${nomesMes} ${ano}</span>
        <button onclick="mudarMesCalendario(1)" class="btn-ghost px-2 py-1 text-sm">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-1">${diasSemana}</div>
      <div class="grid grid-cols-7 gap-1">${celulas}</div>
      ${mostrarAgendas
        ? `<p class="text-xs text-[var(--ink-soft)] mt-3"><span class="text-[var(--brick)]">× bloqueado</span> · cada cor é uma agenda</p>${legendaAgendas}`
        : `<p class="text-xs text-[var(--ink-soft)] mt-3">● com horários &nbsp; <span class="text-[var(--brick)]">× bloqueado</span></p>`}
    </div>`;
}

function copiarCodigoConvite(codigo){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codigo).then(() => mostrarToast('Código copiado!')).catch(() => mensagemErro(`Não foi possível copiar automaticamente. Código: ${codigo}`));
  } else {
    mensagemErro(`Copie manualmente o código: ${codigo}`);
  }
}
function regenerarCodigoConvite(){
  const clinica = getClinica(state.usuario.id);
  if (!clinica) return;
  clinica.codigoConvite = gerarCodigoConvite();
  mostrarToast(`Novo código gerado: ${clinica.codigoConvite}. O código antigo deixa de funcionar.`, 'info');
  render();
}

function profissionaisFiltrados(){
  const termo = buscaProfissionalTexto.trim().toLowerCase();
  return state.profissionais.filter(p => {
    if (p.clinicaId !== state.clinicaSelecionadaId) return false;

    const textoBusca = `${p.nome} ${p.profissao} ${p.especialidade || ''}`.toLowerCase();
    const passaTexto = !termo || textoBusca.includes(termo);

    const especialidadeProf = p.especialidade || p.profissao;
    const passaEspecialidade = filtroEspecialidade === 'todas' || especialidadeProf === filtroEspecialidade;

    const modalidadeProf = p.modalidadeAtendimento || 'presencial';
    const passaModalidade = filtroModalidadeProf === 'todas'
      || modalidadeProf === filtroModalidadeProf
      || modalidadeProf === 'ambos';

    return passaTexto && passaEspecialidade && passaModalidade;
  });
}
