let encDraft = null;
const ENC_DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function abrirConfiguracaoEncaixe(consultaId){
  const c = state.consultas.find(x => x.id === consultaId), h = c && getHorario(c.horarioId);
  if (!c || !h || c.status !== 'confirmada') return mensagemErro('Só é possível antecipar uma consulta confirmada.');
  const p = encPref(consultaId);
  encDraft = { consultaId, ativa: !!p?.ativa, dias: p ? JSON.parse(JSON.stringify(p.diasDisponiveis)) : [], dataLimite: p?.dataLimite || h.data, horaLimite: p?.horaLimite || '' };
  encDesenhar();
}
function encDesenhar(){
  const d = encDraft, c = state.consultas.find(x => x.id === d.consultaId), h = getHorario(c.horarioId), prof = getProfissional(h.profissionalId);
  const rolagem = document.getElementById('enc-scroll')?.scrollTop || 0;
  document.getElementById('modal-encaixe')?.remove();
  const blocos = ENC_DIAS.map((nome, i) => {
    const sel = d.dias.find(x => x.diaSemana === i);
    const faixas = sel ? sel.faixas.map((f, j) => `<div class="flex items-center gap-2 mt-2"><input type="time" value="${f.inicio}" onchange="encEditar(${i},${j},'inicio',this.value)" class="border rounded p-1.5 flex-1 min-w-0"><span class="text-[var(--ink-soft)]">→</span><input type="time" value="${f.fim}" onchange="encEditar(${i},${j},'fim',this.value)" class="border rounded p-1.5 flex-1 min-w-0"><button type="button" onclick="encRemoverFaixa(${i},${j})" class="btn-ghost px-2 py-1 text-xs">Remover</button></div>`).join('')
      + `<button type="button" onclick="encAddFaixa(${i})" class="btn-ghost px-2 py-1 text-xs mt-2">+ Adicionar faixa</button>` : '';
    return `<div class="border border-[var(--line)] rounded-lg p-2.5"><label class="flex items-center gap-2 font-medium cursor-pointer"><input type="checkbox" ${sel ? 'checked' : ''} onchange="encToggleDia(${i})"> ${nome}</label>${faixas}</div>`;
  }).join('');
  const modal = document.createElement('div');
  modal.id = 'modal-encaixe'; modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="card bg-white p-5 max-w-md w-full max-h-[90vh] overflow-y-auto" id="enc-scroll">
      <h3 class="font-display text-lg mb-1">⚡ Antecipar vaga</h3>
      <p class="text-xs text-[var(--ink-soft)] mb-1">Consulta atual: <strong>${escaparHtml(prof.nome)}</strong> · ${encQuando(h)}</p>
      <p class="text-sm text-[var(--ink-soft)] mb-3">Se surgir uma vaga mais cedo nos dias e horários abaixo, o Vezzo avisa você na hora.</p>
      ${d.ativa ? '<div class="text-xs font-medium text-[var(--gold)] mb-3">⚡ Antecipação ativa — você pode editar ou desativar.</div>' : ''}
      <div class="space-y-2 text-sm">${blocos}</div>
      <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
        <div><label class="block font-medium mb-1">Aceito antecipar até</label><input type="date" value="${d.dataLimite}" min="${hojeISO()}" max="${h.data}" onchange="encDraft.dataLimite=this.value" class="w-full border rounded p-1.5"></div>
        <div><label class="block font-medium mb-1">Hora limite <span class="font-normal text-[var(--ink-soft)]">(opcional)</span></label><input type="time" value="${d.horaLimite}" onchange="encDraft.horaLimite=this.value" class="w-full border rounded p-1.5"></div>
      </div>
      <div class="flex gap-3 mt-5">
        <button onclick="encFecharModal()" class="btn-ghost flex-1 py-2 text-sm font-medium">Cancelar</button>
        <button onclick="salvarConfiguracaoEncaixe(${d.consultaId})" class="btn-primary flex-1 py-2 text-sm font-medium">Salvar antecipação</button>
      </div>
      ${d.ativa ? `<button onclick="desativarEncaixe(${d.consultaId})" class="btn-brick w-full mt-2 py-2 text-sm font-medium">Desativar antecipação</button>` : ''}
    </div>`;
  document.body.appendChild(modal);
  const box = document.getElementById('enc-scroll'); if (box) box.scrollTop = rolagem;
}
function encFecharModal(){ encDraft = null; document.getElementById('modal-encaixe')?.remove(); }
function encToggleDia(i){
  const d = encDraft, k = d.dias.findIndex(x => x.diaSemana === i);
  if (k >= 0) d.dias.splice(k, 1); else d.dias.push({ diaSemana: i, faixas: [{ inicio: '08:00', fim: '12:00' }] });
  d.dias.sort((a, b) => a.diaSemana - b.diaSemana); encDesenhar();
}
function encAddFaixa(i){ encDraft.dias.find(x => x.diaSemana === i).faixas.push({ inicio: '14:00', fim: '18:00' }); encDesenhar(); }
function encRemoverFaixa(i, j){
  const d = encDraft, x = d.dias.find(y => y.diaSemana === i);
  x.faixas.splice(j, 1); if (!x.faixas.length) d.dias.splice(d.dias.indexOf(x), 1);
  encDesenhar();
}
function encEditar(i, j, campo, v){ encDraft.dias.find(x => x.diaSemana === i).faixas[j][campo] = v; }

function salvarConfiguracaoEncaixe(consultaId){
  const d = encDraft, c = state.consultas.find(x => x.id === consultaId), h = c && getHorario(c.horarioId);
  if (!d || d.consultaId !== consultaId || !c || !h) return;
  if (c.status !== 'confirmada') return mensagemErro('Só é possível antecipar uma consulta confirmada.');
  const dias = d.dias.filter(x => x.faixas.length).map(x => ({ diaSemana: x.diaSemana, faixas: x.faixas.map(f => ({ inicio: f.inicio, fim: f.fim })).sort((a, b) => a.inicio.localeCompare(b.inicio)) }));
  if (!dias.length) return mensagemErro('Escolha ao menos um dia e uma faixa de horário.');
  for (const x of dias) for (let k = 0; k < x.faixas.length; k++) {
    const f = x.faixas[k];
    if (!f.inicio || !f.fim || f.inicio >= f.fim) return mensagemErro(`${ENC_DIAS[x.diaSemana]}: o horário inicial deve ser menor que o final.`);
    if (k && f.inicio < x.faixas[k - 1].fim) return mensagemErro(`${ENC_DIAS[x.diaSemana]}: as faixas não podem se sobrepor.`);
  }
  if (!d.dataLimite) return mensagemErro('Informe a data limite.');
  if (d.dataLimite > h.data) return mensagemErro('A data limite não pode ser depois da consulta atual.');
  if (encLimite({ dataLimite: d.dataLimite, horaLimite: d.horaLimite }).getTime() <= Date.now()) return mensagemErro('A data/hora limite precisa estar no futuro.');
  const antiga = encPref(consultaId), iso = new Date().toISOString();
  const nova = { consultaId, pacienteId: c.pacienteId, diasDisponiveis: dias, dataLimite: d.dataLimite, horaLimite: d.horaLimite || '', ativa: true, criadaEm: antiga?.criadaEm || iso, atualizadaEm: iso };
  if (!state.preferenciasEncaixe) state.preferenciasEncaixe = [];
  const idx = state.preferenciasEncaixe.findIndex(p => p.consultaId === consultaId);
  if (idx >= 0) state.preferenciasEncaixe[idx] = nova; else state.preferenciasEncaixe.push(nova);
  encFecharModal();
  mostrarToast('Antecipação ativada. Avisaremos se surgir uma vaga mais cedo.', 'success');
  render();
}
function desativarEncaixe(consultaId){
  const p = encPref(consultaId);
  if (p) { p.ativa = false; p.encerradaMotivo = 'manual'; }
  (state.ofertasEncaixe || []).filter(o => o.consultaId === consultaId && o.status === 'pendente').forEach(o => encFechar(o, 'cancelada'));
  encFecharModal();
  mostrarToast('Antecipação desativada.');
  render();
}
function encStatusHtml(c){
  if (c.status !== 'confirmada') return '';
  const p = encPref(c.id), cls = 'text-xs mt-1 font-medium text-[var(--gold)]';
  if (encPendente(c.id)) return `<div class="${cls}">⚡ Surgiu uma vaga mais cedo! Responda na área de notificações.</div>`;
  if (p?.ativa) return `<div class="${cls}">⚡ Antecipação ativa: você está aguardando uma vaga mais cedo (até ${new Date(p.dataLimite + 'T00:00:00').toLocaleDateString('pt-BR')}${p.horaLimite ? ' às ' + p.horaLimite : ''}).</div>`;
  if (p?.encerradaMotivo === 'manual') return '<div class="text-xs mt-1 text-[var(--ink-soft)]">Antecipação desativada.</div>';
  if (p?.encerradaMotivo === 'limite') return '<div class="text-xs mt-1 text-[var(--ink-soft)]">Antecipação encerrada: a data limite foi atingida.</div>';
  if (c.antecipadaPorEncaixe) return `<div class="${cls}">⚡ Consulta antecipada pelo encaixe por disponibilidade.</div>`;
  return '';
}

/* ===== Demonstração e testes (rode no console do navegador: demoEncaixe() e testeEncaixe()) ===== */
function encProximoDia(diaSemana, aPartirDe){ let d = aPartirDe; while (new Date(d + 'T00:00:00').getDay() !== diaSemana) d = adicionarDiasISO(d, 1); return d; }
// Cenário: Maria, Dr. João, agenda "Convênio A", consulta na sexta 15:00; disponível ter 08–12 e qua 14–18, até quinta
function demoEncaixe(){
  let maria = state.pacientes.find(p => p.email === 'maria@email.com');
  if (!maria) { maria = { id: state.proximoIdPaciente++, nome: 'Maria Souza', email: 'maria@email.com', senha: '123' }; state.pacientes.push(maria); }
  let ag = state.agendas.find(a => a.profissionalId === 2 && a.nome === 'Convênio A');
  if (!ag) { ag = { id: state.proximoIdAgenda++, profissionalId: 2, nome: 'Convênio A', criadaEm: new Date().toISOString(), prioridade: 2 }; state.agendas.push(ag); }
  const sexta = encProximoDia(5, hojeISO(7)), ter = adicionarDiasISO(sexta, -3), qua = adicionarDiasISO(sexta, -2), qui = adicionarDiasISO(sexta, -1);
  let hs = state.horarios.find(h => h.profissionalId === 2 && h.agendaId === ag.id && h.data === sexta && h.hora === '15:00');
  if (!hs) { adicionarHorarioPorData(2, sexta, '15:00', 'presencial', ag.id); hs = state.horarios[state.horarios.length - 1]; }
  if (hs.status === 'livre') agendar(maria.id, hs.id, { silencioso: true });
  const c = state.consultas.find(x => x.horarioId === hs.id && x.pacienteId === maria.id && x.status === 'confirmada');
  state.preferenciasEncaixe = state.preferenciasEncaixe.filter(p => p.consultaId !== c.id);
  state.preferenciasEncaixe.push({ consultaId: c.id, pacienteId: maria.id, diasDisponiveis: [
    { diaSemana: 2, faixas: [{ inicio: '08:00', fim: '12:00' }] }, { diaSemana: 3, faixas: [{ inicio: '14:00', fim: '18:00' }] }],
    dataLimite: qui, horaLimite: '', ativa: true, criadaEm: new Date().toISOString() });
  salvarDados(); render();
  console.log('Demo pronta. Entre como maria@email.com / 123 (paciente) e veja "Minhas consultas".');
  return { maria, ag, c, hs, sexta, ter, qua, qui };
}
function testeEncaixe(){
  const bak = JSON.stringify(state), res = [];
  const ok = (nome, cond) => res.push({ teste: nome, resultado: cond ? 'OK' : 'FALHOU' });
  try {
    const x = demoEncaixe(), c = x.c, geral = agendaPadraoId(2);
    state.usuario = { tipo: 'paciente', id: x.maria.id, nome: x.maria.nome };
    const pref = encPref(c.id);
    const pend = () => state.ofertasEncaixe.filter(o => o.consultaId === c.id && o.status === 'pendente');
    const vaga = (data, hora, ag = x.ag.id) => { const r = adicionarHorarioPorData(2, data, hora, 'presencial', ag); if (!r.ok) throw new Error('vaga não criada ' + data + hora); const h = state.horarios[state.horarios.length - 1]; tentarEncaixe(h.id); return h; };
    vaga(x.ter, '10:00');                    ok('T1 terça 10:00 gera oferta', pend().length === 1);
    vaga(x.ter, '11:00');                    ok('T2 segunda vaga não cria 2ª oferta pendente', pend().length === 1 && state.ofertasEncaixe.length === 1);
    recusarEncaixe(pend()[0].id);            ok('T3 recusar mantém consulta e preferência ativa', c.horarioId === x.hs.id && pref.ativa && state.ofertasEncaixe[0].status === 'recusada');
    vaga(x.ter, '15:00');                    ok('T4 terça 15:00 (fora da faixa) não gera', pend().length === 0);
    vaga(x.qua, '10:00');                    ok('T5 quarta 10:00 (fora da faixa) não gera', pend().length === 0);
    vaga(x.sexta, '16:00');                  ok('T6 sexta 16:00 (depois da consulta) não gera', pend().length === 0);
    vaga(x.ter, '09:00', geral);             ok('T7 outra agenda/convênio não gera', pend().length === 0);
    const q15 = vaga(x.qua, '15:00');        ok('T8 quarta 15:00 gera nova oferta após recusa', pend().length === 1);
    const o2 = pend()[0]; agendar(1, q15.id, { silencioso: true }); aceitarEncaixe(o2.id);
    ok('T9 vaga ocupada antes de aceitar: oferta indisponível e consulta intacta', o2.status === 'horario_indisponivel' && c.horarioId === x.hs.id && c.status === 'confirmada');
    pref.diasDisponiveis.push({ diaSemana: 5, faixas: [{ inicio: '08:00', fim: '18:00' }] }); pref.dataLimite = x.sexta;
    vaga(x.sexta, '16:00');                  ok('T10 sexta 16:00 não gera (estritamente anterior)', pend().length === 0);
    vaga(x.sexta, '14:00');                  ok('T11 sexta 14:00 gera (anterior à consulta)', pend().length === 1);
    recusarEncaixe(pend()[0].id); pref.diasDisponiveis.pop(); pref.dataLimite = x.qui;
    vaga(x.ter, '08:30'); const o3 = pend()[0]; o3.expiraEm = new Date(Date.now() - 1000).toISOString(); aceitarEncaixe(o3.id);
    ok('T12 oferta expirada: consulta original mantida', o3.status === 'expirada' && c.horarioId === x.hs.id && c.status === 'confirmada');
    pref.dataLimite = adicionarDiasISO(x.ter, -1); vaga(x.ter, '08:15');
    ok('T13 vaga depois da data limite não gera', pend().length === 0);
    pref.dataLimite = adicionarDiasISO(hojeISO(), -1); encProcessar(); ok('T14 data limite vencida desativa a preferência', pref.ativa === false);
    pref.ativa = true; pref.dataLimite = x.qui; delete pref.encerradaMotivo;
    agendar(2, x.hs.id, { silencioso: true });   // Pedro entra na fila do horário antigo
    const nova = vaga(x.ter, '09:15'); aceitarEncaixe(pend()[0].id);
    ok('T15 aceitar move a consulta para o novo horário', c.horarioId === nova.id && nova.pacienteId === x.maria.id && nova.status === 'ocupado');
    ok('T16 horário antigo liberado e fila promovida', getHorario(x.hs.id).pacienteId === 2 && getHorario(x.hs.id).status === 'ocupado');
    ok('T17 histórico e preferência desativada', state.reagendamentos[c.id]?.tipoReagendamento === 'antecipacao_encaixe' && pref.ativa === false);
    ok('T18 profissional notificado', state.notificacoes.some(n => n.profissionalId === 2 && /aceitou uma antecipação/.test(n.mensagem)));
    ok('T19 persistência (JSON)', !!JSON.parse(JSON.stringify(state)).ofertasEncaixe.length);
  } catch (e) { res.push({ teste: 'ERRO', resultado: String(e.stack || e) }); }
  finally { state = JSON.parse(bak); salvarDados(); render(); }
  console.table(res);
  return res;
}

async function salvarNovoHorario() {
  const data = document.getElementById('novo-hor-data')?.value;
  const hora = document.getElementById('novo-hor-hora')?.value;
  const modalidade = document.getElementById('novo-hor-modalidade')?.value || 'presencial';
  const agendaId = Number(document.getElementById('novo-hor-agenda')?.value || agendaSelecionadaId);

  if (!data || !hora) {
    return mensagemErro('Informe a data e o horário.');
  }

  if (data < hojeISO()) {
    return mensagemErro('A data precisa ser hoje ou futura.');
  }

  if (!agendaId) {
    return mensagemErro('Selecione uma agenda.');
  }

  const agenda = state.agendas.find(a => a.id === agendaId);

  if (!agenda?.supabaseId) {
    return mensagemErro('Agenda não encontrada no Supabase. Atualize a página e tente novamente.');
  }

  const resultado = adicionarHorarioPorData(
    state.usuario.id,
    data,
    hora,
    modalidade,
    agendaId
  );

  if (!resultado.ok) {
    return mensagemErro(
      resultado.motivo === 'bloqueado'
        ? 'Essa data está bloqueada.'
        : 'Já existe um horário nesse dia e hora nesta agenda.'
    );
  }

  const horario = state.horarios[state.horarios.length - 1];

  try {
    const { data: horarioSalvo, error } = await supabaseClient
      .from('horarios')
      .insert({
        profissional_id: state.usuario.id,
        agenda_id: agenda.supabaseId,
        data,
        hora,
        modalidade,
        status: 'livre'
      })
      .select()
      .single();

    if (error) throw error;

    horario.supabaseId = horarioSalvo.id;

    salvarDados();

    novoHorarioAberto = false;
    state.diaSelecionado = data;
    agendaSelecionadaId = agendaId;

    mostrarToast('Novo horário criado.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao salvar horário:', erro);

    state.horarios = state.horarios.filter(h => h.id !== horario.id);

    mensagemErro('Não foi possível salvar o horário no Supabase.');
    render();
  }
}

            </div>`).join('')}</div>
          </div>`).join('') : `<div class="card bg-white p-4 text-sm text-[var(--ink-soft)]">Você ainda não salvou nenhuma anotação privada. As observações adicionadas em uma consulta aparecerão aqui.</div>`;

  const conteudoAgenda = `

            const h=x.horario, c=x.consulta, paciente=getPaciente(c.pacienteId), passada=consultaJaPassou(h);
            return `<div class="card bg-white p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                </div>
                <p class="text-sm mt-1">Paciente: <strong>${escaparHtml(paciente?.nome||'Paciente')}</strong></p>

          ${encerradasRecentes.length ? encerradasRecentes.map(x=>{const h=x.horario,c=x.consulta,p=getPaciente(c.pacienteId);return `<div class="card bg-white p-3 flex items-center justify-between gap-3 mb-2"><div><div class="text-sm font-medium">${escaparHtml(p?.nome||'Paciente')}</div><div class="text-xs text-[var(--ink-soft)]">${formatarDataCurta(h.data)} · ${h.hora}</div></div><div class="text-right"><span class="badge ${c.status==='realizada'?'badge-livre':'badge-lotado'}">${c.status==='realizada'?'Realizada':'Faltou'}</span>${(state.anotacoesPrivadas[c.id]||[]).slice(-1).map(n=>`<div class="text-[11px] text-[var(--ink-soft)] mt-1 max-w-[260px]">📝 ${escaparHtml(n.texto)}</div>`).join('')}</div></div>`}).join('') : `<div class="card bg-white p-4 text-sm text-[var(--ink-soft)]">Nenhum atendimento encerrado ainda.</div>`}

          <div class="flex items-center justify-between border-b border-[var(--line)] pb-2 mb-3"><div><h4 class="text-sm font-medium">Cancelamentos recentes</h4><p class="text-xs text-[var(--ink-soft)] mt-1">Nada é apagado: cancelamentos continuam registrados.</p></div></div>
          ${canceladasRecentes.length ? canceladasRecentes.map(c=>{const p=getPaciente(c.consulta.pacienteId);return `<div class="card bg-white p-3 flex items-center justify-between gap-3 mb-2"><div><div class="text-sm font-medium">${escaparHtml(p?.nome||'Paciente')}</div><div class="text-xs text-[var(--ink-soft)]">${formatarDataCurta(c.horario.data)} · ${c.horario.hora} · ${c.horario.modalidade==='online'?'💻 Online':'📍 Presencial'}</div></div><span class="badge badge-concluido">Cancelada</span></div>`}).join('') : `<div class="card bg-white p-4 text-sm text-[var(--ink-soft)]">Nenhum cancelamento recente.</div>`}

          <p class="text-sm text-[var(--ink-soft)] capitalize">${formatarDataCompleta(state.diaSelecionado)}</p>

  const conteudoAba = abaProfissional === 'agenda' ? conteudoAgenda : abaProfissional === 'config' ? conteudoConfig : conteudoPainel;

  return `

}



function barraNavegacao(){
  const ehPaciente = state.usuario.tipo === 'paciente';
  const ehClinica = state.usuario.tipo === 'clinica';
  const naoLidas = ehClinica ? 0 : state.notificacoes.filter(n => { const alvo = ehPaciente ? n.pacienteId === state.usuario.id : n.profissionalId === state.usuario.id; return alvo && !n.lida; }).length;

  const barraInferior = ehClinica ? `
    <nav class="mobile-bottombar">
      <button onclick="sair()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-2"/></svg></span>Sair</button>
    </nav>` : ehPaciente ? `
    <nav class="mobile-bottombar">

function badgeStatus(status){

    livre: ['Livre', 'badge-livre'],

async function excluirHorarioSupabase(id) {
  const horario = state.horarios.find(h => h.id === id);

  if (!horario) return;

  if (horario.status !== 'livre' || horario.pacienteId || horario.fila.length) {
    return mensagemErro('Não é possível excluir um horário ocupado ou com pacientes na fila.');
  }

  if (!horario.supabaseId) {
    return mensagemErro('Este horário ainda não está vinculado ao Supabase.');
  }

  if (!confirm('Deseja realmente excluir este horário?')) return;

  try {
    const { error } = await supabaseClient
      .from('horarios')
      .delete()
      .eq('id', horario.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (error) throw error;

    state.horarios = state.horarios.filter(h => h.id !== id);

    salvarDados();
    mostrarToast('Horário excluído com sucesso.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao excluir horário:', erro);
    mensagemErro('Não foi possível excluir o horário.');
  }
}


async function editarHorarioSupabase(id) {
  const horario = state.horarios.find(h => h.id === id);

  if (!horario) return;

  if (horario.status !== 'livre' || horario.pacienteId || (horario.fila || []).length) {
    return mensagemErro('Não é possível editar um horário ocupado ou com pacientes na fila.');
  }

  if (!horario.supabaseId) {
    return mensagemErro('Este horário ainda não está vinculado ao Supabase.');
  }

  const novaData = prompt('Nova data (AAAA-MM-DD):', horario.data);
  if (novaData === null) return;

  if (!/^\d{4}-\d{2}-\d{2}$/.test(novaData)) {
    return mensagemErro('Informe uma data válida no formato AAAA-MM-DD.');
  }

  const novaHora = prompt('Novo horário (HH:MM):', horario.hora);
  if (novaHora === null) return;

  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(novaHora)) {
    return mensagemErro('Informe um horário válido no formato HH:MM.');
  }

  const novaModalidade = prompt(
    'Modalidade (presencial ou online):',
    horario.modalidade
  );

  if (novaModalidade === null) return;

  const modalidade = novaModalidade.trim().toLowerCase();

  if (!['presencial', 'online'].includes(modalidade)) {
    return mensagemErro('Modalidade inválida. Use presencial ou online.');
  }

  const conflito = state.horarios.find(h =>
    h.id !== id &&
    h.profissionalId === horario.profissionalId &&
    h.agendaId === horario.agendaId &&
    h.data === novaData &&
    h.hora === novaHora
  );

  if (conflito) {
    return mensagemErro('Já existe um horário nessa data e hora para esta agenda.');
  }

  if (horarioBloqueado(horario.profissionalId, novaData, horario.agendaId)) {
    return mensagemErro('Essa data possui um bloqueio nesta agenda.');
  }

  try {
    const { error } = await supabaseClient
      .from('horarios')
      .update({
        data: novaData,
        hora: novaHora,
        modalidade: modalidade
      })
      .eq('id', horario.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (error) throw error;

    horario.data = novaData;
    horario.hora = novaHora;
    horario.modalidade = modalidade;

    salvarDados();
    mostrarToast('Horário atualizado com sucesso.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao editar horário:', erro);
    mensagemErro('Não foi possível atualizar o horário.');
  }
}



function cartaoHorario(h, visao = 'paciente'){
  const isProf = visao === 'profissional';

    const alvoView = (h.status === 'livre' && espelhoReservado(h)) ? espelhoReservado(h) : h;
    const jaAgendado = alvoView.pacienteId === pacienteAtual;

      ${h.fila.map((pid, i) => `<div>${i+1}. ${escaparHtml(getPaciente(pid)?.nome||'Paciente')}${nomeAgendaOrigem((h.filaOrigem||[])[i])}</div>`).join('')}
    </div>` : '';

const acoes =
  h.status === 'concluido'

      <p class="text-sm text-[var(--ink-soft)] mb-6">Busque por nome ou especialidade e use os filtros para chegar mais rápido.</p>
      <div class="card p-4 mb-5 bg-white grid sm:grid-cols-2 gap-3">
        <input type="text" placeholder="🔍 Buscar profissional..." value="${escaparHtml(buscaProfissionalTexto)}" oninput="onBuscaProfissionalInput(this.value)" class="border border-[var(--line)] rounded-lg px-3 py-2 text-sm sm:col-span-2">
        ${sel('onFiltroEspecialidadeChange', filtroEspecialidade, 'todas', 'Especialidade', esp)}
        ${sel('onFiltroModalidadeChange', filtroModalidadeProf, 'todas', 'Modalidade', ['presencial','online'])}
        ${sel('onFiltroConvenioChange', filtroConvenio, 'todos', 'Convênio', con)}
        ${sel('onFiltroClinicaChange', filtroClinica, 'todas', 'Clínica', cli)}
      </div>
      <div id="lista-profissionais">${renderCardsProfissionais()}</div>
    </div>`;
}

function telaPaciente(){
  if (abaPaciente === 'consultas') return telaPacienteConsultas();
  if (state.profissionalSelecionadoId && state.agendaAberta) return telaPacienteAgenda();
  if (state.profissionalSelecionadoId) return telaPacientePerfil();
  return telaPacienteBusca();
}

// Perfil: reaproveita o original, mas sem depender da clínica
const _telaPerfilOriginal = telaPacientePerfil;
telaPacientePerfil = function(){
  const p = getProfissional(state.profissionalSelecionadoId);
  const getOrig = getClinica; getClinica = () => null;
  let h; try { h = _telaPerfilOriginal(); } finally { getClinica = getOrig; }
  h = h.replace('Voltar para médicos', 'Voltar para a busca');
  if (p.clinicaNome) h = h.replace(`<p class="text-sm text-[var(--ink-soft)]">${p.profissao}</p>`, `<p class="text-sm text-[var(--ink-soft)]">${p.profissao}</p><p class="text-xs text-[var(--ink-soft)] mt-1">🏥 ${escaparHtml(p.clinicaNome)}</p>`);
  const conv = conveniosDoProfissional(p);
  if (conv.length) h = h.replace('<button onclick="abrirAgendaProfissional()"', `<div class="mt-5"><h4 class="text-xs uppercase tracking-wide text-[var(--ink-soft)] font-medium mb-1">Convênios aceitos</h4><div class="flex flex-wrap gap-1.5">${conv.map(n => chipConvenio(n)).join('')}</div></div><button onclick="abrirAgendaProfissional()"`);
  return h;
};

// Login: remove a aba "Clínica" e troca o código de convite por um campo opcional
const _telaLoginOriginal = telaLogin;
telaLogin = function(){
  let h = _telaLoginOriginal();
  h = h.replace(/<label class="tab-btn flex-1 text-center[^"]*" style="cursor:pointer;">\s*<input type="radio" name="tipo"[^>]*alternarTipoConta\('clinica'\)[^>]*>[^<]*<\/label>/, '');
  h = h.replace(/<div>\s*<input id="cad-codigo-clinica"[\s\S]*?<\/p>\s*<\/div>/, '<input id="cad-clinica-nome" type="text" placeholder="Clínica/local onde atende (opcional)" class="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm">');
  return h;
};

// Menu: "Clínicas" vira "Buscar"
const _barraOriginal = barraNavegacao;
barraNavegacao = function(){
  return _barraOriginal().split('>Clínicas</span>').join('>Buscar</span>').split('</span>Clínicas</button>').join('</span>Buscar</button>');
};

// Cadastro: profissional sem código de convite; sem cadastro de clínica
function fazerCadastro(){
  const nome = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  if (!nome || !email || !senha) { mensagemErro('Preencha os campos obrigatórios.'); return; }

  if (tipoContaSelecionado === 'paciente') {
    if (state.pacientes.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const novo = { id: state.proximoIdPaciente++, nome, email, senha };
    state.pacientes.push(novo);
    state.usuario = { tipo: 'paciente', id: novo.id, nome: novo.nome };
    abaPaciente = 'profissionais';
  } else {
    const profissao = document.getElementById('cad-profissao').value.trim();
    if (!profissao) { mensagemErro('Preencha sua profissão.'); return; }
    if (state.profissionais.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const especialidade = document.getElementById('cad-especialidade').value.trim();
    const descricao = document.getElementById('cad-descricao').value.trim();
    const modalidadeAtendimento = document.getElementById('cad-modalidade').value;
    const localAtendimento = document.getElementById('cad-local')?.value.trim() || '';
    const clinicaNome = document.getElementById('cad-clinica-nome')?.value.trim() || '';
    const novo = {
      id: state.proximoIdProfissional++, nome, email, senha, profissao,
      especialidade: especialidade || profissao,
      descricao: descricao || 'Profissional cadastrado no Vezzo.',
      avatar: '🧑‍⚕️',
      clinicaId: null, clinicaNome,
      modalidadeAtendimento: modalidadeAtendimento || 'presencial',
      localAtendimento: modalidadeAtendimento !== 'online' ? localAtendimento : '',
    };
    state.profissionais.push(novo);
    state.usuario = { tipo: 'profissional', id: novo.id, nome: novo.nome, profissao: novo.profissao };
    state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: novo.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
    agendaSelecionadaId = agendasDoProfissional(novo.id)[0]?.id ?? null;
    mostrarToast('Cadastro concluído! Você já aparece na busca dos pacientes.');
  }
  render();
}

/* ===== VEZZO-CLINICA-WIDGET: vínculo com clínica no cadastro (pesquisar, escolher ou adicionar) ===== */
let cadClinica = null; // { id } = clínica existente | { novo: 'Nome' } = será criada ao concluir o cadastro
const normTxt = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function clinicaChipHtml(){
  if (!cadClinica) return '';
  const nome = cadClinica.id ? getClinica(cadClinica.id)?.nome : cadClinica.novo;
  return `<div class="flex items-center justify-between gap-2 bg-[var(--gold-bg)] rounded-lg px-3 py-2 text-sm mb-1"><span>🏥 ${escaparHtml(nome||'')}${cadClinica.novo ? ' <span class="text-xs text-[var(--ink-soft)]">(nova clínica)</span>' : ''}</span><button type="button" onclick="clinicaRemover()" class="text-xs text-[var(--brick)]">Remover</button></div>`;
}
function clinicaWidgetHtml(){
  return `<div>
    <label class="text-xs text-[var(--ink-soft)] block mb-1">Clínica onde atende (opcional)</label>
    <div id="cad-clinica-escolhida">${clinicaChipHtml()}</div>
    <input id="cad-clinica-busca" type="text" autocomplete="off" placeholder="Pesquise o nome da clínica..." oninput="clinicaBuscar(this.value)" class="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm" style="${cadClinica ? 'display:none' : ''}">
    <div id="cad-clinica-resultados" class="mt-1 space-y-1"></div>
  </div>`;
}
function clinicaBuscar(v){
  const box = document.getElementById('cad-clinica-resultados'); if (!box) return;
  const t = normTxt(v);
  if (!t) { box.innerHTML = ''; return; }
  const achadas = state.clinicas.filter(c => normTxt(c.nome).includes(t)).slice(0, 5);
  const exata = state.clinicas.some(c => normTxt(c.nome) === t);
  const estilo = 'class="w-full text-left text-sm px-3 py-2 rounded-lg border border-[var(--line)] bg-white hover:border-[var(--primary)]"';
  box.innerHTML = achadas.map(c => `<button type="button" ${estilo} onclick="clinicaEscolher(${c.id})">🏥 ${escaparHtml(c.nome)}</button>`).join('')
    + (exata ? '' : `<button type="button" ${estilo} onclick="clinicaAdicionar()">➕ Adicionar "${escaparHtml(v.trim())}"</button>`);
}
function clinicaAtualizarUI(){
  const chip = document.getElementById('cad-clinica-escolhida'), inp = document.getElementById('cad-clinica-busca'), box = document.getElementById('cad-clinica-resultados');
  if (chip) chip.innerHTML = clinicaChipHtml();
  if (inp) { inp.value = ''; inp.style.display = cadClinica ? 'none' : ''; }
  if (box) box.innerHTML = '';
}
function clinicaEscolher(id){ cadClinica = { id }; clinicaAtualizarUI(); }
function clinicaAdicionar(){
  const nome = (document.getElementById('cad-clinica-busca')?.value || '').trim();
  if (!nome) return;
  const existente = state.clinicas.find(c => normTxt(c.nome) === normTxt(nome));
  cadClinica = existente ? { id: existente.id } : { novo: nome };
  clinicaAtualizarUI();
}
function clinicaRemover(){ cadClinica = null; clinicaAtualizarUI(); }

// Login: troca o campo de texto simples pelo widget de pesquisa/adicionar
const _telaLoginV2 = telaLogin;
telaLogin = function(){
  let h = _telaLoginV2();
  h = h.replace(/<input id="cad-clinica-nome"[^>]*>/, () => clinicaWidgetHtml());
  return h;
};


async function fazerCadastro() {
  const nome = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;

  if (!nome || !email || !senha) {
    mensagemErro('Preencha os campos obrigatórios.');
    return;
  }

  const tipo = tipoContaSelecionado === 'paciente'
    ? 'paciente'
    : 'profissional';

  const dadosCadastro = {
    nome,
    tipo
  };

  if (tipo === 'profissional') {
    const profissao = document.getElementById('cad-profissao').value.trim();

    if (!profissao) {
      mensagemErro('Preencha sua profissão.');
      return;
    }

    const especialidade = document.getElementById('cad-especialidade').value.trim();
    const descricao = document.getElementById('cad-descricao').value.trim();
    const modalidade = document.getElementById('cad-modalidade').value;
    const localAtendimento = document.getElementById('cad-local')?.value.trim() || '';

    let clinicaNome = '';

    if (cadClinica) {
      if (cadClinica.id) {
        clinicaNome = getClinica(cadClinica.id)?.nome || '';
      } else {
        clinicaNome = cadClinica.novo || '';
      }
    }

    dadosCadastro.profissao = profissao;
    dadosCadastro.especialidade = especialidade || profissao;
    dadosCadastro.descricao = descricao || 'Profissional cadastrado no Vezzo.';
    dadosCadastro.modalidade = modalidade || 'presencial';
    dadosCadastro.local_atendimento = modalidade !== 'online'
      ? localAtendimento
      : '';
    dadosCadastro.clinica_nome = clinicaNome;
  }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password: senha,
      options: {
  emailRedirectTo: 'https://brennoo05.github.io/Vezzo/',
  data: dadosCadastro
}
    });

    if (error) {
      mensagemErro('Não foi possível realizar o cadastro: ' + error.message);
      return;
    }

    if (data.user) {
      cadClinica = null;

      mostrarToast(
        'Cadastro realizado! Confira seu e-mail para confirmar sua conta.'
      );
    }

  } catch (erro) {
    console.error('Erro no cadastro:', erro);
    mensagemErro('Ocorreu um erro ao tentar realizar o cadastro.');
  }
}
