<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vezzo — Chegou a sua vez.</title>
<meta name="theme-color" content="#F5F7FA" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230B7A6C%22/%3E%3Cpath d=%22M6 9l8.5 17L22 12%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Ccircle cx=%2224.5%22 cy=%228%22 r=%223%22 fill=%22%23fff%22/%3E%3C/svg%3E" />



<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6;
    --ink:#1B2430; --ink-soft:#5B6675;
    --primary:#0B7A6C; --primary-dark:#085F54; --primary-glow:rgba(11,122,108,.18);
    --blue:#2563EB; --violet:#6D4AE0;
    --success:#15803D; --warn:#B45309; --danger:#C62D3F;
    --line:#E3E8EF; --line-soft:#EEF1F5;
    --bg-soft:var(--surface-2); --surface-hover:#F8FAFC;
    --gold:var(--success); --gold-bg:rgba(21,128,61,.10);
    --brick:var(--danger); --brick-bg:rgba(198,45,63,.08);
    --radius-sm:8px; --radius-md:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05); --shadow-md:0 4px 12px rgba(16,24,40,.08); --shadow-lg:0 12px 32px rgba(16,24,40,.14);
    color-scheme:light;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; overflow-x:hidden; background:var(--bg); }
  body{ background:var(--bg);
    color:var(--ink); font-family:'Inter',sans-serif; letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased; margin:0; min-width:0; min-height:100vh; overflow-x:hidden;
  }
  body::before{ display:none; }
  h1,h2,h3,.font-display{ font-family:'Inter',sans-serif; letter-spacing:-.02em; font-weight:600; }
  .tabular,.stat-num,.cal-cell,.queue-chip,.notif-dot{ font-variant-numeric:tabular-nums; }
  .stat-num,.queue-chip,.tabular{  }
  a,button,[role="button"],input,select,textarea{ outline-offset:2px; }
  button:focus-visible,[role="button"]:focus-visible,a:focus-visible,.cal-cell:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:10px; }
  input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:none; border-color:var(--primary) !important; box-shadow:0 0 0 3px rgba(11,122,108,.18); }
  input,select,textarea{ font:inherit; transition:border-color .2s ease, box-shadow .2s ease; }
  input:not([type=checkbox]):not([type=radio]),select,textarea{
    background-color:var(--surface) !important; border:1px solid var(--line) !important; color:var(--ink) !important; border-radius:var(--radius-md);
  }
  input::placeholder,textarea::placeholder{ color:#7A8494; }
  input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=time]),select{ min-height:44px; }
  input[type=date],input[type=time]{ color-scheme:light; min-height:44px; }
  input[type=checkbox],input[type=radio]{ width:18px; height:18px; accent-color:var(--primary); }
  select{ appearance:none; -webkit-appearance:none; background-image:none !important; padding-right:.75rem; }
  select option{ background:var(--surface); color:var(--ink); }
  button,input,select,textarea{ max-width:100%; }
  button{ touch-action:manipulation; }
  img,svg{ max-width:100%; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  #app{ position:relative; z-index:1; }

  .card{
    background:var(--surface) !important; border:1px solid var(--line) !important; border-radius:var(--radius-lg); box-shadow:none;
    transition:box-shadow .2s ease, border-color .2s ease, transform .2s ease;
  }
  a.card:hover,.card.is-interactive:hover,.card[onclick]:hover{
    border-color:rgba(11,122,108,.45) !important; background:var(--surface-hover) !important;
  }

  .btn-primary,.btn-ghost,.btn-brick{
    display:inline-flex; align-items:center; justify-content:center; gap:.45rem; min-height:44px;
    font-weight:600; letter-spacing:.005em; cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s ease;
  }
  .btn-primary:active,.btn-ghost:active,.btn-brick:active{ transform:scale(.97); }
  .btn-primary{ background:var(--primary); color:#fff; border:none; border-radius:var(--radius-md); box-shadow:none; }
  .btn-primary:hover{ background:var(--primary-dark); filter:none; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; filter:none; }
  .btn-ghost{ background:var(--surface); border:1px solid #CBD3DE; color:var(--ink); border-radius:var(--radius-md); }
  .btn-ghost:hover{ border-color:var(--primary); color:var(--primary-dark); background:var(--surface-hover); }
  .btn-brick{ background:var(--brick-bg); border:1px solid rgba(198,45,63,.3); color:var(--danger); border-radius:var(--radius-md); }
  .btn-brick:hover{ background:rgba(198,45,63,.14); border-color:rgba(198,45,63,.5); color:#A11F31; }

  .badge{ font-size:.7rem; font-weight:600; padding:.25rem .6rem; border-radius:999px; display:inline-flex; align-items:center; gap:.3rem; white-space:nowrap; font-family:'Inter',sans-serif; border:1px solid transparent; }
  .badge-livre{ background:rgba(21,128,61,.1); color:#14692F; border-color:rgba(21,128,61,.25); }
  .badge-ocupado{ background:rgba(37,99,235,.09); color:#1D4FBF; border-color:rgba(37,99,235,.25); }
  .badge-lotado{ background:rgba(180,83,9,.1); color:#9A4507; border-color:rgba(180,83,9,.28); }
  .badge-concluido{ background:var(--surface-2); color:var(--ink-soft); border-color:var(--line); }
  
  .queue-chip{ width:30px; height:30px; border-radius:999px; background:rgba(180,83,9,.1); color:#9A4507; font-size:.78rem; font-weight:600; display:flex; align-items:center; justify-content:center; border:1px solid rgba(180,83,9,.28); }
  .cal-cell{ width:36px; height:36px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:.85rem; cursor:pointer; position:relative; transition:all .15s ease; border:1px solid transparent; }
  .cal-cell:hover{ background:rgba(11,122,108,.08); }
  .cal-cell.selected{ background:var(--primary); color:#fff; font-weight:700; }
  .cal-cell.today{ font-weight:700; border-color:var(--primary); color:var(--primary-dark); }
  .cal-dot{ position:absolute; bottom:4px; width:4px; height:4px; border-radius:999px; background:var(--primary); }
  .cal-cell.selected .cal-dot{ background:#fff; }
  .cal-cell.blocked{ background:var(--brick-bg); color:var(--danger); text-decoration:line-through; }
  .cal-block{ position:absolute; bottom:2px; font-size:11px; font-weight:700; color:var(--danger); }
  .cal-dots-wrap{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
  .cal-dot-agenda{ width:5px; height:5px; border-radius:999px; }
  .cal-legenda-agenda{ display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); }
  .cal-legenda-swatch{ width:7px; height:7px; border-radius:999px; display:inline-block; flex:none; }
  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(100,116,139,.35); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(15,23,42,.45);  display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; animation:fadeIn .2s ease-out; }
  .modal-overlay > .card{ background:var(--surface) !important; border:1px solid var(--line) !important; box-shadow:var(--shadow-lg); animation:riseIn .22s ease-out; }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:1.25rem .9rem; text-align:center; position:relative; overflow:hidden; }
  .stat-num{ font-size:2.1rem; color:var(--primary-dark); line-height:1; font-weight:600; }
  .avatar-circle{ width:56px; height:56px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex-shrink:0; }
  .notif-panel{ position:absolute; right:0; top:calc(100% + 10px); width:340px; max-width:88vw; max-height:420px; overflow-y:auto; z-index:40; box-shadow:var(--shadow-lg); animation:popIn .15s ease-out; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); }
  @keyframes popIn{ from{opacity:0; transform:translateY(-6px) scale(.98);} to{opacity:1; transform:none;} }
  .notif-dot{ position:absolute; top:-4px; right:-6px; background:var(--danger); color:#fff; font-size:.65rem; font-weight:700; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 0 0 2px var(--surface); }
  .tab-row{ display:inline-flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; border:1px solid var(--line); }
  .tab-btn{ padding:.5rem 1.1rem; border-radius:8px; font-size:.83rem; font-weight:500; cursor:pointer; transition:all .2s ease; font-family:'Inter',sans-serif; min-height:40px; }
  .tab-btn.active{ background:var(--surface); color:var(--primary-dark); font-weight:600; box-shadow:var(--shadow-sm); }
  .tab-btn:not(.active){ background:transparent; color:var(--ink-soft); }
  .tab-btn:not(.active):hover{ color:var(--ink); background:rgba(15,23,42,.05); }
  .toast-wrap{ position:fixed; right:1.25rem; bottom:1.25rem; z-index:100; display:flex; flex-direction:column; gap:.65rem; width:min(360px,calc(100vw - 2.5rem)); }
  .toast{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-md); padding:.85rem 1rem; box-shadow:var(--shadow-lg); display:flex; align-items:flex-start; gap:.65rem; animation:toastIn .25s ease; position:relative; overflow:hidden; color:var(--ink); }
  .toast::after{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary); }
  .toast.success::after{ background:var(--success); }
  .toast.error::after{ background:var(--danger); }
  .toast.info::after{ background:var(--blue); }
  @keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  .calendar-popover{ width:290px; max-width:calc(100vw - 2rem); }
  .rec-dia-wrap{ position:relative; }
  .rec-dia{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  .rec-dia + span{ transition:all .15s ease; user-select:none; }
  .rec-dia:checked + span{ background:var(--primary); color:#fff; border-color:transparent; }
  .rec-dia:focus-visible + span{ outline:2px solid var(--primary); outline-offset:2px; }
  .live-dot{ display:inline-block; width:8px; height:8px; border-radius:99px; background:var(--success); }

  .topbar{ position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9);  border-bottom:1px solid var(--line); }
  .vz-logo{ display:inline-flex; align-items:center; flex-shrink:0; }
  .mobile-bottombar{ display:none; }
  @media (max-width:768px){
    .mobile-bottombar{ display:flex; position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(255,255,255,.96);  border-top:1px solid var(--line); padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom)); }
    .mobile-bottombar button{ flex:1; min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; font-size:.66rem; font-weight:500; color:var(--ink-soft); border-radius:10px; background:transparent; border:none; }
    .mobile-bottombar button .ic{ display:flex; }
    .mobile-bottombar button .ic svg{ width:22px; height:22px; }
    .mobile-bottombar button.active{ color:var(--primary); }
    body{ padding-bottom:72px; }
    .max-w-5xl,.max-w-4xl,.max-w-3xl,.max-w-2xl{width:100%;max-width:none;}
    #app > div{max-width:100%;}
    .card{border-radius:var(--radius-md);}
    .stat-card{padding:.9rem .55rem;min-width:0;}
    .stat-num{font-size:1.6rem;}
    .notif-panel{position:fixed;left:.75rem;right:.75rem;top:4.5rem;width:auto;max-width:none;max-height:min(70vh,420px);}
    .modal-overlay{padding:0;align-items:flex-end;}
    .modal-overlay > .card{max-height:88vh;overflow-y:auto;border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:100%;}
    .calendar-popover{z-index:70;}
    .tab-btn{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;}
    .tab-row{width:100%;}
    .card{overflow:hidden}
    .grid{min-width:0}
    input,select,textarea{min-width:0}
    .action-row > button,.action-row > a{flex:1 1 140px}
  }
  @media (max-width:640px){
    body{font-size:14.5px;}
    .calendar-popover{position:fixed !important;left:50% !important;right:auto !important;top:4.75rem !important;transform:translateX(-50%);width:min(340px,calc(100vw - 1rem)) !important;max-width:calc(100vw - 1rem);margin:0 !important;}
    .cal-cell{width:38px;height:38px;}
    .toast-wrap{right:.5rem;left:.5rem;bottom:calc(.5rem + 72px);width:auto;}
    .toast{padding:.75rem .8rem;}
    .btn-primary,.btn-ghost,.btn-brick{min-height:44px;}
    .flex.items-center.justify-between{min-width:0;}
    .grid.grid-cols-2{grid-template-columns:1fr 1fr;}
    .grid.grid-cols-3,.grid.lg\:grid-cols-3{grid-template-columns:1fr;}
    .space-y-3 > *{min-width:0;}
    textarea{min-height:72px;}
  }
  @media (max-width:420px){
    .px-4{padding-left:1rem!important;padding-right:1rem!important;}
    .py-8{padding-top:1.25rem!important;padding-bottom:1.25rem!important;}
    .py-6{padding-top:1rem!important;padding-bottom:1rem!important;}
    .font-display.text-2xl{font-size:1.4rem;line-height:1.2;}
    .grid.grid-cols-2{gap:.5rem;}
    .stat-num{font-size:1.4rem;}
    .badge{font-size:.66rem;padding:.18rem .5rem;}
    .card.p-4{padding:.85rem;} .card.p-5{padding:1rem;} .card.p-6{padding:1.1rem;}
  }
  .action-row{display:flex;flex-wrap:wrap;gap:.5rem;min-width:0}
  .action-row > *{min-width:0}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media (max-width:480px){
    .action-row > button,.action-row > a{flex:1 1 100%}
    .cartao-horario{flex-direction:column;align-items:stretch !important;}
    .cartao-horario > div:last-child{width:100%;text-align:left !important;min-width:0 !important;}
    .cartao-horario > div:last-child .flex-col{flex-direction:row;flex-wrap:wrap;}
    .cartao-horario > div:last-child button{flex:1 1 auto;}
  }
  .convenio-chip{ display:inline-flex; align-items:center; gap:.35rem; font-size:.7rem; font-weight:600; padding:.2rem .6rem .2rem .25rem; border-radius:999px; border:1px solid var(--line); background:var(--surface); white-space:nowrap; font-family:'Inter',sans-serif; }
  .convenio-chip .sigla{ width:20px; height:20px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:700; color:#fff; flex-shrink:0;  }
  .clinica-icon{ width:56px; height:56px; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.7rem; flex-shrink:0; }
  #fluxo-hero{ display:block; margin:0 auto; }
  .agenda-view-toggle{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border:1px solid var(--line);border-radius:10px;}
  .agenda-view-toggle button{border:0;background:transparent;padding:.45rem .7rem;min-height:36px;border-radius:7px;font-size:.75rem;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .agenda-view-toggle button.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}
  .agenda-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .agenda-week-day{min-height:120px;}
  .report-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .report-bar > span{display:block;height:100%;background:var(--primary);border-radius:99px;}
  .notification-category{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin-bottom:.35rem;}
  .bg-white{ background-color:var(--surface) !important; color:var(--ink) !important; }
  .shadow-sm,.shadow-md,.shadow-lg{ box-shadow:var(--shadow-sm) !important; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
    .card:hover{ transform:none !important; }
  }

/* ===== Telas de acesso (wireframes 01–10) ===== */
.vz-titulo{font-size:1.25rem;font-weight:650;color:var(--ink);letter-spacing:-.01em}
.vz-sub{font-size:.85rem;color:var(--ink-soft);margin-top:.35rem;line-height:1.45}
.vz-etapa{display:inline-block;font-size:.7rem;font-weight:600;color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);border-radius:999px;padding:.2rem .6rem;margin-bottom:.6rem}
.vz-label{display:block;font-size:.75rem;font-weight:600;color:var(--ink);margin-bottom:.3rem}
.vz-input{width:100%;border:1px solid var(--line);border-radius:.6rem;padding:.6rem .75rem;font-size:.875rem;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.vz-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.vz-input-erro{border-color:var(--brick)!important}
.vz-input-erro:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--brick) 18%,transparent)}
.vz-msg{font-size:.72rem;color:var(--ink-soft);margin-top:.3rem;min-height:0}
.vz-msg:empty{display:none}
.vz-msg-erro{color:var(--brick)}
.vz-alerta{display:flex;gap:.5rem;align-items:flex-start;margin-top:1rem;padding:.65rem .8rem;border-radius:.6rem;font-size:.8rem;background:color-mix(in srgb,var(--brick) 8%,#fff);border:1px solid color-mix(in srgb,var(--brick) 30%,transparent);color:var(--brick)}
.vz-check{display:flex;gap:.55rem;align-items:flex-start;font-size:.78rem;color:var(--ink-soft);cursor:pointer;line-height:1.4}
.vz-check input{margin-top:.15rem;accent-color:var(--primary);width:1rem;height:1rem;flex-shrink:0}
.vz-link{color:var(--primary);text-decoration:underline;text-underline-offset:2px;background:none;border:none;cursor:pointer;padding:0}
.vz-divisor{display:flex;align-items:center;gap:.6rem;margin:1.25rem 0 .75rem;font-size:.75rem;color:var(--ink-soft)}
.vz-divisor::before,.vz-divisor::after{content:"";flex:1;height:1px;background:var(--line)}
.vz-opcao{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:.8rem;padding:1rem;background:#fff;transition:border-color .15s,box-shadow .15s}
.vz-opcao:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.vz-opcao-icone{width:2.5rem;height:2.5rem;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:color-mix(in srgb,var(--primary) 10%,transparent)}
.vz-segmentos{display:flex;flex-wrap:wrap;gap:.35rem}
.vz-seg{border:1px solid var(--line);border-radius:.55rem;padding:.4rem .75rem;font-size:.78rem;background:#fff;color:var(--ink);cursor:pointer}
.vz-seg.ativo{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.vz-icone-grande{width:3rem;height:3rem;margin:0 auto 1rem;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:color-mix(in srgb,var(--primary) 10%,transparent)}
.vz-icone-ok{background:var(--primary);color:#fff;font-weight:700}

/* ===== Área do paciente (P01–P09) ===== */
.vz-h1{font-size:1.4rem;font-weight:650;color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.vz-h3{font-size:.9rem;font-weight:650;color:var(--ink)}
.vz-voltar{font-size:.8rem;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:0}
.vz-voltar:hover{color:var(--primary)}
.vz-busca{display:flex;align-items:center;gap:.6rem;background:#fff;border:1px solid var(--line);border-radius:.75rem;padding:.65rem .9rem}
.vz-busca:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}

function iniciarAnimacaoHero(){
  const canvas = document.getElementById('fluxo-hero');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const W = canvas.width, H = canvas.height;
  const reduzMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function desenhar(t){
    if (!document.body.contains(canvas)) return; // tela trocou, encerra este loop
    ctx.clearRect(0,0,W,H);

    ctx.strokeStyle = '#0B7A6C';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x=0; x<=W; x+=2){
      const fase = reduzMovimento ? 0 : t/900;
      const env = Math.min(1, x/40) * Math.min(1, (W-x)/40 + .3);
      const y = H/2 + Math.sin(x/22 + fase) * 8 * env;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();

    if (!reduzMovimento){
      const px = (t/20) % W;
      const env = Math.min(1, px/40) * Math.min(1, (W-px)/40 + .3);
      const py = H/2 + Math.sin(px/22 + t/900) * 8 * env;
      ctx.fillStyle = '#0B7A6C';
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
      requestAnimationFrame(desenhar);
    }
  }
  requestAnimationFrame(desenhar);
}

/* --- Horários compartilhados entre agendas (convênios) ---
   O mesmo dia/hora pode existir em várias agendas do profissional. Quando um paciente
   pega o horário em uma agenda, o mesmo dia/hora das outras agendas deixa de aparecer.
   Se a consulta for cancelada, o horário volta a ficar disponível em todas as agendas. */
function horariosEspelho(h){
  if (!h) return [];
  return state.horarios.filter(x => x.id !== h.id && x.status !== 'removido'
    && x.profissionalId === h.profissionalId
    && x.data === h.data
    && x.hora === h.hora);
}
function espelhoReservado(h){
  return horariosEspelho(h).find(x => x.pacienteId != null || x.status === 'concluido') || null;
}

  return !espelhoReservado(h);

/* --- Prioridade entre agendas e janela de exclusividade ---
   Cada agenda do profissional tem uma "prioridade" (1 = mais prioritária). Quando o mesmo
   dia/hora existe em mais de uma agenda, a agenda de maior prioridade fica visível para
   agendamento imediatamente; as demais só aparecem para o paciente depois que a janela de
   exclusividade (em horas, configurável) expira, ou assim que a vaga é ocupada em algum lugar
   (a partir daí a fila de espera vale para qualquer convênio, como já acontecia antes). */
function agendaPrioritariaParaHorario(h){
  if (!h) return null;
  const idsAgendas = [h.agendaId, ...horariosEspelho(h).map(x => x.agendaId)];
  const agendas = state.agendas.filter(a => idsAgendas.includes(a.id));
  if (!agendas.length) return null;
  return agendas.slice().sort((a,b) => (a.prioridade ?? 9999) - (b.prioridade ?? 9999))[0];

    return mensagemErro('Agenda não encontrada no Supabase. Atualize a página e tente novamente.');
  }

  const registros = [];
  let ocupadas = 0;
  let data = inicio;

  while (data <= fim) {
    if (!horarioBloqueado(state.usuario.id, data, agendaSelecionadaId)) {
      const ocupados = state.horarios.filter(h =>
        h.profissionalId === state.usuario.id &&
        h.agendaId === agendaSelecionadaId &&
        h.data === data &&
        (h.pacienteId || h.fila.length)
      );

      if (ocupados.length) {
        ocupadas++;
      } else {
        registros.push({
          profissional_id: state.usuario.id,
          agenda_id: agenda.supabaseId,
          data,
          motivo
        });
      }
    }

    data = adicionarDiasISO(data, 1);
  }

  if (!registros.length) {
    return mensagemErro(
      ocupadas
        ? `Nenhuma data foi bloqueada porque ${ocupadas} dia(s) possuem atendimento ou fila.`
        : 'Todas as datas selecionadas já estão bloqueadas.'
    );
  }

  try {
    const { data: bloqueiosSalvos, error } = await supabaseClient
      .from('bloqueios')
      .insert(registros)
      .select('*');

    if (error) throw error;

    for (const b of bloqueiosSalvos) {
      const { error: erroExcluirHorarios } = await supabaseClient
        .from('horarios')
        .delete()
        .eq('profissional_id', state.usuario.id)
        .eq('agenda_id', b.agenda_id)
        .eq('data', b.data)
.eq('status', 'livre');

      if (erroExcluirHorarios) throw erroExcluirHorarios;

      state.bloqueios.push({
        id: state.proximoIdBloqueio++,
        supabaseId: b.id,
        profissionalId: b.profissional_id,
        agendaId: agendaSelecionadaId,
        data: b.data,
        motivo: b.motivo || 'Indisponibilidade'
      });

   state.horarios = state.horarios.filter(h =>
  !(h.profissionalId === state.usuario.id &&
    h.agendaId === agendaSelecionadaId &&
    h.data === b.data &&
    h.status === 'livre')
);
    }

    salvarDados();

    mostrarToast(
      `${bloqueiosSalvos.length} ${bloqueiosSalvos.length === 1 ? 'data bloqueada' : 'datas bloqueadas'}${ocupadas ? ` · ${ocupadas} não bloqueada(s) por terem atendimento/fila` : ''}.`,
      ocupadas ? 'info' : 'success'
    );

    render();

  } catch (erro) {
    console.error('Erro ao salvar bloqueios:', erro);
    mensagemErro('Não foi possível salvar os bloqueios no Supabase.');
  }
}

async function cadastrarRecorrencia(){

  const hora = document.getElementById('rec-hora')?.value;
  const modalidade = document.getElementById('rec-modalidade')?.value;

  if (!inicio || !fim || !hora || !dias.length)
    return mensagemErro('Selecione o período, o horário e pelo menos um dia da semana.');

  if (inicio < hojeISO() || fim < inicio)
    return mensagemErro('Confira o período da recorrência.');

  if (!agendaSelecionadaId)
    return mensagemErro('Selecione uma agenda antes de criar horários recorrentes.');

  const agenda = state.agendas.find(a => a.id === agendaSelecionadaId);

  if (!agenda?.supabaseId)
    return mensagemErro('Não foi possível identificar a agenda no Supabase.');

  let criados = 0;
  let bloqueados = 0;
  const nomesAgendasConflitantes = new Set();

  let data = inicio;

  while (data <= fim) {
    const dow = dataParaDate(data).getDay();

    if (dias.includes(dow)) {
      const r = adicionarHorarioPorData(
        state.usuario.id,
        data,
        hora,
        modalidade,
        agendaSelecionadaId
      );

     
if (r.ok) {
  const horarioLocal = state.horarios.find(h =>
    h.profissionalId === state.usuario.id &&
    h.data === data &&
    h.hora === hora &&
    h.agendaId === agendaSelecionadaId &&
    !h.supabaseId
  );

  try {
    if (!horarioLocal) throw new Error('Horário local não encontrado.');

    const { data: horarioSalvo, error: erroHorario } = await supabaseClient
      .from('horarios')
      .insert({
        profissional_id: state.usuario.id,
        agenda_id: agenda.supabaseId,
        data,
        hora,
        modalidade,
        status: 'livre'
      })
      .select()
      .single();

    if (erroHorario) throw erroHorario;

    horarioLocal.supabaseId = horarioSalvo.id;
    criados++;

  } catch (erro) {
    console.error('Erro ao salvar horário recorrente:', erro);
    state.horarios = state.horarios.filter(h => h !== horarioLocal);
    mensagemErro('Não foi possível salvar um dos horários no Supabase.');
    return;
  }
}

      else if (r.motivo === 'bloqueado') bloqueados++;
      else if (r.motivo === 'conflito') {
        nomesAgendasConflitantes.add(
          state.agendas.find(a => a.id === r.agendaId)?.nome || 'outra agenda'
        );
      }
    }

    data = adicionarDiasISO(data, 1);
  }

  const nomes = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  if (!criados) {
    let msgErro = 'Nenhum horário foi criado — todos os dias selecionados já estavam ocupados';
    msgErro += nomesAgendasConflitantes.size
      ? ` (agenda ${[...nomesAgendasConflitantes].join(', ')})`
      : (bloqueados ? ' por bloqueio' : '');

    mensagemErro(msgErro + '.');
    return;
  }

  try {
    const { data: recorrenciaSalva, error } = await supabaseClient
      .from('recorrencias')
      .insert({
        profissional_id: state.usuario.id,
        agenda_id: agenda.supabaseId,
        inicio,
        fim,
        hora,
        modalidade,
        dias
      })
      .select()
      .single();

    if (error) throw error;

    state.recorrencias.push({
      id: state.proximoIdRecorrencia++,
      supabaseId: recorrenciaSalva.id,
      profissionalId: state.usuario.id,
      agendaId: agendaSelecionadaId,
      inicio,
      fim,
      hora,
      modalidade,
      dias
    });

    let msg = `${criados} ${criados === 1 ? 'horário criado' : 'horários criados'} · ${dias.map(d => nomes[d]).join(', ')}`;

    if (bloqueados) msg += ` · ${bloqueados} ignorado(s) por bloqueio`;

    if (nomesAgendasConflitantes.size) {
      msg += ` · alguns dias já existiam na agenda ${[...nomesAgendasConflitantes].join(', ')}`;
    }

    mostrarToast(msg, 'success');

  } catch (erro) {

async function excluirAgenda(id) {
  const minhas = agendasDoProfissional(state.usuario.id);

  if (minhas.length <= 1) {
    confirmandoExclusaoAgendaId = null;
    return mensagemErro('Você precisa manter ao menos uma agenda.');
  }

  const ocupados = state.horarios.filter(
    h => h.agendaId === id && h.status !== 'removido' && (h.status !== 'livre' || h.pacienteId || h.fila.length)
  );

  if (ocupados.length) {
    confirmandoExclusaoAgendaId = null;
    return mensagemErro('Não é possível excluir: há consultas confirmadas ou fila nesta agenda.');
  }

  const agenda = state.agendas.find(a => a.id === id);
  if (!agenda) return;

  try {
    const { error: erroHorarios } = await supabaseClient
      .from('horarios')
      .delete()
      .eq('agenda_id', agenda.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (erroHorarios) throw erroHorarios;

    const { error: erroAgenda } = await supabaseClient
      .from('agendas')
      .delete()
      .eq('id', agenda.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (erroAgenda) throw erroAgenda;

    const nomeAgenda = agenda.nome;

    state.horarios = state.horarios.filter(h => h.agendaId !== id);
    state.recorrencias = state.recorrencias.filter(r => r.agendaId !== id);
    state.bloqueios = state.bloqueios.filter(b => b.agendaId !== id);
    state.agendas = state.agendas.filter(a => a.id !== id);

    confirmandoExclusaoAgendaId = null;

    if (agendaSelecionadaId === id) {
      agendaSelecionadaId = agendasDoProfissional(state.usuario.id)[0]?.id ?? null;
    }

    salvarDados();
    mostrarToast(`Agenda "${nomeAgenda}" excluída.`, 'info');
    render();

  } catch (erro) {
    console.error('Erro ao excluir agenda:', erro);
    mensagemErro('Não foi possível excluir a agenda.');
  }
}



async function moverPrioridadeAgenda(id, direcao) {
  const minhas = agendasDoProfissional(state.usuario.id)
    .slice()
    .sort((a, b) => (a.prioridade ?? 0) - (b.prioridade ?? 0));

  const idx = minhas.findIndex(a => a.id === id);
  const alvoIdx = idx + direcao;

  if (idx === -1 || alvoIdx < 0 || alvoIdx >= minhas.length) return;

  const a = minhas[idx];
  const b = minhas[alvoIdx];

  const prioridadeA = a.prioridade;
  const prioridadeB = b.prioridade;

  try {
    const atualizacoes = await Promise.all([
      supabaseClient
        .from('agendas')
        .update({ prioridade: prioridadeB })
        .eq('id', a.supabaseId)
        .eq('profissional_id', state.usuario.id),

      supabaseClient
        .from('agendas')
        .update({ prioridade: prioridadeA })
        .eq('id', b.supabaseId)
        .eq('profissional_id', state.usuario.id)
    ]);

    const erro = atualizacoes.find(resultado => resultado.error)?.error;
    if (erro) throw erro;

    a.prioridade = prioridadeB;
    b.prioridade = prioridadeA;

    salvarDados();
    mostrarToast('Ordem de prioridade atualizada.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao alterar prioridade:', erro);
    mensagemErro('Não foi possível atualizar a prioridade.');
  }
}

// Ids podem ser números (dados locais) ou UUIDs (Supabase): só converte o que for número
function numOuTextoId(v){
  if (v == null || v === '') return v;
  return Number.isNaN(Number(v)) ? v : Number(v);
}

function carregarDados() {
  const salvo = localStorage.getItem('fluxoConsultaState');
  if (salvo) {
    state = JSON.parse(salvo);
    // Migração robusta: versões anteriores podem ter estruturas incompletas no LocalStorage.
    state.profissionais = Array.isArray(state.profissionais) ? state.profissionais : [];
    state.pacientes = Array.isArray(state.pacientes) ? state.pacientes : [];
    state.horarios = Array.isArray(state.horarios) ? state.horarios : [];
    state.consultas = Array.isArray(state.consultas) ? state.consultas : [];
    state.notificacoes = Array.isArray(state.notificacoes) ? state.notificacoes : [];
    state.bloqueios = Array.isArray(state.bloqueios) ? state.bloqueios : [];
    if (!Number.isInteger(state.proximoIdBloqueio)) {
  state.proximoIdBloqueio = 1;
}
    state.recorrencias = Array.isArray(state.recorrencias) ? state.recorrencias : [];
    state.confirmacoes = state.confirmacoes && typeof state.confirmacoes === 'object' ? state.confirmacoes : {};
    state.anotacoesPrivadas = state.anotacoesPrivadas && typeof state.anotacoesPrivadas === 'object' ? state.anotacoesPrivadas : {};
    state.reagendamentos = state.reagendamentos && typeof state.reagendamentos === 'object' ? state.reagendamentos : {};
    state.avaliacoes = state.avaliacoes && typeof state.avaliacoes === 'object' ? state.avaliacoes : {};
    state.preferenciasEncaixe = Array.isArray(state.preferenciasEncaixe) ? state.preferenciasEncaixe : [];
    state.ofertasEncaixe = Array.isArray(state.ofertasEncaixe) ? state.ofertasEncaixe : [];
    state.lembretesEnviados = state.lembretesEnviados && typeof state.lembretesEnviados === 'object' ? state.lembretesEnviados : {};
    state.configuracoes = state.configuracoes && typeof state.configuracoes === 'object' ? state.configuracoes : {};
        const numOuTexto = v => (v == null ? v : (Number.isNaN(Number(v)) ? v : Number(v)));
    state.horarios.forEach(h => { h.id=numOuTextoId(h.id); h.profissionalId=numOuTextoId(h.profissionalId); h.pacienteId=numOuTexto(h.pacienteId); h.fila=Array.isArray(h.fila)?h.fila.map(numOuTexto):[]; h.status=h.status|| (h.pacienteId?'ocupado':'livre'); if(!Array.isArray(h.filaOrigem) || h.filaOrigem.length!==h.fila.length) h.filaOrigem = h.fila.map(()=>h.agendaId); });
    state.consultas.forEach(c => { c.id=numOuTextoId(c.id); c.pacienteId=numOuTexto(c.pacienteId); c.horarioId=numOuTextoId(c.horarioId); c.status=c.status||'confirmada'; });
    // Migração do encaixe: faixas múltiplas, ids inteiros de oferta, validade e paciente em estados antigos
    state.preferenciasEncaixe.forEach(p => {
      p.consultaId = numOuTextoId(p.consultaId);
      if (!Array.isArray(p.diasDisponiveis)) {
        p.diasDisponiveis = (p.dias || []).map(d => ({ diaSemana: Number(d), faixas: [{ inicio: p.horaInicio || '08:00', fim: p.horaFim || '18:00' }] }));
        delete p.dias; delete p.horaInicio; delete p.horaFim;
      }
      if (p.pacienteId == null) { const cc = state.consultas.find(x => x.id === p.consultaId); if (cc) p.pacienteId = cc.pacienteId; }
      if (p.horaLimite == null) p.horaLimite = '';
    });
    if (!Number.isInteger(state.proximoIdOfertaEncaixe)) state.proximoIdOfertaEncaixe = 1 + Math.max(0, ...state.ofertasEncaixe.map(o => Number.isInteger(o.id) ? o.id : 0));
    state.ofertasEncaixe.forEach(o => {
      if (!Number.isInteger(o.id) && !/^[0-9a-f-]{36}$/i.test(String(o.id))) { const ant = o.id; o.id = state.proximoIdOfertaEncaixe++; state.notificacoes.forEach(n => { if (n.ofertaEncaixeId === ant) n.ofertaEncaixeId = o.id; }); }
      o.consultaId = numOuTextoId(o.consultaId); o.horarioLivreId = numOuTextoId(o.horarioLivreId);
      if (o.pacienteId == null) { const cc = state.consultas.find(x => x.id === o.consultaId); if (cc) o.pacienteId = cc.pacienteId; }
      if (!o.expiraEm) o.expiraEm = new Date(new Date(o.criadaEm || Date.now()).getTime() + 120 * 60000).toISOString();
    });
    // Migração leve: garante que dados salvos antes destas melhorias não quebrem a tela.
    // Compatibilidade com estados salvos de versões anteriores: IDs devem ter o mesmo tipo.
    state.profissionais = (state.profissionais || []).map(p => ({...p, id:numOuTextoId(p.id)}));
    state.pacientes = (state.pacientes || []).map(p => ({...p, id:numOuTextoId(p.id)}));
    state.horarios = (state.horarios || []).map(h => ({...h, id:numOuTextoId(h.id), profissionalId:numOuTextoId(h.profissionalId), pacienteId:h.pacienteId == null ? null : numOuTextoId(h.pacienteId)}));
    state.consultas = (state.consultas || []).map(c => ({...c, id:numOuTextoId(c.id), pacienteId:numOuTextoId(c.pacienteId), horarioId:numOuTextoId(c.horarioId), alertaFaltas:!!c.alertaFaltas}));
    if (state.agendaAberta === undefined) state.agendaAberta = false;
    if (!Array.isArray(state.bloqueios)) state.bloqueios = [];
    if (!Array.isArray(state.recorrencias)) state.recorrencias = [];
    if (state.proximoIdRecorrencia === undefined) state.proximoIdRecorrencia = 1;
    if (!state.lembretesEnviados) state.lembretesEnviados = {};
    if (!state.confirmacoes) state.confirmacoes = {};
    if (!state.configuracoes) state.configuracoes = { cancelamentoHoras: 4, confirmacaoHoras: 3, lembrete24h: true, lembrete2h: true };
    if (state.configuracoes.cancelamentoHoras == null) state.configuracoes.cancelamentoHoras = 4;
    if (state.configuracoes.confirmacaoHoras == null) state.configuracoes.confirmacaoHoras = 3;
    if (state.configuracoes.janelaExclusividadeHoras == null) state.configuracoes.janelaExclusividadeHoras = 48;
    if (state.configuracoes.aceiteFilaMin == null) state.configuracoes.aceiteFilaMin = 120;
    if (!state.configuracoes.confirmacaoV2) { state.configuracoes.confirmacaoHoras = 24; state.configuracoes.confirmacaoV2 = true; }
    state.consultas.forEach(c => { if (c.status==='confirmada' && !state.confirmacoes[c.id]) { const h=getHorario(c.horarioId); if (h) iniciarConfirmacao(c,h); } });
    // Migração: adiciona clínicas para estados salvos de versões anteriores (sem esse conceito)
    if (!Array.isArray(state.clinicas) || !state.clinicas.length) {
      state.clinicas = clinicasPadrao();
      state.proximoIdClinica = 3;
    }
    if (state.clinicaSelecionadaId === undefined) state.clinicaSelecionadaId = null;
    if (state.proximoIdClinica === undefined) state.proximoIdClinica = (Math.max(0, ...state.clinicas.map(c=>c.id)) + 1);
    state.clinicas.forEach(c => {
      if (!c.codigoConvite) c.codigoConvite = gerarCodigoConvite();
      if (!c.email) c.email = `clinica${c.id}@email.com`;
      if (!c.senha) c.senha = '123';
    });
    // Migração: cria o conceito de agendas (grades independentes por convênio/particular) para estados salvos anteriores
    if (!Array.isArray(state.agendas)) state.agendas = [];
    if (state.proximoIdAgenda === undefined) state.proximoIdAgenda = 1;
    state.profissionais.forEach(p => {
      if (!state.agendas.some(a => a.profissionalId === p.id)) {
        state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: p.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
      }
    });
    const primeiraAgendaDoProf = {};
    state.agendas.forEach(a => { if (!(a.profissionalId in primeiraAgendaDoProf)) primeiraAgendaDoProf[a.profissionalId] = a.id; });
    state.horarios.forEach(h => { if (h.agendaId == null) h.agendaId = primeiraAgendaDoProf[h.profissionalId] ?? null; });
    state.recorrencias.forEach(r => { if (r.agendaId == null) r.agendaId = primeiraAgendaDoProf[r.profissionalId] ?? null; });
    state.bloqueios.forEach(b => { if (b.agendaId == null) b.agendaId = primeiraAgendaDoProf[b.profissionalId] ?? null; });
    // Migração: define a prioridade de cada agenda (1 = mais prioritária) preservando a ordem existente,
    // para estados salvos antes do recurso de janela de exclusividade.
    (() => {
      const contador = {};
      state.agendas.forEach(a => {
        if (a.prioridade == null) {
          contador[a.profissionalId] = (contador[a.profissionalId] || 0) + 1;
          a.prioridade = contador[a.profissionalId];
        }
      });
    })();
    state.profissionais.forEach(p => {
      if (!p.especialidade) p.especialidade = p.profissao;
      if (!p.avatar) p.avatar = '🧑⚕️';
      if (!p.descricao) p.descricao = 'Profissional cadastrado no Vezzo.';
      if (!p.modalidadeAtendimento) p.modalidadeAtendimento = 'presencial';
      if (p.localAtendimento === undefined) p.localAtendimento = '';
      if (p.clinicaId === undefined || p.clinicaId === null) p.clinicaId = state.clinicas[state.clinicas.length - 1].id;
    });
    state.notificacoes.forEach(n => { if (n.lida === undefined) n.lida = false; if (n.profissionalId === undefined) n.profissionalId = null; });
  } else {
    // Primeiro acesso: tudo vem do Supabase (sem dados de demonstração)
    state.profissionais = [];
    state.pacientes = [];
    state.clinicas = [];
  }
}

function getHorario(id) {
  const horarios = state.horarios.filter(h => h.id === id);

  return horarios.find(h =>

  ) || horarios[0];
}

function gerarCodigoConvite(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let codigo='';
  do {
    codigo = 'FLUXO-' + Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  } while (state.clinicas.some(c=>c.codigoConvite===codigo));
  return codigo;
}

function formatarDataCurta(iso){

  return s.charAt(0).toUpperCase() + s.slice(1).replace('.', '');
}
function formatarDataCompleta(iso){

  return s.charAt(0).toUpperCase() + s.slice(1);
}

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function uuidOuNulo(v){ return (typeof v === 'string' && UUID_RE.test(v)) ? v : null; }
function uuidPaciente(id){
  if (id == null) return null;
  const p = state.pacientes.find(x => String(x.id) === String(id));
  return uuidOuNulo(p?.supabaseId) || uuidOuNulo(id);
}
function uuidProfissional(id){
  if (id == null) return null;
  const p = state.profissionais.find(x => String(x.id) === String(id));
  return uuidOuNulo(p?.supabaseId) || uuidOuNulo(id);
}
function uuidConsulta(id){
  if (id == null) return null;
  const c = state.consultas.find(x => String(x.id) === String(id));
  return uuidOuNulo(c?.supabaseId);
}

// Janela de confirmação no visual do Vezzo (substitui o confirm() do navegador).
// Uso: if (!(await confirmarAcao({ titulo, mensagem, textoConfirmar, perigo: true }))) return;
function confirmarAcao({ titulo = 'Confirmar', mensagem = '', textoConfirmar = 'Confirmar', textoCancelar = 'Voltar', perigo = false } = {}){
  return new Promise(resolve => {
    document.getElementById('modal-confirmar-acao')?.remove();
    const modal = document.createElement('div');
    modal.id = 'modal-confirmar-acao';
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="card bg-white p-6 max-w-md w-full" role="alertdialog" aria-modal="true" aria-labelledby="titulo-confirmar-acao" aria-describedby="texto-confirmar-acao">
        <h3 id="titulo-confirmar-acao" class="font-display text-xl">${escaparHtml(titulo)}</h3>
        <p id="texto-confirmar-acao" class="text-sm text-[var(--ink-soft)] mt-2">${escaparHtml(mensagem)}</p>
        <div class="flex gap-2 mt-6">
          <button data-acao="cancelar" class="btn-ghost flex-1 py-2.5 text-sm">${escaparHtml(textoCancelar)}</button>
          <button data-acao="confirmar" class="${perigo ? 'btn-brick' : 'btn-primary'} flex-1 py-2.5 text-sm font-medium">${escaparHtml(textoConfirmar)}</button>
        </div>
      </div>`;
    const fechar = valor => {
      document.removeEventListener('keydown', teclado);
      modal.remove();
      resolve(valor);
    };
    const teclado = e => { if (e.key === 'Escape') fechar(false); };
    modal.addEventListener('click', e => {
      if (e.target === modal) return fechar(false);
      const acao = e.target.closest('[data-acao]')?.dataset.acao;
      if (acao) fechar(acao === 'confirmar');
    });
    document.addEventListener('keydown', teclado);
    document.body.appendChild(modal);
    modal.querySelector('[data-acao="confirmar"]')?.focus();
  });
}

// Normaliza para o formato internacional sem "+": 55 + DDD + número (ex.: 5513981654656)
function normalizarTelefoneBR(valor){
  let d = String(valor || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return (d.length === 12 || d.length === 13) && d.startsWith('55') ? d : '';
}

function formatarTelefoneBR(e164){
  const d = String(e164 || '').replace(/^55/, '');
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return e164 || '';
}

function nomeDoPaciente(pacienteId){
  const p = getPaciente(pacienteId);
  if (p?.nome) return p.nome;
  if (state.usuario?.tipo === 'paciente' && String(state.usuario.id) === String(pacienteId)) return state.usuario.nome;
  return 'Paciente';
}

function notificar(pacienteId, tipo, mensagem, profissionalId = null){
  const n = {
    id: crypto.randomUUID(),
    pacienteId, profissionalId, tipo, mensagem,
    lida: false,
    criadaEm: new Date().toISOString(),
    pendenteSync: true,
  };
  state.notificacoes.unshift(n);
  // setTimeout: espera o código que chamou notificar() preencher n.consultaId, se houver
  setTimeout(() => salvarNotificacaoSupabase(n), 0);
}

async function salvarNotificacaoSupabase(n){
  const pacienteUuid = uuidPaciente(n.pacienteId);
  const profissionalUuid = uuidProfissional(n.profissionalId);
  if (!state.usuario || (!pacienteUuid && !profissionalUuid)) { n.pendenteSync = false; return; }

  const { error } = await supabaseClient.from('notificacoes').insert({
    id: n.id,
    paciente_id: pacienteUuid,
    profissional_id: profissionalUuid,
    consulta_id: uuidConsulta(n.consultaId),
    tipo: n.tipo,
    mensagem: n.mensagem,
    lida: n.lida,
    criada_em: n.criadaEm
  });
  n.pendenteSync = false;
  if (error) console.error('Erro ao salvar notificação:', error);
}

// Busca as notificações do usuário logado. Retorna true se chegou alguma nova.
async function carregarNotificacoesSupabase(){
  if (!state.usuario || !['paciente', 'profissional'].includes(state.usuario.tipo)) return false;
  const ehPaciente = state.usuario.tipo === 'paciente';
  const coluna = ehPaciente ? 'paciente_id' : 'profissional_id';

  const { data, error } = await supabaseClient
    .from('notificacoes')
    .select('*')
    .eq(coluna, state.usuario.id)
    .order('criada_em', { ascending: false })
    .limit(50);

  if (error) { console.error('Erro ao carregar notificações:', error); return false; }

  const antigas = new Map(state.notificacoes.map(n => [String(n.id), n]));
  const doBanco = (data || []).map(r => {
    const antiga = antigas.get(String(r.id));
    return {
      id: r.id,
      pacienteId: ehPaciente ? state.usuario.id : null,
      profissionalId: ehPaciente ? null : state.usuario.id,
      tipo: r.tipo,
      mensagem: r.mensagem,
      lida: !!r.lida,
      criadaEm: r.criada_em,
      consultaId: state.consultas.find(c => c.supabaseId === r.consulta_id)?.id ?? antiga?.consultaId ?? null,
      ofertaEncaixeId: r.oferta_encaixe_id ?? antiga?.ofertaEncaixeId
    };
  });

  const idsBanco = new Set(doBanco.map(n => String(n.id)));
  const pendentes = state.notificacoes.filter(n => n.pendenteSync && !idsBanco.has(String(n.id)));
  state.notificacoes = [...pendentes, ...doBanco];
  salvarDados();
  return doBanco.some(n => !antigas.has(String(n.id)));
}

function pacienteTemConflito(pacienteId, data, hora){
  return state.consultas.some(c => {
    if (c.pacienteId !== pacienteId) return false;
    if (!['confirmada', 'fila'].includes(c.status)) return false;
    const h = getHorario(c.horarioId);
    return h && h.data === data && h.hora === hora;
  });
}

function horarioJaEncerrado(data, hora){
  const agora = new Date();
  const hojeStr = hojeISO();
  if (data > hojeStr) return false;
  if (data < hojeStr) return true;
  const horaAtual = agora.toTimeString().slice(0,5);
  return hora <= horaAtual;
}

function horasAteConsulta(h){
  if(!h) return Infinity;
  const d = new Date(h.data + 'T' + h.hora + ':00');
  return (d.getTime() - Date.now()) / 3600000;
}
function consultaJaPassou(h){
  if(!h || !h.data || !h.hora) return false;
  return horasAteConsulta(h) <= 0;
}
function lembreteChave(c, tipo){ return `${c.supabaseId || c.id}:${tipo}`; }
function processarLembretes(){
  encProcessar();
  if(!state.usuario) return;
  const agora = Date.now();
  const limite = Number(state.configuracoes.confirmacaoHoras) || 24;
  state.consultas.filter(c=>c.status==='confirmada').forEach(c=>{
    if(state.usuario.tipo !== 'paciente' || c.pacienteId !== state.usuario.id) return; // lembretes só no app do próprio paciente
    const h=getHorario(c.horarioId); if(!h) return;
    const horas=horasAteConsulta(h);
    if(horas < 0) return;
    const prof=getProfissional(h.profissionalId); if(!prof) return;
    const conf=state.confirmacoes[c.id];
    const nomePac=nomeDoPaciente(c.pacienteId);

       if(conf && conf.status==='pendente' && !conf.aceiteAte){
      // O vencimento (liberar a vaga e promover a fila) agora é feito pelo servidor.
      if(horas <= limite && !state.lembretesEnviados[lembreteChave(c,'aviso_prazo')]){
        state.lembretesEnviados[lembreteChave(c,'aviso_prazo')] = agora;
        notificar(c.pacienteId,'confirmacao_pendente',`O prazo para confirmar sua consulta com ${prof.nome} terminou. Confirme agora: se alguém entrar na fila, a vaga será repassada.`);
        state.notificacoes[0].consultaId=c.id;
      } else if(horas > limite && horas <= limite+6 && !state.lembretesEnviados[lembreteChave(c,'lembrete_prazo')]){
        state.lembretesEnviados[lembreteChave(c,'lembrete_prazo')] = agora;
        notificar(c.pacienteId,'confirmacao_pendente',`Falta pouco: confirme sua consulta com ${prof.nome} até ${formatarPrazoConfirmacao(h)} para garantir a vaga.`);
        state.notificacoes[0].consultaId=c.id;
      }
    }

    // Lembretes de 24h e 2h agora são criados pelo banco (gerar_lembretes_vezzo, a cada 10 min),
    // assim chegam mesmo sem o paciente abrir o app (e também pelo WhatsApp).
  });
}
function prazoConfirmacao(h){
  const tit = state.consultas.find(x => x.horarioId===h.id && x.status==='confirmada');
  const ac = tit && state.confirmacoes[tit.id]?.aceiteAte;
  if (ac) return new Date(ac);
  const d = new Date(h.data + 'T' + h.hora + ':00');
  d.setHours(d.getHours() - (Number(state.configuracoes.confirmacaoHoras) || 24));
  return d;
}
function formatarPrazoConfirmacao(h){

// Avaliações agora são salvas no Supabase (ver avaliarConsulta)
function agendar(pacienteId, horarioId, opcoes = {}){
  const h = getHorario(horarioId);
  if (!h || h.status === 'concluido') {
    if (!opcoes.silencioso) mensagemErro('Este horário não está mais disponível.');
    return;
  }

  if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
    if (!opcoes.silencioso) mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
    return;
  }

  if (!opcoes.silencioso && horarioJaEncerrado(h.data, h.hora)) {
    mensagemErro('Este horário já foi encerrado e não pode mais ser agendado.');
    return;
  }

  if (!opcoes.silencioso && dentroJanelaExclusividade(h)) {
    mensagemErro('Este horário ainda está reservado com exclusividade para outra agenda.');
    return;
  }

  // O mesmo dia/hora pode existir em outras agendas (convênios). Se este horário está livre
  // mas o mesmo dia/hora já foi ocupado em outra agenda, a vaga real é aquela — a pessoa
  // entra na fila de espera dela (assim, todo convênio tem a mesma chance de fila).
  const alvo = (h.status === 'livre' && espelhoReservado(h)) ? espelhoReservado(h) : h;

  if (alvo.fila.includes(pacienteId)) {
    if (!opcoes.silencioso) mensagemErro('Você já está na fila de espera para este horário.');
    return;
  }

  const prof = getProfissional(alvo.profissionalId);
  const muitasFaltas = clienteComMuitasFaltas(pacienteId);
  if (alvo.status === 'livre') {
    alvo.status = 'ocupado';
    alvo.pacienteId = pacienteId;
    const nova = { id: state.proximoIdConsulta++, pacienteId, horarioId: alvo.id, status: 'confirmada', alertaFaltas: muitasFaltas };
    state.consultas.push(nova);
    const pendente = iniciarConfirmacao(nova, alvo);
    if (!opcoes.silencioso) {
      if (pendente) {
        notificar(pacienteId, 'confirmacao_pendente', `Consulta reservada com ${prof.nome} para ${formatarDataCurta(alvo.data)} às ${alvo.hora}. Confirme até ${formatarPrazoConfirmacao(alvo)}, senão a vaga poderá passar para a fila de espera.`);
        state.notificacoes[0].consultaId = nova.id;
      } else {
        notificar(pacienteId, 'confirmacao', `Sua consulta com ${prof.nome} foi confirmada para ${formatarDataCurta(alvo.data)} às ${alvo.hora}.`);
      }
      notificar(null, 'novo_agendamento', `${nomeDoPaciente(pacienteId)} agendou ${formatarDataCurta(alvo.data)} às ${alvo.hora}.`, prof.id);
      if (muitasFaltas) notificar(null, 'alerta_faltas', `Atenção: ${nomeDoPaciente(pacienteId)} possui ${contarFaltasPaciente(pacienteId)} faltas registradas.`, prof.id);
    }
  } else {
    alvo.fila.push(pacienteId);
    if (!Array.isArray(alvo.filaOrigem)) alvo.filaOrigem = [];
    alvo.filaOrigem.push(h.agendaId);
    alvo.status = 'lotado';
    state.consultas.push({ id: state.proximoIdConsulta++, pacienteId, horarioId: alvo.id, status: 'fila' });
    // O aviso ao titular ("alguém entrou na fila") agora é criado no banco,
    // pelo trigger trg_avisar_titular_fila na tabela fila_espera.
    if (!opcoes.silencioso) {
      notificar(pacienteId, 'fila',
        `Você entrou na fila de espera para ${formatarDataCurta(alvo.data)} às ${alvo.hora}. Sua posição é ${alvo.fila.length}.`);
      notificar(null, 'fila', `${nomeDoPaciente(pacienteId)} entrou na fila de espera para ${formatarDataCurta(alvo.data)} às ${alvo.hora}.`, prof.id);
    }
  }
  if (!opcoes.silencioso) render();
}

/* Libera um horário (sem paciente) e promove automaticamente o próximo da fila, se houver.
   Função central reutilizada tanto pelo cancelamento do profissional quanto pelo cancelamento do paciente. */
async function agendarComFeedback(pacienteId, horarioId, botao) {
  const h = getHorario(horarioId);

  if (!h) {
    mensagemErro('Horário não encontrado.');
    return;
  }

  const alvo = (h.status === 'livre' && espelhoReservado(h))
    ? espelhoReservado(h)
    : h;

  // Reserva de horário real no Supabase.
  if (alvo.status === 'livre' && alvo.supabaseId) {
    if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
      mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
      return;
    }

    if (horarioJaEncerrado(h.data, h.hora)) {
      mensagemErro('Este horário já foi encerrado.');
      return;
    }

    if (dentroJanelaExclusividade(h)) {
      mensagemErro('Este horário ainda está reservado com exclusividade para outra agenda.');
      return;
    }

    if (botao) {
      botao.disabled = true;
      botao.textContent = 'Agendando…';
    }

    try {
      const { data: consultaSupabaseId, error } = await supabaseClient
        .rpc('reservar_horario_vezzo', {
          p_horario_id: alvo.supabaseId
        });

      if (error) throw error;

      // Atualiza também o estado local da aplicação.
      agendar(pacienteId, horarioId);

      const consultaLocal = state.consultas
        .filter(c => c.pacienteId === pacienteId && c.horarioId === alvo.id)
        .pop();

      if (consultaLocal) {
        consultaLocal.supabaseId = consultaSupabaseId;
      }

            try { await carregarConsultasPacienteSupabase(); }
      catch (e) { console.error('Erro ao ressincronizar consultas:', e); }

      salvarDados();
      mostrarToast('Consulta agendada com sucesso.');
      render();

    } catch (erro) {
      console.error('Erro ao agendar no Supabase:', erro);
      mensagemErro(
        erro.message || 'Não foi possível realizar o agendamento.'
      );

      if (botao) {
        botao.disabled = false;
        botao.textContent = 'Agendar';
      }
    }

    return;
  }

  // Mantém o comportamento atual da fila de espera.

  // Registra a entrada na fila no Supabase.
  if (pacienteTemConflito(pacienteId, h.data, h.hora)) {
    mensagemErro('Você já tem uma consulta nesse mesmo dia e horário.');
    return;
  }

  if (horarioJaEncerrado(h.data, h.hora)) {
    mensagemErro('Este horário já foi encerrado.');
    return;
  }

  if (!alvo.supabaseId) {
    mensagemErro('Não foi possível identificar o horário no Supabase.');
    return;
  }

  const agendaOrigem = state.agendas.find(
    a => a.id === h.agendaId
  )?.supabaseId || null;

  if (botao) {
    botao.disabled = true;
    botao.textContent = 'Entrando na fila…';
  }

  try {
    const { data: consultaSupabaseId, error } = await supabaseClient
      .rpc('entrar_fila_vezzo', {
        p_horario_id: alvo.supabaseId,
        p_agenda_origem_id: agendaOrigem
      });

    if (error) throw error;

    // Atualiza também a fila no estado local.
    agendar(pacienteId, horarioId);

    const consultaLocal = state.consultas
      .filter(c =>
        c.pacienteId === pacienteId &&
        c.horarioId === alvo.id &&
        c.status === 'fila'
      )
      .pop();

    if (consultaLocal) {
      consultaLocal.supabaseId = consultaSupabaseId;
    }

    salvarDados();
    mostrarToast('Você entrou na fila de espera.');
    render();

  } catch (erro) {
    console.error('Erro ao entrar na fila:', erro);
    mensagemErro(
      erro.message || 'Não foi possível entrar na fila de espera.'
    );

    if (botao) {
      botao.disabled = false;
      botao.textContent = 'Agendar';
    }
  }
}


function liberarHorarioEPromover(horarioId, consultaCanceladaId){
  const h = getHorario(horarioId);
  if (!h) return;

  if (consultaCanceladaId) {
    const consultaAtual = state.consultas.find(c => c.id === consultaCanceladaId);
    if (consultaAtual) consultaAtual.status = 'cancelada';
  }

  if (h.fila.length > 0) {
    const proximoId = h.fila.shift();
    if (Array.isArray(h.filaOrigem)) h.filaOrigem.shift();
    h.pacienteId = proximoId;
    h.status = 'ocupado';

    const consultaFila = state.consultas.find(c => c.horarioId === horarioId && c.pacienteId === proximoId && c.status === 'fila');
    let pend = false;
    if (consultaFila) { consultaFila.status = 'confirmada'; pend = iniciarConfirmacao(consultaFila, h); }
    notificar(proximoId, 'promocao',
      `Uma vaga foi liberada. Você foi promovido(a) da fila para a consulta de ${formatarDataCurta(h.data)} às ${h.hora}.` + (pend ? ` Confirme até ${formatarPrazoConfirmacao(h)} para garantir a vaga.` : ''));
    if (pend && consultaFila) state.notificacoes[0].consultaId = consultaFila.id;
    // Janela curta de aceite: só quando há mais gente na fila atrás e ainda dá tempo
    const aceiteMin = Number(state.configuracoes.aceiteFilaMin) || 0;
    if (!pend && consultaFila && h.fila.length > 0 && aceiteMin > 0 && horasAteConsulta(h) * 60 > aceiteMin) {
      const ate = Date.now() + aceiteMin * 60000;
      state.confirmacoes[consultaFila.id] = { status:'pendente', aceiteAte: ate, criadoEm: new Date().toISOString() };
      notificar(proximoId, 'confirmacao_pendente', `Atenção: confirme sua vaga em ${formatarDataCurta(h.data)} às ${h.hora} até ${new Date(ate).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} (${aceiteMin} min). Sem confirmação, a vaga passa para o próximo da fila.`);
      state.notificacoes[0].consultaId = consultaFila.id;
    }
  } else {
    h.pacienteId = null;
    h.status = 'livre';
    // Nova vaga disponível: tenta encaixar pacientes com preferência de horário mais cedo
    setTimeout(() => tentarEncaixe(h.id), 0);
  }
}

/* ===== Antecipação de consulta por disponibilidade do paciente (encaixe) =====
   preferência: { consultaId, pacienteId, diasDisponiveis:[{diaSemana, faixas:[{inicio,fim}]}], dataLimite, horaLimite, ativa, encerradaMotivo }
   oferta: { id, consultaId, pacienteId, horarioLivreId, criadaEm, expiraEm, status }
   status da oferta: pendente | aceita | recusada | expirada | horario_indisponivel | cancelada */
function encDH(data, hora){ return new Date(data + 'T' + (hora || '00:00') + ':00'); }
function encLimite(p){ return encDH(p.dataLimite, p.horaLimite || '23:59'); }
function encQuando(h){
  const d = new Date(h.data + 'T00:00:00');
  return `${d.toLocaleDateString('pt-BR', { weekday: 'long' })} (${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}) às ${h.hora}`;
}
function encPref(consultaId){ return (state.preferenciasEncaixe || []).find(p => p.consultaId === consultaId); }
function encPendente(consultaId){ return (state.ofertasEncaixe || []).find(o => o.consultaId === consultaId && o.status === 'pendente'); }
function encFaixaOk(pref, data, hora){ // início inclusivo, fim exclusivo (a consulta começa dentro da faixa)
  const dia = new Date(data + 'T00:00:00').getDay();
  const d = (pref.diasDisponiveis || []).find(x => x.diaSemana === dia);
  return !!d && d.faixas.some(f => hora >= f.inicio && hora < f.fim);
}
// Regras 2–5: consulta original existe, é do paciente, está confirmada e é futura
function encMotivoConsulta(c, pacienteId){
  if (!c) return 'inexistente';
  if (pacienteId != null && c.pacienteId !== pacienteId) return 'outro_paciente';
  if (c.status !== 'confirmada') return 'nao_confirmada';
  const h = getHorario(c.horarioId);
  if (!h || horarioJaEncerrado(h.data, h.hora)) return 'passada';
  return null;
}
// Regras 6–9 e 12: a vaga é compatível com a consulta original (mesmo profissional, mesma agenda, livre, anterior, sem conflito)
function encMotivoVaga(c, hLivre){
  if (!hLivre) return 'inexistente';
  if (hLivre.status !== 'livre' || hLivre.pacienteId != null || !horarioDisponivelParaPaciente(hLivre)) return 'ocupada';
  const hAtual = getHorario(c.horarioId);
  if (hLivre.profissionalId !== hAtual.profissionalId) return 'outro_profissional';
  if (hLivre.agendaId !== hAtual.agendaId) return 'outra_agenda';
  if (encDH(hLivre.data, hLivre.hora) >= encDH(hAtual.data, hAtual.hora)) return 'nao_anterior';
  if (horarioJaEncerrado(hLivre.data, hLivre.hora)) return 'passada';
  if (dentroJanelaExclusividade(hLivre)) return 'exclusividade';
  if (pacienteTemConflito(c.pacienteId, hLivre.data, hLivre.hora)) return 'conflito';
  return null;
}
function encFechar(o, status, msgPaciente){
  o.status = status; o.respondidaEm = new Date().toISOString();
  if (msgPaciente) { notificar(o.pacienteId, 'encaixe_info', msgPaciente); state.notificacoes[0].ofertaEncaixeId = o.id; }
}

// Retorna true se algo mudou.
async function carregarEncaixeSupabase(){
  if (state.usuario?.tipo !== 'paciente') return false;
  try {
    // expira ofertas vencidas e procura vagas que já estejam livres
    const { error: erroProc } = await supabaseClient.rpc('processar_encaixe_vezzo');
    if (erroProc) console.error('Erro ao processar encaixe:', erroProc);

    const [resPrefs, resOfertas] = await Promise.all([
      supabaseClient.from('preferencias_encaixe').select('*').eq('paciente_id', state.usuario.id),
      supabaseClient.from('ofertas_encaixe').select('*').eq('paciente_id', state.usuario.id)
        .order('criada_em', { ascending: false }).limit(50)
    ]);
    if (resPrefs.error) throw resPrefs.error;
    if (resOfertas.error) throw resOfertas.error;

    const prefs = resPrefs.data || [], ofertas = resOfertas.data || [];
    const idLocal = sid => state.consultas.find(c => c.supabaseId === sid)?.id;
    const antes = JSON.stringify([state.preferenciasEncaixe, state.ofertasEncaixe]);

    state.preferenciasEncaixe = prefs.map(p => {
      const consultaId = idLocal(p.consulta_id);
      if (consultaId == null) return null;
      const horaLimite = p.hora_limite ? p.hora_limite.slice(0, 5) : '';
      const vencida = Date.now() > encDH(p.data_limite, horaLimite || '23:59').getTime();
      const aceita = ofertas.some(o => o.consulta_id === p.consulta_id && o.status === 'aceita');
      return {
        supabaseId: p.id, consultaId, pacienteId: p.paciente_id,
        diasDisponiveis: p.dias_disponiveis || [], dataLimite: p.data_limite, horaLimite,
        ativa: !!p.ativa,
        encerradaMotivo: p.ativa ? undefined : (aceita ? 'antecipada' : vencida ? 'limite' : 'manual'),
        criadaEm: p.criada_em
      };
    }).filter(Boolean);

    state.ofertasEncaixe = ofertas.map(o => ({
      id: o.id, consultaId: idLocal(o.consulta_id), pacienteId: o.paciente_id,
      horarioLivreId: o.horario_livre_id, criadaEm: o.criada_em, expiraEm: o.expira_em,
      respondidaEm: o.respondida_em, status: o.status
    }));

    ofertas.filter(o => o.status === 'aceita').forEach(o => {
      const c = state.consultas.find(x => x.supabaseId === o.consulta_id);
      if (c) c.antecipadaPorEncaixe = true;
    });

    salvarDados();
    return JSON.stringify([state.preferenciasEncaixe, state.ofertasEncaixe]) !== antes;
  } catch (erro) {
    console.error('Erro ao carregar antecipações:', erro);
    return false;
  }
}

// Registra o resultado do atendimento no Supabase ('realizada' ou 'faltou'):
// encerra a consulta, conclui o horário, encerra a fila e avisa os pacientes.
async function registrarAtendimento(consultaId, resultado){
  const consulta = state.consultas.find(c => c.id === consultaId);
  if (!consulta || consulta.status !== 'confirmada') return;
  if (!consulta.supabaseId) return mensagemErro('Não foi possível identificar a consulta no Supabase.');
  try {
    const { error } = await supabaseClient.rpc('registrar_atendimento_vezzo', {
      p_consulta_id: consulta.supabaseId,
      p_resultado: resultado
    });
    if (error) throw error;
    await recarregarAgendaProfissional();
    mostrarToast(resultado === 'realizada' ? 'Consulta marcada como realizada.' : 'Falta registrada e consulta encerrada.');
  } catch (erro) {
    console.error('Erro ao registrar atendimento:', erro);
    mensagemErro(erro?.message || 'Não foi possível registrar o atendimento.');
  }
  render();
}

  const c = state.consultas.find(x => x.id === consultaId);

      </p>
      <div class="mt-4">

async function confirmarCancelamentoProfissional(consultaId){

  const motivo = (document.getElementById('cancel-prof-motivo')?.value || '').trim();

  if (botao) { botao.disabled = true; botao.textContent = 'Cancelando...'; }

async function carregarAgendaPacienteSupabase(profissionalLocalId) {
  try {
    const profissional = getProfissional(profissionalLocalId);

    if (!profissional?.supabaseId) {
      throw new Error('Profissional sem vínculo com o Supabase.');
    }

    const profissionalSupabaseId = profissional.supabaseId;
    await carregarConfiguracoesProfissionalSupabase(profissionalSupabaseId);

    const { data: agendas, error: erroAgendas } = await supabaseClient
      .from('agendas')
      .select('*')
      .eq('profissional_id', profissionalSupabaseId)
      .order('prioridade');

    if (erroAgendas) throw erroAgendas;

    const { data: horarios, error: erroHorarios } = await supabaseClient
      .from('horarios')
      .select('*')
      .eq('profissional_id', profissionalSupabaseId);

    if (erroHorarios) throw erroHorarios;

    // Reutiliza os IDs locais das agendas já carregadas.
    const agendasLocais = agendas.map(a => {
      const existente = state.agendas.find(
        x => x.supabaseId === a.id
      );

      return {
        id: existente?.id ?? state.proximoIdAgenda++,
        supabaseId: a.id,
        profissionalId: profissionalLocalId,
        nome: a.nome,
        prioridade: a.prioridade,
        criadaEm: a.criada_em
      };
    });

    const idsAgendas = new Map(
      agendasLocais.map(a => [a.supabaseId, a.id])
    );

    // Reutiliza os IDs locais dos horários já carregados.
    const horariosLocais = horarios.map(h => {
      const existente = state.horarios.find(
        x => x.supabaseId === h.id
      );

      return {
        id: existente?.id ?? state.proximoIdHorario++,
        supabaseId: h.id,
        profissionalId: profissionalLocalId,
        agendaId: idsAgendas.get(h.agenda_id),
        data: h.data,
        hora: h.hora.slice(0, 5),
        modalidade: h.modalidade,
        status: h.status,
        pacienteId: existente?.pacienteId ?? null,
        fila: existente?.fila ?? [],
        filaOrigem: existente?.filaOrigem ?? []
      };
    });

    state.agendas = [
      ...state.agendas.filter(a => a.profissionalId !== profissionalLocalId),
      ...agendasLocais
    ];

    state.horarios = [
      ...state.horarios.filter(h => h.profissionalId !== profissionalLocalId),
      ...horariosLocais
    ];

    agendaSelecionadaPacienteId = agendasLocais[0]?.id ?? null;

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar agenda do paciente:', erro);
    mensagemErro('Não foi possível carregar a agenda deste profissional.');
    throw erro;
  }
}


async function carregarConsultasPacienteSupabase() {
  try {
    const pacienteId = state.usuario?.id;

    if (!pacienteId) {
      throw new Error('Paciente não identificado.');
    }

    // Busca as consultas deste paciente.
    const { data: consultas, error: erroConsultas } = await supabaseClient
      .from('consultas')
      .select('id, paciente_id, horario_id, status, alerta_faltas')
      .eq('paciente_id', pacienteId);

    if (erroConsultas) throw erroConsultas;

    if (!consultas.length) {
      state.consultas = state.consultas.filter(
        c => c.pacienteId !== pacienteId
      );
      salvarDados();
      return;
    }

    // Busca os horários relacionados às consultas.
    const idsHorarios = [...new Set(consultas.map(c => c.horario_id))];

    const { data: horarios, error: erroHorarios } = await supabaseClient
      .from('horarios')
      .select('*')
      .in('id', idsHorarios);

    if (erroHorarios) throw erroHorarios;

    // Busca as agendas relacionadas aos horários.
    const idsAgendas = [...new Set(horarios.map(h => h.agenda_id))];

    const { data: agendas, error: erroAgendas } = await supabaseClient
      .from('agendas')
      .select('*')
      .in('id', idsAgendas);

    if (erroAgendas) throw erroAgendas;

    const agendasLocais = new Map();

    agendas.forEach(a => {
      let agendaLocal = state.agendas.find(
        x => x.supabaseId === a.id
      );

      if (!agendaLocal) {
        agendaLocal = {
          id: state.proximoIdAgenda++,
          supabaseId: a.id,
          profissionalId: state.profissionais.find(
            p => p.supabaseId === horarios.find(h => h.agenda_id === a.id)?.profissional_id
          )?.id,
          nome: a.nome,
          prioridade: a.prioridade,
          criadaEm: a.criada_em
        };

        state.agendas.push(agendaLocal);
      }

      agendasLocais.set(a.id, agendaLocal);
    });

    const horariosLocais = new Map();

    horarios.forEach(h => {
      let horarioLocal = state.horarios.find(
        x => x.supabaseId === h.id
      );

      const profissionalLocal = state.profissionais.find(
        p => p.supabaseId === h.profissional_id
      );

      if (!profissionalLocal) {
        throw new Error('Profissional relacionado à consulta não encontrado.');
      }

      
if (!horarioLocal) {
  horarioLocal = {
    id: state.proximoIdHorario++,
    supabaseId: h.id,
    profissionalId: profissionalLocal.id,
    agendaId: agendasLocais.get(h.agenda_id)?.id,
    data: h.data,
    hora: h.hora.slice(0, 5),
    modalidade: h.modalidade,
    status: h.status,
    pacienteId: null,
    fila: [],
    filaOrigem: []
  };

  state.horarios.push(horarioLocal);
} else {
  // Atualiza os dados do horário já existente
  // para manter os vínculos com os IDs locais atuais.
  horarioLocal.profissionalId = profissionalLocal.id;
  horarioLocal.agendaId = agendasLocais.get(h.agenda_id)?.id;
  horarioLocal.data = h.data;
  horarioLocal.hora = h.hora.slice(0, 5);
  horarioLocal.modalidade = h.modalidade;
  horarioLocal.status = h.status;
  horarioLocal.supabaseId = h.id;
}


      horariosLocais.set(h.id, horarioLocal);
    });

    // Monta as consultas no formato utilizado pela aplicação.
    const consultasLocais = consultas.map(c => {
      const horarioLocal = horariosLocais.get(c.horario_id);

      if (!horarioLocal) {
        throw new Error('Horário relacionado à consulta não encontrado.');
      }

      return {
        id: state.consultas.find(x => x.supabaseId === c.id)?.id
          ?? state.proximoIdConsulta++,
        supabaseId: c.id,
        pacienteId: pacienteId,
        horarioId: horarioLocal.id,
        status: c.status,
        alertaFaltas: !!c.alerta_faltas
      };
    });

    // Marca nos horários a consulta/fila do próprio paciente
    // (assim a agenda mostra "Sua consulta ✓" / "Na fila" mesmo depois do F5).
    const ordemStatus = c => (['confirmada', 'fila'].includes(c.status) ? 1 : 0);
    consultasLocais.slice().sort((x, y) => ordemStatus(x) - ordemStatus(y)).forEach(c => {
      const h = state.horarios.find(x => x.id === c.horarioId);
      if (!h) return;
      h.fila = Array.isArray(h.fila) ? h.fila : [];
      h.filaOrigem = Array.isArray(h.filaOrigem) ? h.filaOrigem : [];
      if (c.status === 'confirmada') h.pacienteId = pacienteId;
      else if (h.pacienteId === pacienteId) h.pacienteId = null;
      const pos = h.fila.indexOf(pacienteId);
      if (c.status === 'fila') {
        if (pos === -1) { h.fila.push(pacienteId); h.filaOrigem.push(h.agendaId); }
      } else if (pos !== -1) {
        h.fila.splice(pos, 1); h.filaOrigem.splice(pos, 1);
      }
    });

    // Substitui somente as consultas deste paciente.
      // Remove cópias antigas (mesmo supabaseId) e consultas sem dono válido.
    const idsSupabaseCarregados = new Set(consultasLocais.map(c => c.supabaseId));
    state.consultas = [
      ...state.consultas.filter(c =>
        c.pacienteId !== pacienteId &&
        !idsSupabaseCarregados.has(c.supabaseId) &&
        (typeof c.pacienteId === 'string' || c.pacienteId > 0)
      ),
      ...consultasLocais
    ];

        // Confirmações vindas do banco (fonte da verdade).
    try {
      consultasLocais.forEach(c => { delete state.confirmacoes[c.id]; });

      const { data: confs, error: erroConfs } =
        await supabaseClient.rpc('listar_confirmacoes_paciente_vezzo');
      if (erroConfs) throw erroConfs;

      const idLocalPorSupabaseId = new Map(consultasLocais.map(c => [c.supabaseId, c.id]));
      (confs || []).forEach(cf => {
        const idLocal = idLocalPorSupabaseId.get(cf.consulta_id);
        if (!idLocal) return;
        state.confirmacoes[idLocal] = {
          status: cf.status,
          auto: cf.automatica,
          confirmadoEm: cf.confirmado_em,
          aceiteAte: cf.prazo_aceite ? new Date(cf.prazo_aceite).getTime() : undefined,
          avisoFila: cf.aviso_fila,
          avisoPrazo: cf.aviso_prazo,
          lembretePrazo: cf.lembrete_prazo
        };
      });
    } catch (erroConf) {
      console.error('Erro ao carregar confirmações:', erroConf);
    }

    await carregarMinhasAvaliacoes();

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar consultas do paciente:', erro);
    throw erro;
  }
}




async function carregarProfissionaisSupabase() {
  try {
    const { data: profissionais, error: erroProfissionais } =
      await supabaseClient
        .from('profissionais')
        .select('*');

    if (erroProfissionais) throw erroProfissionais;

    state.profissionais = [];
    state.clinicas = [];

    if (!profissionais.length) return;

  
const { data: perfis, error: erroPerfis } = await supabaseClient
  .rpc('listar_perfis_profissionais');

if (erroPerfis) throw erroPerfis;

const perfisPorId = new Map(perfis.map(p => [p.id, p]));

    const clinicasPorNome = new Map();
    let proximoIdClinica = 1;

    state.profissionais = profissionais.map((p, index) => {
      const perfil = perfisPorId.get(p.profile_id);
