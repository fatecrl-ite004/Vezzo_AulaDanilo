          nome: nomeClinica,
          especialidade: 'Atendimento em saúde',
          descricao: '',
          icone: '🏥',
          endereco: p.local_atendimento || 'Consulte o profissional',
          convenios: ['Particular']
        });
      }

      return {
  id: p.id,
  supabaseId: p.id,
  profileId: p.profile_id,
        nome: perfil.nome,
        email: '',
        profissao: p.profissao,
        especialidade: p.especialidade || p.profissao,
        descricao: p.descricao || 'Profissional cadastrado no Vezzo.',
        avatar: '🧑‍⚕️',
        clinicaId: clinicasPorNome.get(nomeClinica),
        clinicaNome: nomeClinica,
        modalidadeAtendimento: p.modalidade || 'presencial',
        localAtendimento: p.local_atendimento || ''
      };
    }).filter(Boolean);

    // Agendas de todos os profissionais: os nomes delas são os convênios do filtro da busca
    const { data: agendasBanco, error: erroAgendasBusca } = await supabaseClient
      .from('agendas')
      .select('id, profissional_id, nome, prioridade, criada_em');
    if (erroAgendasBusca) {
      console.error('Erro ao carregar convênios:', erroAgendasBusca);
    } else {
      (agendasBanco || []).forEach(a => {
        if (state.agendas.some(x => x.supabaseId === a.id)) return;
        const prof = state.profissionais.find(p => p.supabaseId === a.profissional_id);
        if (!prof) return;
        state.agendas.push({
          id: state.proximoIdAgenda++, supabaseId: a.id, profissionalId: prof.id,
          nome: a.nome, prioridade: a.prioridade, criadaEm: a.criada_em
        });
      });
    }

    state.proximoIdProfissional = state.profissionais.length + 1;
    state.proximoIdClinica = proximoIdClinica;

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar profissionais:', erro);
    throw erro;
  }
}


async function carregarAgendasHorariosSupabase(profissionalId) {
  try {
    const { data: agendas, error: erroAgendas } = await supabaseClient
      .from('agendas')
      .select('*')
      .eq('profissional_id', profissionalId)
      .order('prioridade');

    if (erroAgendas) throw erroAgendas;

        // Busca os horários do profissional.
    const { data: horarios, error: erroHorarios } = await supabaseClient
      .from('horarios')
      .select('*')
      .eq('profissional_id', profissionalId);

    if (erroHorarios) throw erroHorarios;


    // Busca as consultas vinculadas aos horários do profissional.
    const idsHorarios = horarios.map(h => h.id);

    let consultas = [];
    let filaEspera = [];
    let pacientesPorId = new Map();

    if (idsHorarios.length) {
      const { data: consultasBanco, error: erroConsultas } =
        await supabaseClient
          .from('consultas')
          .select('id, paciente_id, horario_id, status, alerta_faltas')
          .in('horario_id', idsHorarios);

      if (erroConsultas) throw erroConsultas;

      consultas = consultasBanco || [];

      const { data: filaBanco, error: erroFila } =
        await supabaseClient
          .from('fila_espera')
          .select('id, consulta_id, horario_id, paciente_id, agenda_origem_id, posicao, status')
          .in('horario_id', idsHorarios)
          .eq('status', 'aguardando')
          .order('posicao');

      if (erroFila) throw erroFila;

      filaEspera = filaBanco || [];

      // Busca os cadastros dos pacientes relacionados.
      const idsPacientes = [
        ...new Set(consultas.map(c => c.paciente_id))
      ];

      if (idsPacientes.length) {
        const { data: pacientesBanco, error: erroPacientes } =
          await supabaseClient
            .from('pacientes')
            .select('id, profile_id')
            .in('id', idsPacientes);

        if (erroPacientes) throw erroPacientes;

        const idsPerfis = pacientesBanco.map(p => p.profile_id);

        const { data: perfisBanco, error: erroPerfis } =
          await supabaseClient
            .from('profiles')
            .select('id, nome, email')
            .in('id', idsPerfis);

        if (erroPerfis) throw erroPerfis;

        const perfisPorId = new Map(
          perfisBanco.map(p => [p.id, p])
        );

        pacientesBanco.forEach(p => {
          const perfil = perfisPorId.get(p.profile_id);

          if (perfil) {
            pacientesPorId.set(p.id, {
              id: p.id,
              nome: perfil.nome,
              email: perfil.email
            });
          }
        });
      }
    }

    const agendasLocais = agendas.map(a => ({
      id: state.proximoIdAgenda++,
      supabaseId: a.id,
      profissionalId,
      nome: a.nome,
      prioridade: a.prioridade,
      criadaEm: a.criada_em
    }));

  
    const idsAgendas = new Map(
      agendasLocais.map(a => [a.supabaseId, a.id])
    );

    // Recorrências e bloqueios também vêm do Supabase (antes ficavam só no navegador
    // e "sumiam" ao atualizar a página, porque os ids locais das agendas mudam).
    const [resRecorrencias, resBloqueios] = await Promise.all([
      supabaseClient.from('recorrencias').select('*').eq('profissional_id', profissionalId),
      supabaseClient.from('bloqueios').select('*').eq('profissional_id', profissionalId)
    ]);
    if (resRecorrencias.error) throw resRecorrencias.error;
    if (resBloqueios.error) throw resBloqueios.error;

    state.recorrencias = [
      ...state.recorrencias.filter(r => r.profissionalId !== profissionalId),
      ...(resRecorrencias.data || []).map(r => ({
        id: state.proximoIdRecorrencia++,
        supabaseId: r.id,
        profissionalId,
        agendaId: idsAgendas.get(r.agenda_id),
        inicio: r.inicio,
        fim: r.fim,
        hora: String(r.hora).slice(0, 5),
        modalidade: r.modalidade,
        dias: (Array.isArray(r.dias) ? r.dias : []).map(Number)
      }))
    ];

    state.bloqueios = [
      ...state.bloqueios.filter(b => b.profissionalId !== profissionalId),
      ...(resBloqueios.data || []).map(b => ({
        id: state.proximoIdBloqueio++,
        supabaseId: b.id,
        profissionalId,
        agendaId: idsAgendas.get(b.agenda_id),
        data: b.data,
        motivo: b.motivo || 'Indisponibilidade'
      }))
    ];

    // Cria ou atualiza os pacientes no estado local.
    const pacientesLocaisPorSupabaseId = new Map();

    pacientesPorId.forEach((dados, pacienteSupabaseId) => {
      let pacienteLocal = state.pacientes.find(
        p => p.supabaseId === pacienteSupabaseId
      );

      if (!pacienteLocal) {
        pacienteLocal = {
          id: state.proximoIdPaciente++,
          supabaseId: pacienteSupabaseId,
          nome: dados.nome,
          email: dados.email
        };

        state.pacientes.push(pacienteLocal);
      } else {
        pacienteLocal.nome = dados.nome;
        pacienteLocal.email = dados.email;
      }

      pacientesLocaisPorSupabaseId.set(
        pacienteSupabaseId,
        pacienteLocal
      );
    });

    // Monta os horários com o paciente confirmado e a fila.
    const horariosLocais = horarios.map(h => {
      const consultaConfirmada = consultas.find(
        c => c.horario_id === h.id && c.status === 'confirmada'
      );

      const pacienteConfirmado = consultaConfirmada
        ? pacientesLocaisPorSupabaseId.get(consultaConfirmada.paciente_id)
        : null;

      const filaDoHorario = filaEspera
        .filter(f => f.horario_id === h.id)
        .sort((a, b) => a.posicao - b.posicao);

      return {
        id: state.proximoIdHorario++,
        supabaseId: h.id,
        profissionalId,
        agendaId: idsAgendas.get(h.agenda_id),
        data: h.data,
        hora: h.hora.slice(0, 5),
        modalidade: h.modalidade,
        status: h.status,
        pacienteId: pacienteConfirmado?.id ?? null,
        fila: filaDoHorario
          .map(f => pacientesLocaisPorSupabaseId.get(f.paciente_id)?.id)
          .filter(id => id != null),
        filaOrigem: filaDoHorario.map(
          f => idsAgendas.get(f.agenda_origem_id) ?? idsAgendas.get(h.agenda_id)
        )
      };
    });


        // Guarda os IDs antigos dos horários deste profissional.
    const idsHorariosAntigos = new Set(
      state.horarios
        .filter(h => h.profissionalId === profissionalId)
        .map(h => h.id)
    );

    // Converte as consultas do Supabase para o estado local.
    const consultasLocais = consultas.map(c => {
      const horarioLocal = horariosLocais.find(
        h => h.supabaseId === c.horario_id
      );

      const pacienteLocal = pacientesLocaisPorSupabaseId.get(
        c.paciente_id
      );

      if (!horarioLocal || !pacienteLocal) return null;

      const consultaExistente = state.consultas.find(
        x => x.supabaseId === c.id
      );

      return {
        id: consultaExistente?.id ?? state.proximoIdConsulta++,
        supabaseId: c.id,
        pacienteId: pacienteLocal.id,
        horarioId: horarioLocal.id,
        status: c.status,
        alertaFaltas: !!c.alerta_faltas
      };
    }).filter(Boolean);

    // Substitui as consultas antigas pelas informações do Supabase.
    state.consultas = [
      ...state.consultas.filter(
        c => !idsHorariosAntigos.has(c.horarioId)
      ),
      ...consultasLocais
    ];

    // Confirmações vindas do banco (antes o profissional "adivinhava" localmente
    // e mostrava "Aguardando confirmação" mesmo quando já estava confirmada).
    try {
      const { data: confs, error: erroConfs } =
        await supabaseClient.rpc('listar_confirmacoes_profissional_vezzo');
      if (erroConfs) throw erroConfs;

      consultasLocais.forEach(c => { delete state.confirmacoes[c.id]; });
      const idLocalPorSupabaseId = new Map(consultasLocais.map(c => [c.supabaseId, c.id]));
      (confs || []).forEach(cf => {
        const idLocal = idLocalPorSupabaseId.get(cf.consulta_id);
        if (!idLocal) return;
        state.confirmacoes[idLocal] = {
          status: cf.status,
          auto: cf.automatica,
          confirmadoEm: cf.confirmado_em,
          aceiteAte: cf.prazo_aceite ? new Date(cf.prazo_aceite).getTime() : undefined
        };
      });
    } catch (erroConf) {
      console.error('Erro ao carregar confirmações do profissional:', erroConf);
    }

    // Anotações privadas do profissional (Supabase)
    try {
      const { data: notas, error: erroNotas } = await supabaseClient
        .from('anotacoes_privadas')
        .select('id, consulta_id, texto, criada_em')
        .eq('profissional_id', profissionalId)
        .order('criada_em');
      if (erroNotas) throw erroNotas;
      const idLocalNota = new Map(consultasLocais.map(c => [c.supabaseId, c.id]));
      consultasLocais.forEach(c => { delete state.anotacoesPrivadas[c.id]; });
      (notas || []).forEach(n => {
        const idLocal = idLocalNota.get(n.consulta_id);
        if (!idLocal) return;
        (state.anotacoesPrivadas[idLocal] = state.anotacoesPrivadas[idLocal] || [])
          .push({ id: n.id, profissionalId, texto: n.texto, criadoEm: n.criada_em });
      });
    } catch (erroNotas) {
      console.error('Erro ao carregar anotações:', erroNotas);
    }

    await carregarAvaliacoesProfissional(profissionalId);


    state.agendas = [
      ...state.agendas.filter(a => a.profissionalId !== profissionalId),
      ...agendasLocais
    ];

    state.horarios = [
      ...state.horarios.filter(h => h.profissionalId !== profissionalId),
      ...horariosLocais
    ];

    agendaSelecionadaId = agendasLocais[0]?.id ?? null;

    salvarDados();

  } catch (erro) {
    console.error('Erro ao carregar agendas e horários:', erro);
    throw erro;
  }
}

await carregarAgendasHorariosSupabase(profissional.id);
await carregarConfiguracoesProfissionalSupabase(profissional.id);

    } else {
      throw new Error('Tipo de conta não reconhecido.');
    }

    await carregarContatoPaciente();
    await carregarEncaixeSupabase();
    await carregarNotificacoesSupabase();
    assinarNotificacoesRealtime();
    render();

  } catch (erro) {
    console.error('Erro ao restaurar sessão:', erro);
    state.usuario = null;
    render();
    mensagemErro('Não foi possível recuperar sua sessão. Entre novamente.');
  }
}




function fazerCadastro(){
  const nome = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  
  if (!nome || !email || !senha) { mensagemErro('Preencha os campos obrigatórios.'); return; }

  if (tipoContaSelecionado === 'paciente') {
    if (state.pacientes.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const novo = { id: state.proximoIdPaciente++, nome, email, senha };
    state.pacientes.push(novo);
    state.usuario = { tipo: 'paciente', id: novo.id, nome: novo.nome };
    abaPaciente = 'profissionais';
  } else if (tipoContaSelecionado === 'clinica') {
    if (state.clinicas.some(c => c.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const endereco = document.getElementById('cad-clinica-endereco')?.value.trim();
    const especialidade = document.getElementById('cad-clinica-especialidade')?.value.trim();
    if (!endereco) { mensagemErro('Informe o endereço da clínica.'); return; }
    const conveniosTexto = document.getElementById('cad-clinica-convenios')?.value.trim();
    const convenios = conveniosTexto ? conveniosTexto.split(',').map(s=>s.trim()).filter(Boolean) : ['Particular'];
    const nova = {
      id: state.proximoIdClinica++, nome, email, senha,
      especialidade: especialidade || 'Clínica geral',
      descricao: `${nome} — cadastrada no Vezzo.`,
      icone: '🏥',
      endereco,
      convenios,
      codigoConvite: gerarCodigoConvite(),
    };
    state.clinicas.push(nova);
    state.usuario = { tipo: 'clinica', id: nova.id, nome: nova.nome };
    mostrarToast(`Clínica cadastrada! Use o código ${nova.codigoConvite} para vincular seus profissionais.`);
  } else {
    const profissao = document.getElementById('cad-profissao').value.trim();
    if (!profissao) { mensagemErro('Preencha sua profissão.'); return; }
    const codigo = document.getElementById('cad-codigo-clinica')?.value.trim().toUpperCase();
    const clinicaEscolhida = state.clinicas.find(c => c.codigoConvite === codigo);
    if (!codigo || !clinicaEscolhida) { mensagemErro('Código de convite inválido. Confira o código com a clínica.'); return; }
    if (state.profissionais.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const especialidade = document.getElementById('cad-especialidade').value.trim();
    const descricao = document.getElementById('cad-descricao').value.trim();
    const modalidadeAtendimento = document.getElementById('cad-modalidade').value;
    const localAtendimento = document.getElementById('cad-local') ? document.getElementById('cad-local').value.trim() : '';
    const novo = {
      id: state.proximoIdProfissional++, nome, email, senha, profissao,
      especialidade: especialidade || profissao,
      descricao: descricao || 'Profissional cadastrado no Vezzo.',
      avatar: '🧑⚕️',
      clinicaId: clinicaEscolhida.id,
      modalidadeAtendimento: modalidadeAtendimento || 'presencial',
      localAtendimento: localAtendimento || (modalidadeAtendimento !== 'online' ? clinicaEscolhida.endereco : ''),
    };
    state.profissionais.push(novo);
    state.usuario = { tipo: 'profissional', id: novo.id, nome: novo.nome, profissao: novo.profissao };
    state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: novo.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
    agendaSelecionadaId = agendasDoProfissional(novo.id)[0]?.id ?? null;
    mostrarToast(`Cadastro concluído! Você já aparece em ${clinicaEscolhida.nome} para os pacientes.`);
  }
  render();
}

async function marcarNotificacaoLida(id){
  const n = state.notificacoes.find(n => String(n.id) === String(id));
  if (!n || n.lida) return;
  n.lida = true;
  render();
  const { error } = await supabaseClient.from('notificacoes').update({ lida: true }).eq('id', n.id);
  if (error) console.error('Erro ao marcar notificação como lida:', error);
}

async function marcarTodasNotificacoesLidas(){
  if (!state.usuario) return;
  const ehPaciente = state.usuario.tipo === 'paciente';
  state.notificacoes.forEach(n => { if ((ehPaciente ? n.pacienteId : n.profissionalId) === state.usuario.id) n.lida = true; });
  render();
  const { error } = await supabaseClient
    .from('notificacoes')
    .update({ lida: true })
    .eq(ehPaciente ? 'paciente_id' : 'profissional_id', state.usuario.id)
    .eq('lida', false);
  if (error) console.error('Erro ao marcar notificações como lidas:', error);
}

function painelNotificacoes(){
  const ehPaciente = state.usuario.tipo === 'paciente';
  const minhas = state.notificacoes.filter(n => (ehPaciente ? n.pacienteId === state.usuario.id : n.profissionalId === state.usuario.id)).slice(0, 30);
  // Mais recentes primeiro: o que ainda não foi lido fica no topo
  const ordenadas = minhas.slice().sort((a, b) => new Date(b.criadaEm) - new Date(a.criadaEm));
  const grupos = [
    { cat: 'Não lidas', itens: ordenadas.filter(n => !n.lida) },
    { cat: 'Anteriores', itens: ordenadas.filter(n => n.lida) }
  ].filter(g => g.itens.length);
  return `<div class="notif-panel card shadow-lg bg-[var(--surface)]"><div class="flex items-center justify-between px-3 py-2 border-b border-[var(--line)]"><span class="font-medium text-sm">Notificações</span><button onclick="marcarTodasNotificacoesLidas()" class="text-xs text-[var(--primary)] underline underline-offset-2">Marcar todas como lidas</button></div><div class="p-2">${grupos.length?grupos.map(g=>`<div class="mb-3"><div class="notification-category px-2 pt-1">${g.cat}</div>${g.itens.map(n=>{
    let acoes = '';
    if (n.consultaId && state.confirmacoes[n.consultaId]?.status==='pendente' && ehPaciente) {
      acoes = '<button onclick="event.stopPropagation();confirmarConsultaPaciente('+n.consultaId+')" class="btn-primary px-2.5 py-1.5 text-xs mt-2">Confirmar consulta</button>';
    }
    if (n.ofertaEncaixeId) {
      const oferta = (state.ofertasEncaixe || []).find(o => o.id === n.ofertaEncaixeId);
      const fim = { aceita: 'Aceito. Consulta antecipada.', recusada: 'Você manteve a consulta atual.', expirada: 'Oferta expirada. Consulta original mantida.', horario_indisponivel: 'Vaga preenchida. Consulta original mantida.', cancelada: 'Oferta cancelada. Consulta original mantida.' };
      if (oferta && oferta.status === 'pendente') {
        acoes = `<div class="flex gap-2 mt-2 flex-wrap"><button onclick="event.stopPropagation();aceitarEncaixe('${oferta.id}')" class="btn-primary px-2.5 py-1.5 text-xs">ACEITAR ENCAIXE</button><button onclick="event.stopPropagation();recusarEncaixe('${oferta.id}')" class="btn-ghost px-2.5 py-1.5 text-xs">MANTER CONSULTA ATUAL</button></div>`;
      } else if (oferta && fim[oferta.status] && n.tipo === 'oferta_encaixe') {
        acoes = `<div class="mt-2 text-xs text-[var(--ink-soft)] font-medium">${fim[oferta.status]}</div>`;
      }
    }
    return `<div class="p-3 rounded-lg text-sm ${n.lida?'bg-white':'bg-[var(--gold-bg)]'} cursor-pointer mb-1" onclick="marcarNotificacaoLida('${n.id}')"><div class="flex items-start gap-2"><span>${iconeTipoNotificacao(n.tipo)}</span><div class="flex-1"><p>${escaparHtml(n.mensagem)}</p><p class="text-xs text-[var(--ink-soft)] mt-1">${new Date(n.criadaEm).toLocaleString('pt-BR')}</p>${acoes}</div>${!n.lida?'<span class="w-2 h-2 rounded-full bg-[var(--brick)] mt-1 flex-shrink-0"></span>':''}</div></div>`;
  }).join('')}</div>`).join(''):'<div class="p-4 text-sm text-[var(--ink-soft)]">Sem notificações por enquanto.</div>'}</div></div>`;
}

function mudarMesCalendario(delta){
  calVisao.mes += delta;
  if (calVisao.mes < 0) { calVisao.mes = 11; calVisao.ano--; }
  if (calVisao.mes > 11) { calVisao.mes = 0; calVisao.ano++; }
  render();
}

function selecionarDia(iso){
  state.diaSelecionado = iso;
  calendarioAberto = false;
  render();
}

const PALETA_AGENDAS = ['#0369A1','#047857','#B45309','#BE185D','#6D28D9','#0E7490','#BE123C','#4D7C0F'];
function corAgenda(agendaId){
  return PALETA_AGENDAS[Math.abs(Number(agendaId)) % PALETA_AGENDAS.length];
}

function gerarGradeCalendario(filtroProfissionalId = null, filtroAgendaId = null, mostrarAgendas = false){
  const { ano, mes } = calVisao;
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes + 1, 0).getDate();
  const hoje = hojeISO();
  const nomesMes = new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const todasAgendasDoProf = mostrarAgendas && filtroProfissionalId ? agendasDoProfissional(filtroProfissionalId) : [];

  let celulas = '';
  for (let i = 0; i < primeiroDiaSemana; i++) celulas += `<div class="cal-cell"></div>`;
  for (let dia = 1; dia <= totalDias; dia++) {
    const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const horariosDoDiaCal = filtroProfissionalId ? state.horarios.filter(h => h.status !== 'removido' && h.data === iso && h.profissionalId === filtroProfissionalId) : [];
    // Para o paciente (mostrarAgendas=false) o ponto só aparece se o horário não estiver na janela de exclusividade de outra agenda.
    const temHorario = filtroProfissionalId
      ? horariosDoDiaCal.some(h => (filtroAgendaId ? h.agendaId === filtroAgendaId : true) && (mostrarAgendas || !dentroJanelaExclusividade(h)))
      : state.horarios.some(h => h.status !== 'removido' && h.data === iso);
    const bloqueado = filtroProfissionalId ? horarioBloqueado(filtroProfissionalId, iso, filtroAgendaId) : false;
    const agendasNoDia = mostrarAgendas ? [...new Set(horariosDoDiaCal.map(h => h.agendaId))] : [];
    const pontosAgendas = agendasNoDia.map(id => {
      const nome = todasAgendasDoProf.find(a => a.id === id)?.nome || '';
      return `<span class="cal-dot-agenda" title="${escaparHtml(nome)}" style="background:${corAgenda(id)}"></span>`;
    }).join('');
    const classes = ['cal-cell'];
    if (iso === state.diaSelecionado) classes.push('selected');
    if (iso === hoje) classes.push('today');
    if (bloqueado) classes.push('blocked');
    const marcador = bloqueado ? '<span class="cal-block">×</span>' : (mostrarAgendas ? (agendasNoDia.length ? `<span class="cal-dots-wrap">${pontosAgendas}</span>` : '') : (temHorario ? '<span class="cal-dot"></span>' : ''));
    celulas += `<div class="${classes.join(' ')}" onclick="selecionarDia('${iso}')" title="${mostrarAgendas && agendasNoDia.length ? escaparHtml(agendasNoDia.map(id=>todasAgendasDoProf.find(a=>a.id===id)?.nome||'').join(', ')) : ''}">${dia}${marcador}</div>`;
  }

  const diasSemana = ['D','S','T','Q','Q','S','S'].map(d => `<div class="w-9 text-center text-xs text-[var(--ink-soft)] font-medium">${d}</div>`).join('');
  const legendaAgendas = mostrarAgendas && todasAgendasDoProf.length
    ? `<div class="flex flex-wrap gap-x-3 gap-y-1 mt-2">${todasAgendasDoProf.map(a => `<span class="cal-legenda-agenda"><span class="cal-legenda-swatch" style="background:${corAgenda(a.id)}"></span>${escaparHtml(a.nome)}</span>`).join('')}</div>`
    : '';

  return `
    <div data-calendar-popover class="calendar-popover card p-4 absolute z-20 mt-2 shadow-lg bg-[var(--surface)]">
      <div class="flex items-center justify-between mb-3">
        <button onclick="mudarMesCalendario(-1)" class="btn-ghost px-2 py-1 text-sm">‹</button>
        <span class="font-display text-sm capitalize">${nomesMes} ${ano}</span>
        <button onclick="mudarMesCalendario(1)" class="btn-ghost px-2 py-1 text-sm">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-1">${diasSemana}</div>
      <div class="grid grid-cols-7 gap-1">${celulas}</div>
      ${mostrarAgendas
        ? `<p class="text-xs text-[var(--ink-soft)] mt-3"><span class="text-[var(--brick)]">× bloqueado</span> · cada cor é uma agenda</p>${legendaAgendas}`
        : `<p class="text-xs text-[var(--ink-soft)] mt-3">● com horários &nbsp; <span class="text-[var(--brick)]">× bloqueado</span></p>`}
    </div>`;
}

function copiarCodigoConvite(codigo){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codigo).then(() => mostrarToast('Código copiado!')).catch(() => mensagemErro(`Não foi possível copiar automaticamente. Código: ${codigo}`));
  } else {
    mensagemErro(`Copie manualmente o código: ${codigo}`);
  }
}
function regenerarCodigoConvite(){
  const clinica = getClinica(state.usuario.id);
  if (!clinica) return;
  clinica.codigoConvite = gerarCodigoConvite();
  mostrarToast(`Novo código gerado: ${clinica.codigoConvite}. O código antigo deixa de funcionar.`, 'info');
  render();
}

function profissionaisFiltrados(){
  const termo = buscaProfissionalTexto.trim().toLowerCase();
  return state.profissionais.filter(p => {
    if (p.clinicaId !== state.clinicaSelecionadaId) return false;

    const textoBusca = `${p.nome} ${p.profissao} ${p.especialidade || ''}`.toLowerCase();
    const passaTexto = !termo || textoBusca.includes(termo);

    const especialidadeProf = p.especialidade || p.profissao;
    const passaEspecialidade = filtroEspecialidade === 'todas' || especialidadeProf === filtroEspecialidade;

    const modalidadeProf = p.modalidadeAtendimento || 'presencial';
    const passaModalidade = filtroModalidadeProf === 'todas'
      || modalidadeProf === filtroModalidadeProf
      || modalidadeProf === 'ambos';

    return passaTexto && passaEspecialidade && passaModalidade;
  });
}

let encDraft = null;
const ENC_DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  const c = state.consultas.find(x => x.id === consultaId), h = c && getHorario(c.horarioId);

  encDraft = { consultaId, ativa: !!p?.ativa, dias: p ? JSON.parse(JSON.stringify(p.diasDisponiveis)) : [], dataLimite: p?.dataLimite || h.data, horaLimite: p?.horaLimite || '' };
  encDesenhar();
}
function encDesenhar(){

      + `<button type="button" onclick="encAddFaixa(${i})" class="btn-ghost px-2 py-1 text-xs mt-2">+ Adicionar faixa</button>` : '';
    return `<div class="border border-[var(--line)] rounded-lg p-2.5"><label class="flex items-center gap-2 font-medium cursor-pointer"><input type="checkbox" ${sel ? 'checked' : ''} onchange="encToggleDia(${i})"> ${nome}</label>${faixas}</div>`;
  }).join('');
  const modal = document.createElement('div');
  modal.id = 'modal-encaixe'; modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="card bg-white p-5 max-w-md w-full max-h-[90vh] overflow-y-auto" id="enc-scroll">
      <h3 class="font-display text-lg mb-1">⚡ Antecipar vaga</h3>

        <div><label class="block font-medium mb-1">Hora limite <span class="font-normal text-[var(--ink-soft)]">(opcional)</span></label><input type="time" value="${d.horaLimite}" onchange="encDraft.horaLimite=this.value" class="w-full border rounded p-1.5"></div>

function encFecharModal(){ encDraft = null; document.getElementById('modal-encaixe')?.remove(); }
function encToggleDia(i){
  const d = encDraft, k = d.dias.findIndex(x => x.diaSemana === i);
  if (k >= 0) d.dias.splice(k, 1); else d.dias.push({ diaSemana: i, faixas: [{ inicio: '08:00', fim: '12:00' }] });
  d.dias.sort((a, b) => a.diaSemana - b.diaSemana); encDesenhar();
}
function encAddFaixa(i){ encDraft.dias.find(x => x.diaSemana === i).faixas.push({ inicio: '14:00', fim: '18:00' }); encDesenhar(); }
function encRemoverFaixa(i, j){
  const d = encDraft, x = d.dias.find(y => y.diaSemana === i);
  x.faixas.splice(j, 1); if (!x.faixas.length) d.dias.splice(d.dias.indexOf(x), 1);
  encDesenhar();
}
function encEditar(i, j, campo, v){ encDraft.dias.find(x => x.diaSemana === i).faixas[j][campo] = v; }

async function salvarConfiguracaoEncaixe(consultaId){
  const d = encDraft, c = state.consultas.find(x => x.id === consultaId), h = c && getHorario(c.horarioId);
  if (!d || d.consultaId !== consultaId || !c || !h) return;
  if (c.status !== 'confirmada') return mensagemErro('Só é possível antecipar uma consulta confirmada.');
  if (!c.supabaseId) return mensagemErro('Não foi possível identificar a consulta no Supabase.');
  const dias = d.dias.filter(x => x.faixas.length).map(x => ({ diaSemana: x.diaSemana, faixas: x.faixas.map(f => ({ inicio: f.inicio, fim: f.fim })).sort((a, b) => a.inicio.localeCompare(b.inicio)) }));
  if (!dias.length) return mensagemErro('Escolha ao menos um dia e uma faixa de horário.');
  for (const x of dias) for (let k = 0; k < x.faixas.length; k++) {
    const f = x.faixas[k];
    if (!f.inicio || !f.fim || f.inicio >= f.fim) return mensagemErro(`${ENC_DIAS[x.diaSemana]}: o horário inicial deve ser menor que o final.`);
    if (k && f.inicio < x.faixas[k - 1].fim) return mensagemErro(`${ENC_DIAS[x.diaSemana]}: as faixas não podem se sobrepor.`);
  }
  if (!d.dataLimite) return mensagemErro('Informe a data limite.');
  if (d.dataLimite > h.data) return mensagemErro('A data limite não pode ser depois da consulta atual.');
  if (encLimite({ dataLimite: d.dataLimite, horaLimite: d.horaLimite }).getTime() <= Date.now()) return mensagemErro('A data/hora limite precisa estar no futuro.');

  try {
    const { error } = await supabaseClient.rpc('salvar_preferencia_encaixe_vezzo', {
      p_consulta_id: c.supabaseId,
      p_dias: dias,
      p_data_limite: d.dataLimite,
      p_hora_limite: d.horaLimite || null
    });
    if (error) throw error;
    encFecharModal();
    await carregarEncaixeSupabase();
    await carregarNotificacoesSupabase();
    mostrarToast('Antecipação ativada. Avisaremos se surgir uma vaga mais cedo.', 'success');
    render();
  } catch (erro) {
    console.error('Erro ao salvar antecipação:', erro);
    mensagemErro(erro?.message || 'Não foi possível salvar a antecipação.');
  }
}
async function desativarEncaixe(consultaId){
  const c = state.consultas.find(x => x.id === consultaId);
  if (!c?.supabaseId) return mensagemErro('Não foi possível identificar a consulta no Supabase.');
  try {
    const { error } = await supabaseClient.rpc('desativar_preferencia_encaixe_vezzo', { p_consulta_id: c.supabaseId });
    if (error) throw error;
    encFecharModal();
    await carregarEncaixeSupabase();
    mostrarToast('Antecipação desativada.');
    render();
  } catch (erro) {
    console.error('Erro ao desativar antecipação:', erro);
    mensagemErro('Não foi possível desativar a antecipação.');
  }
}
function encStatusHtml(c){
  if (c.status !== 'confirmada') return '';
  const p = encPref(c.id), cls = 'text-xs mt-1 font-medium text-[var(--gold)]';
  if (encPendente(c.id)) return `<div class="${cls}">⚡ Surgiu uma vaga mais cedo! Responda na área de notificações.</div>`;

  if (c.antecipadaPorEncaixe) return `<div class="${cls}">⚡ Consulta antecipada pelo encaixe por disponibilidade.</div>`;
  return '';
}

  if (!hs) { adicionarHorarioPorData(2, sexta, '15:00', 'presencial', ag.id); hs = state.horarios[state.horarios.length - 1]; }
  if (hs.status === 'livre') agendar(maria.id, hs.id, { silencioso: true });

function testeEncaixe(){
  const bak = JSON.stringify(state), res = [];
  const ok = (nome, cond) => res.push({ teste: nome, resultado: cond ? 'OK' : 'FALHOU' });
  try {
    const x = demoEncaixe(), c = x.c, geral = agendaPadraoId(2);
    state.usuario = { tipo: 'paciente', id: x.maria.id, nome: x.maria.nome };
    const pref = encPref(c.id);
    const pend = () => state.ofertasEncaixe.filter(o => o.consultaId === c.id && o.status === 'pendente');
    const vaga = (data, hora, ag = x.ag.id) => { const r = adicionarHorarioPorData(2, data, hora, 'presencial', ag); if (!r.ok) throw new Error('vaga não criada ' + data + hora); const h = state.horarios[state.horarios.length - 1]; tentarEncaixe(h.id); return h; };
    vaga(x.ter, '10:00');                    ok('T1 terça 10:00 gera oferta', pend().length === 1);
    vaga(x.ter, '11:00');                    ok('T2 segunda vaga não cria 2ª oferta pendente', pend().length === 1 && state.ofertasEncaixe.length === 1);
    recusarEncaixe(pend()[0].id);            ok('T3 recusar mantém consulta e preferência ativa', c.horarioId === x.hs.id && pref.ativa && state.ofertasEncaixe[0].status === 'recusada');
    vaga(x.ter, '15:00');                    ok('T4 terça 15:00 (fora da faixa) não gera', pend().length === 0);
    vaga(x.qua, '10:00');                    ok('T5 quarta 10:00 (fora da faixa) não gera', pend().length === 0);
    vaga(x.sexta, '16:00');                  ok('T6 sexta 16:00 (depois da consulta) não gera', pend().length === 0);
    vaga(x.ter, '09:00', geral);             ok('T7 outra agenda/convênio não gera', pend().length === 0);
    const q15 = vaga(x.qua, '15:00');        ok('T8 quarta 15:00 gera nova oferta após recusa', pend().length === 1);
    const o2 = pend()[0]; agendar(1, q15.id, { silencioso: true }); aceitarEncaixe(o2.id);
    ok('T9 vaga ocupada antes de aceitar: oferta indisponível e consulta intacta', o2.status === 'horario_indisponivel' && c.horarioId === x.hs.id && c.status === 'confirmada');
    pref.diasDisponiveis.push({ diaSemana: 5, faixas: [{ inicio: '08:00', fim: '18:00' }] }); pref.dataLimite = x.sexta;
    vaga(x.sexta, '16:00');                  ok('T10 sexta 16:00 não gera (estritamente anterior)', pend().length === 0);
    vaga(x.sexta, '14:00');                  ok('T11 sexta 14:00 gera (anterior à consulta)', pend().length === 1);
    recusarEncaixe(pend()[0].id); pref.diasDisponiveis.pop(); pref.dataLimite = x.qui;
    vaga(x.ter, '08:30'); const o3 = pend()[0]; o3.expiraEm = new Date(Date.now() - 1000).toISOString(); aceitarEncaixe(o3.id);
    ok('T12 oferta expirada: consulta original mantida', o3.status === 'expirada' && c.horarioId === x.hs.id && c.status === 'confirmada');
    pref.dataLimite = adicionarDiasISO(x.ter, -1); vaga(x.ter, '08:15');
    ok('T13 vaga depois da data limite não gera', pend().length === 0);
    pref.dataLimite = adicionarDiasISO(hojeISO(), -1); encProcessar(); ok('T14 data limite vencida desativa a preferência', pref.ativa === false);
    pref.ativa = true; pref.dataLimite = x.qui; delete pref.encerradaMotivo;
    agendar(2, x.hs.id, { silencioso: true });   // Pedro entra na fila do horário antigo
    const nova = vaga(x.ter, '09:15'); aceitarEncaixe(pend()[0].id);
    ok('T15 aceitar move a consulta para o novo horário', c.horarioId === nova.id && nova.pacienteId === x.maria.id && nova.status === 'ocupado');
    ok('T16 horário antigo liberado e fila promovida', getHorario(x.hs.id).pacienteId === 2 && getHorario(x.hs.id).status === 'ocupado');
    ok('T17 histórico e preferência desativada', state.reagendamentos[c.id]?.tipoReagendamento === 'antecipacao_encaixe' && pref.ativa === false);
    ok('T18 profissional notificado', state.notificacoes.some(n => n.profissionalId === 2 && /aceitou uma antecipação/.test(n.mensagem)));
    ok('T19 persistência (JSON)', !!JSON.parse(JSON.stringify(state)).ofertasEncaixe.length);
  } catch (e) { res.push({ teste: 'ERRO', resultado: String(e.stack || e) }); }
  finally { state = JSON.parse(bak); salvarDados(); render(); }
  console.table(res);
  return res;
}

async function salvarConfiguracoesAgenda(){
  const limitar = (v, min, max, padrao) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n))) : padrao;
  };

  const cfg = {
    lembrete24h: !!document.getElementById('cfg-24h')?.checked,
    lembrete2h: !!document.getElementById('cfg-2h')?.checked,
    confirmacaoHoras: limitar(document.getElementById('cfg-conf')?.value, 1, 48, 24),
    cancelamentoHoras: limitar(document.getElementById('cfg-canc')?.value, 0, 72, 4),
    janelaExclusividadeHoras: limitar(document.getElementById('cfg-janela')?.value, 0, 720, 48),
    aceiteFilaMin: limitar(document.getElementById('cfg-aceite')?.value, 0, 720, 120)
  };

  try {
    const { error } = await supabaseClient.rpc('salvar_configuracoes_vezzo', {
      p_cancelamento_horas: cfg.cancelamentoHoras,
      p_confirmacao_horas: cfg.confirmacaoHoras,
      p_janela_exclusividade_horas: cfg.janelaExclusividadeHoras,
      p_aceite_fila_min: cfg.aceiteFilaMin,
      p_lembrete_24h: cfg.lembrete24h,
      p_lembrete_2h: cfg.lembrete2h
    });
    if (error) throw error;

    Object.assign(state.configuracoes, cfg);   // só atualiza a tela depois do banco confirmar
    mostrarToast('Regras da agenda atualizadas.');
    render();
  } catch (erro) {
    console.error('Erro ao salvar regras:', erro);
    mensagemErro('Não foi possível salvar as regras. Tente novamente.');
  }
}

function avaliacoesDoProfissional(profId){
  const lista = (state.avaliacoesPorProfissional || {})[profId] || [];
  return lista.map(a => {
    const c = state.consultas.find(x => x.supabaseId === a.consulta_id);
    return { nota: a.nota, comentario: '', criadoEm: a.criada_em, consulta: c || null, paciente: c ? getPaciente(c.pacienteId) : null };
  }).filter(a => Number(a.nota) >= 1);
}

// Busca as avaliações de um profissional (média e lista) no Supabase
async function carregarAvaliacoesProfissional(profId){
  if (!profId) return;
  try {
    const { data, error } = await supabaseClient.rpc('listar_avaliacoes_profissional_vezzo', { p_profissional_id: profId });
    if (error) throw error;
    if (!state.avaliacoesPorProfissional) state.avaliacoesPorProfissional = {};
    // a lista vem da mais recente para a mais antiga; a tela espera a ordem inversa
    state.avaliacoesPorProfissional[profId] = (data || []).slice().reverse();
    (data || []).forEach(a => {
      const c = state.consultas.find(x => x.supabaseId === a.consulta_id);
      if (c) state.avaliacoes[c.id] = { nota: a.nota, criadoEm: a.criada_em };
    });
    salvarDados();
  } catch (erro) {
    console.error('Erro ao carregar avaliações:', erro);
  }
}

function pintarEstrelasAvaliacao(nota){
  document.querySelectorAll('#avaliacao-estrelas [data-nota]').forEach(b => {
    const n = Number(b.dataset.nota);
    b.textContent = n <= nota ? '★' : '☆';

  });

  if (botao) botao.disabled = !notaAvaliacaoSelecionada;

function selecionarNotaAvaliacao(nota){
  notaAvaliacaoSelecionada = nota;
  pintarEstrelasAvaliacao(nota);
}

function fecharAvaliacao(){
  document.getElementById('modal-avaliacao')?.remove();
}

async function enviarAvaliacao(consultaId){
  const c = state.consultas.find(x => x.id === consultaId);
  const nota = notaAvaliacaoSelecionada;
  if (!c || !nota) return;
  const botao = document.getElementById('btn-enviar-avaliacao');
  if (botao) { botao.disabled = true; botao.textContent = 'Enviando...'; }
  try {
    const { error } = await supabaseClient.rpc('avaliar_consulta_vezzo', { p_consulta_id: c.supabaseId, p_nota: nota });
    if (error) throw error;
    state.avaliacoes[c.id] = { nota, criadoEm: new Date().toISOString() };
    salvarDados();
    fecharAvaliacao();
    mostrarToast('Avaliação enviada. Obrigado!');
    render();
  } catch (erro) {
    console.error('Erro ao avaliar consulta:', erro);
    if (botao) { botao.disabled = false; botao.textContent = 'Enviar avaliação'; }
    mensagemErro(erro?.message || 'Não foi possível enviar a avaliação.');
  }
}

async function salvarNovoHorario() {
  const data = document.getElementById('novo-hor-data')?.value;
  const hora = document.getElementById('novo-hor-hora')?.value;
  const modalidade = document.getElementById('novo-hor-modalidade')?.value || 'presencial';
  const agendaId = Number(document.getElementById('novo-hor-agenda')?.value || agendaSelecionadaId);

  if (!data || !hora) {
    return mensagemErro('Informe a data e o horário.');
  }

  if (data < hojeISO()) {
    return mensagemErro('A data precisa ser hoje ou futura.');
  }

  if (!agendaId) {
    return mensagemErro('Selecione uma agenda.');
  }

  const agenda = state.agendas.find(a => a.id === agendaId);

  if (!agenda?.supabaseId) {
    return mensagemErro('Agenda não encontrada no Supabase. Atualize a página e tente novamente.');
  }

  const resultado = adicionarHorarioPorData(
    state.usuario.id,
    data,
    hora,
    modalidade,
    agendaId
  );

  if (!resultado.ok) {
    return mensagemErro(
      resultado.motivo === 'bloqueado'
        ? 'Essa data está bloqueada.'
        : 'Já existe um horário nesse dia e hora nesta agenda.'
    );
  }

  const horario = state.horarios[state.horarios.length - 1];

  try {
    const { data: horarioSalvo, error } = await supabaseClient
      .from('horarios')
      .insert({
        profissional_id: state.usuario.id,
        agenda_id: agenda.supabaseId,
        data,
        hora,
        modalidade,
        status: 'livre'
      })
      .select()
      .single();

    if (error) throw error;

    horario.supabaseId = horarioSalvo.id;

    salvarDados();

    novoHorarioAberto = false;
    state.diaSelecionado = data;
    agendaSelecionadaId = agendaId;

    mostrarToast('Novo horário criado.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao salvar horário:', erro);

    state.horarios = state.horarios.filter(h => h.id !== horario.id);

    mensagemErro('Não foi possível salvar o horário no Supabase.');
    render();
  }
}

function badgeConfirmacaoPendente(h){
  const c = state.consultas.find(x => x.horarioId===h.id && x.status==='confirmada');
  return c && state.confirmacoes[c.id]?.status === 'pendente' ? '<span class="badge badge-lotado">Aguardando confirmação</span>' : '';
}
function badgeStatus(status){
  const mapa = {
    livre: ['Livre', 'badge-livre'],
    ocupado: ['Ocupado', 'badge-ocupado'],
    lotado: ['Lotado (com fila)', 'badge-lotado'],
    concluido: ['Encerrado', 'badge-concluido'],
    removido: ['Removido', 'badge-concluido'],
  };
  const [label, classe] = mapa[status] || [status, ''];
  return `<span class="badge ${classe}">${label}</span>`;
}


async function excluirHorarioSupabase(id) {
  const horario = state.horarios.find(h => h.id === id);

  if (!horario) return;

  if (horario.status !== 'livre' || horario.pacienteId || horario.fila.length) {
    return mensagemErro('Não é possível excluir um horário ocupado ou com pacientes na fila.');
  }

  if (!horario.supabaseId) {
    return mensagemErro('Este horário ainda não está vinculado ao Supabase.');
  }

  if (!(await confirmarAcao({ titulo: 'Excluir horário', mensagem: 'Este horário livre será removido da agenda.', textoConfirmar: 'Excluir', perigo: true }))) return;

  try {
    const { error } = await supabaseClient
      .from('horarios')
      .delete()
      .eq('id', horario.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (error) throw error;

    state.horarios = state.horarios.filter(h => h.id !== id);

    salvarDados();
    mostrarToast('Horário excluído com sucesso.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao excluir horário:', erro);
    mensagemErro('Não foi possível excluir o horário.');
  }
}

  document.getElementById('modal-editar-horario')?.remove();

async function salvarEdicaoHorario(id) {
  const horario = state.horarios.find(h => h.id === id);
  if (!horario) return fecharEdicaoHorario();

  const novaData = document.getElementById('edit-hor-data')?.value || '';
  const novaHora = (document.getElementById('edit-hor-hora')?.value || '').slice(0, 5);
  const modalidade = document.getElementById('edit-hor-modalidade')?.value || '';

  if (!/^\d{4}-\d{2}-\d{2}$/.test(novaData)) return mensagemErro('Informe uma data válida.');
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(novaHora)) return mensagemErro('Informe um horário válido.');
  if (!['presencial', 'online'].includes(modalidade)) return mensagemErro('Escolha a modalidade.');

  if (new Date(`${novaData}T${novaHora}:00`).getTime() <= Date.now()) {
    return mensagemErro('Escolha uma data e hora no futuro.');
  }

  const conflito = state.horarios.find(h =>
    h.id !== id &&
    h.profissionalId === horario.profissionalId &&
    h.agendaId === horario.agendaId &&
    h.data === novaData &&
    h.hora === novaHora &&
    h.status !== 'removido'
  );
  if (conflito) return mensagemErro('Já existe um horário nessa data e hora para esta agenda.');

  if (horarioBloqueado(horario.profissionalId, novaData, horario.agendaId)) {
    return mensagemErro('Essa data possui um bloqueio nesta agenda.');
  }

  const botao = document.getElementById('btn-salvar-edicao-horario');
  if (botao) { botao.disabled = true; botao.textContent = 'Salvando...'; }

  try {
    const { error } = await supabaseClient
      .from('horarios')
      .update({ data: novaData, hora: novaHora, modalidade })
      .eq('id', horario.supabaseId)
      .eq('profissional_id', state.usuario.id);

    if (error) throw error;

    horario.data = novaData;
    horario.hora = novaHora;
    horario.modalidade = modalidade;

    fecharEdicaoHorario();
    salvarDados();
    mostrarToast('Horário atualizado com sucesso.', 'success');
    render();

  } catch (erro) {
    console.error('Erro ao editar horário:', erro);
    if (botao) { botao.disabled = false; botao.textContent = 'Salvar alterações'; }
    mensagemErro(erro?.code === '23505'
      ? 'Já existe um horário nessa data e hora para esta agenda.'
      : (erro?.message || 'Não foi possível atualizar o horário.'));
  }
}



function cartaoHorario(h, visao = 'paciente'){
  const isProf = visao === 'profissional';
  
  // Lógica Paciente
  if (!isProf) {
    const pacienteAtual = state.usuario.id;
    // Se este horário está livre mas o mesmo dia/hora já foi ocupado em outra agenda (convênio),
    // a vaga real (com fila de espera) é a que já tem paciente.
    const alvoView = (h.status === 'livre' && espelhoReservado(h)) ? espelhoReservado(h) : h;
    const jaAgendado = alvoView.pacienteId === pacienteAtual;
    const naFila = alvoView.fila.includes(pacienteAtual);
    const posicaoFila = alvoView.fila.indexOf(pacienteAtual) + 1;

    let acao = '';
    if (h.status === 'concluido') {
      acao = `<span class="text-xs text-[var(--ink-soft)]">Indisponível</span>`;
    } else if (jaAgendado) {
      acao = `<span class="text-xs font-medium text-[var(--primary-dark)]">Sua consulta ✓</span>`;
    } else if (naFila) {
      acao = `<span class="text-xs font-medium text-[var(--gold)]">Na fila (pos. ${posicaoFila})</span>`;
    } else if (alvoView.status === 'livre') {
      acao = `<button onclick="agendarComFeedback('${pacienteAtual}', ${h.id}, this)" class="btn-primary px-3 py-1.5 text-xs font-medium">Agendar</button>`;
    } else {
      acao = `<button onclick="agendarComFeedback('${pacienteAtual}', ${h.id}, this)" class="btn-ghost px-3 py-1.5 text-xs font-medium">Entrar na fila (${alvoView.fila.length})</button>`;
    }

    return `
      <div class="card p-4 flex items-center justify-between gap-3 bg-white hover:border-[var(--primary)] transition">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display text-lg tabular text-[var(--primary-dark)]">${h.hora}</span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-[var(--bg)]">${h.modalidade === 'online' ? '💻 Online' : '📍 Presencial'}</span>
          </div>
          <div class="mt-2">${badgeStatus(alvoView.status)}</div>
        </div>
        <div>${acao}</div>
      </div>`;
  }
  
  // Lógica Profissional
  const paciente = h.pacienteId ? getPaciente(h.pacienteId) : null;
  const espelho = !h.pacienteId ? espelhoReservado(h) : null;
  const nomeAgendaOrigem = (agendaId) => agendaId === h.agendaId ? '' : ` <span class="text-[10px] text-[var(--ink-soft)]">(${escaparHtml(state.agendas.find(a=>a.id===agendaId)?.nome||'outro convênio')})</span>`;
  const filaHtml = h.fila.length ? `
    <div class="flex items-center gap-1.5 mt-2 flex-wrap">
      ${h.fila.map((pid, i) => `<span class="queue-chip" title="${getPaciente(pid)?.nome}">${i+1}</span>`).join('')}
    </div>
    <div class="text-xs text-[var(--ink-soft)] mt-1 space-y-0.5">
      ${h.fila.map((pid, i) => `<div>${i+1}. ${escaparHtml(getPaciente(pid)?.nome||'Paciente')}${nomeAgendaOrigem((h.filaOrigem||[])[i])}</div>`).join('')}
    </div>` : '';

const acoes =
  h.status === 'concluido'
    ? `<span class="text-xs text-[var(--ink-soft)] border px-2 py-1 rounded">Encerrado</span>`
    : h.status === 'livre'
      ? (
          espelho
            ? `<span class="text-xs text-[var(--ink-soft)]">Reservado em outra agenda${espelho.fila.length ? ` · ${espelho.fila.length} na fila` : ''}</span>`
            : dentroJanelaExclusividade(h)
              ? `<span class="text-xs text-[var(--ink-soft)]">🔒 Exclusivo até ${formatarLimiteExclusividade(h)}</span>`
              : `<div class="flex flex-col items-end gap-2">
                  <span class="text-xs text-[var(--ink-soft)]">Sem paciente</span>
                  <button onclick="editarHorarioSupabase(${h.id})" class="btn-primary px-3 py-1.5 text-xs font-medium">Editar horário</button>
                  <button onclick="excluirHorarioSupabase(${h.id})" class="btn-brick px-3 py-1.5 text-xs font-medium">Excluir horário</button>
                </div>`
        )
      : `<div class="flex flex-col gap-2">
          <button onclick="marcarConsultaDada(${h.id})" class="btn-primary px-3 py-1.5 text-xs font-medium w-full">Compareceu</button>
          <button onclick="registrarFalta(${h.id})" class="btn-brick px-3 py-1.5 text-xs font-medium w-full">Faltou</button>

        </div>`;

  return `
    <div class="card p-4 bg-white cartao-horario flex items-start justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display text-lg tabular text-[var(--primary-dark)]">${h.hora}</span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-[var(--bg)]">${h.modalidade === 'online' ? '💻 Online' : '📍 Presencial'}</span>
            ${badgeStatus(espelho ? espelho.status : h.status)} ${badgeConfirmacaoPendente(h)}
          </div>
          <p class="text-sm mt-2">${paciente ? `Paciente: <strong class="text-[var(--ink)]">${paciente.nome}</strong>` : (espelho ? `<span class="text-[var(--ink-soft)]">Ocupado na agenda ${escaparHtml(state.agendas.find(a=>a.id===espelho.agendaId)?.nome||'')} por ${escaparHtml(getPaciente(espelho.pacienteId)?.nome||'outro paciente')}</span>` : '<span class="text-[var(--ink-soft)]">Livre</span>')}</p>

function fazerCadastro(){
  const nome = document.getElementById('cad-nome').value.trim();

  const senha = document.getElementById('cad-senha').value;
  if (!nome || !email || !senha) { mensagemErro('Preencha os campos obrigatórios.'); return; }

  if (tipoContaSelecionado === 'paciente') {
    if (state.pacientes.some(p => p.email === email)) { mensagemErro('E-mail já cadastrado.'); return; }
    const novo = { id: state.proximoIdPaciente++, nome, email, senha };
    state.pacientes.push(novo);

    abaPaciente = 'profissionais';

    const profissao = document.getElementById('cad-profissao').value.trim();

    const especialidade = document.getElementById('cad-especialidade').value.trim();

    const novo = {
      id: state.proximoIdProfissional++, nome, email, senha, profissao,
      especialidade: especialidade || profissao,
      descricao: descricao || 'Profissional cadastrado no Vezzo.',
      avatar: '🧑‍⚕️',
      clinicaId: null, clinicaNome,
      modalidadeAtendimento: modalidadeAtendimento || 'presencial',
      localAtendimento: modalidadeAtendimento !== 'online' ? localAtendimento : '',
    };
    state.profissionais.push(novo);
    state.usuario = { tipo: 'profissional', id: novo.id, nome: novo.nome, profissao: novo.profissao };
    state.agendas.push({ id: state.proximoIdAgenda++, profissionalId: novo.id, nome: 'Geral', criadaEm: new Date().toISOString(), prioridade: 1 });
    agendaSelecionadaId = agendasDoProfissional(novo.id)[0]?.id ?? null;
    mostrarToast('Cadastro concluído! Você já aparece na busca dos pacientes.');
  }
  render();
}

function clinicaBuscar(v){
  const box = document.getElementById('cad-clinica-resultados'); if (!box) return;
  const t = normTxt(v);
  if (!t) { box.innerHTML = ''; return; }
  const achadas = state.clinicas.filter(c => normTxt(c.nome).includes(t)).slice(0, 5);
  const exata = state.clinicas.some(c => normTxt(c.nome) === t);
  const estilo = 'class="w-full text-left text-sm px-3 py-2 rounded-lg border border-[var(--line)] bg-white hover:border-[var(--primary)]"';
  box.innerHTML = achadas.map(c => `<button type="button" ${estilo} onclick="clinicaEscolher(${c.id})">🏥 ${escaparHtml(c.nome)}</button>`).join('')
    + (exata ? '' : `<button type="button" ${estilo} onclick="clinicaAdicionar()">➕ Adicionar "${escaparHtml(v.trim())}"</button>`);
}
function clinicaAtualizarUI(){
  const chip = document.getElementById('cad-clinica-escolhida'), inp = document.getElementById('cad-clinica-busca'), box = document.getElementById('cad-clinica-resultados');
  if (chip) chip.innerHTML = clinicaChipHtml();
  if (inp) { inp.value = ''; inp.style.display = cadClinica ? 'none' : ''; }
  if (box) box.innerHTML = '';
}
function clinicaEscolher(id){ cadClinica = { id }; clinicaAtualizarUI(); }
function clinicaAdicionar(){
  const nome = (document.getElementById('cad-clinica-busca')?.value || '').trim();
  if (!nome) return;
  const existente = state.clinicas.find(c => normTxt(c.nome) === normTxt(nome));
  cadClinica = existente ? { id: existente.id } : { novo: nome };
  clinicaAtualizarUI();
}

async function fazerCadastro() {
  const d = acessoDraft;
  const tipo = d.tipo === 'profissional' ? 'profissional' : 'paciente';
  const nome = (d.nome || '').trim();
  const email = (d.email || '').trim();
  const senha = d.senha || '';
  const telefone = normalizarTelefoneBR(d.telefone || '');

  const dadosCadastro = {
    nome,
    tipo,
    telefone: telefone || null,
    aceite_termos_em: new Date().toISOString()
  };

  if (tipo === 'paciente') {
    dadosCadastro.whatsapp_opt_in = false; // WhatsApp desligado por enquanto
  } else {
    const profissao = (d.profissao || '').trim();
    const modalidade = d.modalidade || 'presencial';
    dadosCadastro.profissao = profissao;
    dadosCadastro.especialidade = (d.especialidade || '').trim() || profissao;
    dadosCadastro.descricao = (d.descricao || '').trim() || 'Profissional cadastrado no Vezzo.';

    dadosCadastro.local_atendimento = modalidade !== 'online' ? (d.local || '').trim() : '';
    dadosCadastro.clinica_nome = (d.clinica || '').trim();
  }

  const botao = document.getElementById('btn-concluir-cadastro');
  if (botao) { botao.disabled = true; botao.textContent = 'Criando conta...'; }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password: senha,
      options: {
  emailRedirectTo: 'https://brennoo05.github.io/Vezzo/',
  data: dadosCadastro
}
    });

    if (error) {
      const jaExiste = /already registered|already exists/i.test(error.message || '');
      return mostrarErrosAcesso(jaExiste
        ? { email: 'Este e-mail já tem uma conta. Faça login ou recupere a senha.' }
        : { geral: 'Não foi possível criar a conta: ' + error.message });
    }

    if (data.user) {
      cadClinica = null;

      irAcesso('cadastro-ok', { manterDraft: true });

  } catch (erro) {
    console.error('Erro no cadastro:', erro);

// ---------- P05–P09: agendamento em 3 passos ----------
let agendamento = null; // { passo, modalidade, agendaId, data, semanaInicio, horarioId }

abrirAgendaProfissional = async function(){
  const profId = state.profissionalSelecionadoId;
  const p = getProfissional(profId);
  state.agendaAberta = true;
  agendamento = { passo: 1, modalidade: null, agendaId: null, data: null, semanaInicio: null, horarioId: null };
  try { await carregarAgendaPacienteSupabase(profId); } catch (e) { state.agendaAberta = false; render(); return; }
  const modalidade = p?.modalidadeAtendimento || 'presencial';
  if (modalidade !== 'ambos') agendamento.modalidade = modalidade;
  const ags = agendasDoProfissional(profId);
  if (ags.length === 1) agendamento.agendaId = ags[0].id;
  render();
  window.scrollTo(0, 0);
};

function slotsDoAgendamento(data){
  const prof = getProfissional(state.profissionalSelecionadoId);
  if (!prof || !agendamento) return [];
  return state.horarios
    .filter(h => h.status !== 'removido' && h.profissionalId === prof.id && h.agendaId === agendamento.agendaId && h.data === data
      && (!agendamento.modalidade || h.modalidade === agendamento.modalidade)
      && !consultaJaPassou(h) && !horarioBloqueado(h.profissionalId, h.data, h.agendaId))
    .map(h => {
      const alvo = (h.status === 'livre' && espelhoReservado(h)) ? espelhoReservado(h) : h;
      let estado = 'livre';
      if (alvo.pacienteId === state.usuario.id) estado = 'minha';
      else if ((alvo.fila || []).includes(state.usuario.id)) estado = 'na-fila';
      else if (alvo.status === 'concluido') estado = 'encerrado';
      else if (alvo !== h || alvo.status !== 'livre') estado = 'ocupado';
      else if (dentroJanelaExclusividade(h)) estado = 'reservado';
      return { h, alvo, estado };
    })
    .filter(x => !['encerrado', 'reservado'].includes(x.estado))
    .sort((a, b) => a.h.hora.localeCompare(b.h.hora));
}

function primeiraDataComVaga(){
  const hoje = hojeISO();
  for (let i = 0; i < 120; i++) {
    const d = adicionarDiasISO(hoje, i);
    if (slotsDoAgendamento(d).some(x => x.estado === 'livre')) return d;
  }
  return hoje;
}

function agendamentoIr(passo){
  if (passo === 2) {
    if (!agendamento.modalidade) return mensagemErro('Escolha a modalidade.');
    if (!agendamento.agendaId) return mensagemErro('Escolha o tipo de atendimento.');
    if (!agendamento.data) {
      agendamento.data = primeiraDataComVaga();
      agendamento.semanaInicio = agendamento.data;
    }
  }
  if (passo === 3 && !agendamento.horarioId) return mensagemErro('Escolha um horário.');
  agendamento.passo = passo;
  render();
  window.scrollTo(0, 0);
}
function agendamentoSet(campo, valor){
  agendamento[campo] = valor;
  if (campo === 'modalidade' || campo === 'agendaId') { agendamento.data = null; agendamento.horarioId = null; }
  render();
}
function agendamentoDia(data){
  agendamento.data = data;
  agendamento.horarioId = null;
  render();
}
function agendamentoSemana(delta){
  const hoje = hojeISO();
  let inicio = adicionarDiasISO(agendamento.semanaInicio || hoje, delta * 7);
  if (inicio < hoje) inicio = hoje;
  agendamento.semanaInicio = inicio;
  render();
}
function agendamentoHorario(id){
  agendamento.horarioId = id;
  render();
}

function stepperAgendamento(passo){
  const item = (n, texto) => `<li class="vz-step${passo === n ? ' ativo' : passo > n ? ' feito' : ''}" ${passo === n ? 'aria-current="step"' : ''}><span class="vz-step-n">${passo > n ? '✓' : n}</span>${texto}</li>`;
  return `<ol class="vz-stepper" aria-label="Etapas do agendamento">${item(1, 'Atendimento')}<li class="vz-step-sep" aria-hidden="true"></li>${item(2, 'Data e horário')}<li class="vz-step-sep" aria-hidden="true"></li>${item(3, 'Confirmar')}</ol>`;
}

function nomeAgendaAgendamento(){
  return state.agendas.find(a => a.id === agendamento?.agendaId)?.nome || '';
}
function textoModalidade(m){ return m === 'online' ? 'Online' : 'Presencial'; }

async function confirmarAgendamento(botao){
  const h = getHorario(agendamento.horarioId);
  if (!h) return mensagemErro('Horário não encontrado.');
  const { data, hora } = h;
  await agendarComFeedback(state.usuario.id, h.id, botao);
  if (pacienteTemConflito(state.usuario.id, data, hora)) {
    const minha = state.consultas.find(c => c.pacienteId === state.usuario.id && ['confirmada', 'fila'].includes(c.status)
      && getHorario(c.horarioId)?.data === data && getHorario(c.horarioId)?.hora === hora);
    agendamento.resultado = { data, hora, modalidade: h.modalidade, agenda: nomeAgendaAgendamento(), fila: minha?.status === 'fila' };
    agendamento.passo = 'ok';
    render();
    window.scrollTo(0, 0);
  }
}

function concluirAgendamento(destino){
  agendamento = null;
  state.agendaAberta = false;
  if (destino === 'consultas') { state.profissionalSelecionadoId = null; irParaAba('consultas'); }
  else render();
}

    corpo = `

      const semana = dt.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');

  else if (passo === 3) {

  return `${barraNavegacao()}<div class="max-w-4xl mx-auto px-4 py-6">${corpo}</div>`;

function tempoRelativo(iso){
  const ms = Date.now() - new Date(iso).getTime();
  const min = Math.round(ms / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h}h`;
  const d = Math.round(h / 24);
  return d === 1 ? 'ontem' : `${d} dias`;
}

  if (ehPaciente && n.ofertaEncaixeId) return abrirOfertaEncaixe(n.ofertaEncaixeId);
  if (!n.consultaId) return;

async function carregarEmailConta(){
  try { const { data } = await supabaseClient.auth.getUser(); contaEmailCache = data?.user?.email || ''; render(); } catch (e) {}
}
async function alterarSenhaConta(){
  const s1 = document.getElementById('conta-senha1')?.value || '';
  const s2 = document.getElementById('conta-senha2')?.value || '';
  if (s1.length < 8 || !/[A-Za-z]/.test(s1) || !/\d/.test(s1)) return mensagemErro('Use pelo menos 8 caracteres, com letra e número.');
  if (s1 !== s2) return mensagemErro('As senhas não coincidem.');
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: s1 });
    if (error) throw error;
    mostrarToast('Senha alterada com sucesso.', 'success');
    document.getElementById('conta-senha1').value = '';
    document.getElementById('conta-senha2').value = '';
  } catch (erro) {
    mensagemErro(/different from the old/i.test(erro?.message || '') ? 'A nova senha precisa ser diferente da atual.' : (erro?.message || 'Não foi possível alterar a senha.'));
  }
}
function exportarMeusDados(){
  const ehPaciente = state.usuario.tipo === 'paciente';
  const consultas = state.consultas.filter(c => ehPaciente ? c.pacienteId === state.usuario.id : String(getHorario(c.horarioId)?.profissionalId) === String(state.usuario.id))
    .map(c => { const h = getHorario(c.horarioId); return { data: h?.data, hora: h?.hora, modalidade: h?.modalidade, status: c.status, profissional: getProfissional(h?.profissionalId)?.nome, paciente: ehPaciente ? undefined : getPaciente(c.pacienteId)?.nome }; });
  const dados = { exportadoEm: new Date().toISOString(), conta: { nome: state.usuario.nome, email: contaEmailCache, tipo: state.usuario.tipo, telefone: state.usuario.telefone || undefined }, consultas,
    notificacoes: state.notificacoes.filter(n => (ehPaciente ? n.pacienteId : n.profissionalId) === state.usuario.id).map(n => ({ tipo: n.tipo, mensagem: n.mensagem, criadaEm: n.criadaEm })) };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

}

// P20–P21 — remarcar
async function abrirRemarcar(consultaId){
  const c = state.consultas.find(x => x.id === consultaId);
  const h = c && getHorario(c.horarioId);
  if (!c || !h) return;
  try { await carregarAgendaPacienteSupabase(h.profissionalId); } catch (e) { return; }
  remarcarEstado = { consultaId, data: null, semanaInicio: hojeISO(), horarioId: null, passo: 1 };
  const primeira = (() => { for (let i = 0; i < 120; i++) { const d = adicionarDiasISO(hojeISO(), i); if (slotsRemarcar(d).length) return d; } return hojeISO(); })();
  remarcarEstado.data = primeira; remarcarEstado.semanaInicio = primeira;
  abrirPagina('remarcar', consultaId);

function slotsRemarcar(data){

  return state.horarios.filter(x => x.id !== atual.id && x.profissionalId === atual.profissionalId && x.agendaId === atual.agendaId && x.data === data
    && x.status === 'livre' && horarioDisponivelParaPaciente(x) && !dentroJanelaExclusividade(x) && !horarioJaEncerrado(x.data, x.hora)
    && !horarioBloqueado(x.profissionalId, x.data, x.agendaId) && !pacienteTemConflito(state.usuario.id, x.data, x.hora))
    .sort((a, b) => a.hora.localeCompare(b.hora));
}
function remarcarSet(campo, valor){

async function abrirOfertaEncaixe(ofertaId){
  const o = (state.ofertasEncaixe || []).find(x => String(x.id) === String(ofertaId));
  if (!o) return mensagemErro('Oferta não encontrada.');
  let vaga = state.horarios.find(h => h.supabaseId === o.horarioLivreId);
  if (!vaga) {
    try {
      const { data } = await supabaseClient.from('horarios').select('data, hora, modalidade').eq('id', o.horarioLivreId).maybeSingle();
      if (data) vaga = { data: data.data, hora: String(data.hora).slice(0, 5), modalidade: data.modalidade };
    } catch (e) {}
  }
  abaPaciente = 'consultas';
  abrirPagina('oferta', o.id, { vaga });
}
async function aceitarOfertaPagina(id, botao){
  if (botao) { botao.disabled = true; botao.textContent = 'Aceitando...'; }
  const o = (state.ofertasEncaixe || []).find(x => x.id === id);
  const antes = o && getHorario(state.consultas.find(c => c.id === o.consultaId)?.horarioId);
  const antesTxt = antes ? dataHoraCurta(antes) : '';
  await aceitarEncaixe(id);
  const depois = (state.ofertasEncaixe || []).find(x => x.id === id);
  if (depois?.status === 'aceita') abrirPagina('oferta', id, { ...(paginaExtra?.dados || {}), aceita: true, antesTxt });
}

  await recusarEncaixe(id);

function navegarAgenda(delta){
  if (delta === 0) state.diaSelecionado = hojeISO();
  else if (visaoAgendaProfissional === 'semana') state.diaSelecionado = adicionarDiasISO(state.diaSelecionado, 7 * delta);
  else if (visaoAgendaProfissional === 'mes') { const d = dataParaDate(state.diaSelecionado); d.setDate(1); d.setMonth(d.getMonth() + delta); state.diaSelecionado = dateParaISO(d); }
  else state.diaSelecionado = adicionarDiasISO(state.diaSelecionado, delta);
  render();
}
function rotuloPeriodoAgenda(){
  if (visaoAgendaProfissional === 'semana') { const d = datasDaSemana(state.diaSelecionado); return `${d[0].slice(8)}/${d[0].slice(5, 7)} – ${d[6].slice(8)}/${d[6].slice(5, 7)}`; }
  if (visaoAgendaProfissional === 'mes') { const s = dataParaDate(state.diaSelecionado).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
  return formatarDataCurta(state.diaSelecionado);
}

async function salvarPerfilProfissional(){
  const v = id => (document.getElementById(id)?.value || '').trim();
  const dados = { p_nome: v('perf-nome'), p_profissao: v('perf-profissao'), p_especialidade: v('perf-especialidade'), p_descricao: v('perf-descricao'),
    p_modalidade: v('perf-modalidade') || 'presencial', p_local: v('perf-local'), p_clinica: v('perf-clinica') };
  if (!dados.p_nome || !dados.p_profissao) return mensagemErro('Nome e profissão são obrigatórios.');
  try {
    const { error } = await supabaseClient.rpc('atualizar_perfil_profissional_vezzo', dados);
    if (error) throw error;
    const p = getProfissional(state.usuario.id);
    if (p) Object.assign(p, { nome: dados.p_nome, profissao: dados.p_profissao, especialidade: dados.p_especialidade || dados.p_profissao, descricao: dados.p_descricao, modalidadeAtendimento: dados.p_modalidade, localAtendimento: dados.p_local, clinicaNome: dados.p_clinica });
    state.usuario.nome = dados.p_nome;
    state.usuario.profissao = dados.p_profissao;
    salvarDados();
    mostrarToast('Perfil atualizado.', 'success');
    render();
  } catch (erro) {
    console.error('Erro ao salvar perfil:', erro);
    mensagemErro(erro?.message || 'Não foi possível salvar o perfil.');
  }
}

      <button onclick="irAcesso('login',{manterDraft:true})" class="btn-primary w-full py-2.5 text-sm font-medium mt-5">Ir para o login</button>`;

  return `
    <div class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full ${t === 'escolha' ? 'max-w-lg' : 'max-w-sm'}">
        <div class="text-center mb-6">
          <canvas id="fluxo-hero" width="220" height="72"></canvas>

          ${corpo}

}

function validarSenhaNova(erros){
  const senha = acessoDraft.senha || '';
  if (!senha) erros.senha = 'Campo obrigatório';
  else if (senha.length < 8 || !/[A-Za-z]/.test(senha) || !/\d/.test(senha)) erros.senha = 'Use pelo menos 8 caracteres, com letra e número.';
  if (!erros.senha && (acessoDraft.senha2 || '') !== senha) erros.senha2 = 'As senhas não coincidem.';
}

function validarDadosAcesso(erros){
  if (!(acessoDraft.nome || '').trim()) erros.nome = 'Campo obrigatório';
  const email = (acessoDraft.email || '').trim();
  if (!email) erros.email = 'Campo obrigatório';
  else if (!EMAIL_RE.test(email)) erros.email = 'Informe um e-mail válido (ex.: nome@email.com)';
  const tel = (acessoDraft.telefone || '').trim();
  if (tel && !normalizarTelefoneBR(tel)) erros.telefone = 'Informe o celular com DDD.';
  validarSenhaNova(erros);
}

async function enviarCadastroPaciente(){
  lerCamposAcesso();
  acessoDraft.tipo = 'paciente';
  const erros = {};
  validarDadosAcesso(erros);
  if (!acessoDraft.termos) erros.termos = 'É preciso aceitar os termos para criar a conta.';
  if (Object.keys(erros).length) return mostrarErrosAcesso(erros);
  await fazerCadastro();
}

function avancarCadastroProfissional(){
  lerCamposAcesso();
  acessoDraft.tipo = 'profissional';
  const erros = {};
  validarDadosAcesso(erros);
  if (Object.keys(erros).length) return mostrarErrosAcesso(erros);
  irAcesso('cad-prof-2', { manterDraft: true });
}

async function enviarCadastroProfissional(){
  lerCamposAcesso();
  const erros = {};
  if (!(acessoDraft.profissao || '').trim()) erros.profissao = 'Campo obrigatório';
  if ((acessoDraft.modalidade || 'presencial') !== 'online' && !(acessoDraft.local || '').trim()) erros.local = 'Informe onde você atende.';
  if (!acessoDraft.termos) erros.termos = 'É preciso aceitar os termos para criar a conta.';
  if (Object.keys(erros).length) return mostrarErrosAcesso(erros);
  await fazerCadastro();
}

// As telas de acesso substituem a tela de login antiga
telaLogin = function(){ return telaAcessoHtml(); };

// ===== RECUPERAÇÃO DE SENHA =====
const URL_SITE_VEZZO = 'https://brennoo05.github.io/Vezzo/';

function abrirRecuperarSenha(){ irAcesso('recuperar', { manterDraft: true }); }

async function enviarRecuperacaoSenha(reenviar = false){
  if (!reenviar) lerCamposAcesso();
  const email = (acessoDraft.email || '').trim();
  if (!EMAIL_RE.test(email)) return mostrarErrosAcesso({ email: email ? 'Informe um e-mail válido (ex.: nome@email.com)' : 'Campo obrigatório' });
  const botao = document.getElementById('btn-enviar-recuperacao');
  if (botao) { botao.disabled = true; botao.textContent = 'Enviando...'; }
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: URL_SITE_VEZZO });
    if (error) throw error;
    // Mesma tela exista ou não a conta (não revela quais e-mails estão cadastrados)
    if (reenviar) mostrarToast('E-mail reenviado.');
    irAcesso('recuperar-enviado', { manterDraft: true });
  } catch (erro) {
    console.error('Erro ao enviar recuperação de senha:', erro);
    if (botao) { botao.disabled = false; botao.textContent = reenviar ? 'Reenviar e-mail' : 'Enviar link de recuperação'; }
    const msg = /rate limit|seconds/i.test(erro?.message || '')
      ? 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.'
      : 'Não foi possível enviar o e-mail agora. Tente novamente.';
    if (reenviar) mensagemErro(msg); else mostrarErrosAcesso({ geral: msg });
  }
}

function abrirNovaSenha(){
  if (document.getElementById('modal-nova-senha')) return;
  const modal = document.createElement('div');
  modal.id = 'modal-nova-senha';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="card bg-white p-6 max-w-md w-full" role="dialog" aria-modal="true" aria-labelledby="titulo-nova-senha">
      <h3 id="titulo-nova-senha" class="font-display text-xl">Criar nova senha</h3>
      <p class="text-sm text-[var(--ink-soft)] mt-2">Escolha uma senha que você ainda não usou.</p>
      <label for="nova-senha-1" class="text-xs text-[var(--ink-soft)] block mb-1 mt-4">Nova senha</label>
      <input id="nova-senha-1" type="password" autocomplete="new-password" class="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm">
      <label for="nova-senha-2" class="text-xs text-[var(--ink-soft)] block mb-1 mt-3">Repita a nova senha</label>
      <input id="nova-senha-2" type="password" autocomplete="new-password" class="w-full border border-[var(--line)] rounded-lg px-3 py-2 text-sm">
      <ul class="text-xs text-[var(--ink-soft)] mt-2 space-y-0.5"><li>• Mínimo de 8 caracteres</li><li>• Pelo menos uma letra e um número</li></ul>
      <button id="btn-salvar-nova-senha" onclick="salvarNovaSenha()" class="btn-primary w-full py-2.5 mt-5 text-sm font-medium">Salvar nova senha</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('nova-senha-1')?.focus();
}

async function salvarNovaSenha(){
  const s1 = document.getElementById('nova-senha-1')?.value || '';
  const s2 = document.getElementById('nova-senha-2')?.value || '';
  if (s1.length < 8 || !/[A-Za-z]/.test(s1) || !/\d/.test(s1)) return mensagemErro('Use pelo menos 8 caracteres, com letra e número.');
  if (s1 !== s2) return mensagemErro('As senhas não são iguais.');
  const botao = document.getElementById('btn-salvar-nova-senha');
  if (botao) { botao.disabled = true; botao.textContent = 'Salvando...'; }
  try {
    const { error } = await supabaseClient.auth.updateUser({ password: s1 });
    if (error) throw error;
    document.getElementById('modal-nova-senha')?.remove();
    history.replaceState(null, '', location.pathname + location.search);
    mostrarToast('Senha alterada com sucesso!', 'success');
  } catch (erro) {
    console.error('Erro ao salvar nova senha:', erro);
    if (botao) { botao.disabled = false; botao.textContent = 'Salvar nova senha'; }
    mensagemErro(/different from the old/i.test(erro?.message || '')
      ? 'A nova senha precisa ser diferente da anterior.'
      : (erro?.message || 'Não foi possível alterar a senha. Peça um novo link.'));
  }
}

// Quando o cliente volta pelo link do e-mail, o Supabase avisa com o evento PASSWORD_RECOVERY
supabaseClient.auth.onAuthStateChange(evento => {
  if (evento === 'PASSWORD_RECOVERY') abrirNovaSenha();
});
if (/type=recovery/.test(location.hash)) {
  setTimeout(abrirNovaSenha, 0);
}

restaurarSessaoSupabase();

setInterval(() => {
  const n = state.notificacoes.length;
  processarLembretes();
  salvarDados();
  if (state.notificacoes.length !== n) render();
}, 60000);

// Recarrega horários e consultas do profissional sem perder a agenda selecionada
async function recarregarAgendaProfissional(){
  const agendaAtualSupabaseId = state.agendas.find(a => a.id === agendaSelecionadaId)?.supabaseId;
  try {
    await carregarAgendasHorariosSupabase(state.usuario.id);
    const mesmaAgenda = state.agendas.find(a => a.supabaseId === agendaAtualSupabaseId);
    if (mesmaAgenda) agendaSelecionadaId = mesmaAgenda.id;
  } catch (erro) {
    console.error('Erro ao atualizar a agenda:', erro);
  }
}

// Busca notificações novas e, se for profissional, atualiza a agenda também
async function atualizarNotificacoesEAgenda(){
  if (!state.usuario) return;
  const chegouNova = await carregarNotificacoesSupabase();
  if (chegouNova && state.usuario?.tipo === 'profissional') {
    await recarregarAgendaProfissional();
  }
  let mudouEncaixe = false;
  if (state.usuario?.tipo === 'paciente') {
    if (chegouNova) {
      try { await carregarConsultasPacienteSupabase(); } catch (e) { console.error(e); }
    }
    mudouEncaixe = await carregarEncaixeSupabase();
  }
  if (chegouNova || mudouEncaixe) render();
}

// ===== REALTIME: avisa na hora quando entra uma notificação nova =====
let canalNotificacoes = null;

function assinarNotificacoesRealtime(){
  pararNotificacoesRealtime();
  if (!state.usuario || !['paciente', 'profissional'].includes(state.usuario.tipo)) return;
  const coluna = state.usuario.tipo === 'paciente' ? 'paciente_id' : 'profissional_id';

  canalNotificacoes = supabaseClient
    .channel('notificacoes-' + state.usuario.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'notificacoes', filter: `${coluna}=eq.${state.usuario.id}` },
      () => atualizarNotificacoesEAgenda())
    .subscribe();
}

function pararNotificacoesRealtime(){
  if (canalNotificacoes) {
    supabaseClient.removeChannel(canalNotificacoes);
    canalNotificacoes = null;
  }
}

// Plano B: se o Realtime cair, ainda confere a cada 60 segundos
setInterval(atualizarNotificacoesEAgenda, 60000);

</script>
